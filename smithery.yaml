startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      writavoApiKey:
        type: string
        title: Writavo API key
        description: "A secret key (wv_sk_) or a publishable key (wv_pub_) from https://app.writavo.com/settings/api-keys. Optional: without one, only the offline API reference tool works."
    required: []
  commandFunction:
    command: npx
    args:
      - "-y"
      - "@writavo/mcp-server"
    env:
      WRITAVO_API_KEY: "{{config.writavoApiKey}}"
