      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/EntryCreate" }
      responses:
        "201":
          description: The new entry.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /entries/{type}/{id}:

    parameters:

      - name: type
        in: path
        required: true
        description: The API id of the entry's content type (a collection or singleton).
        schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$", examples: ["product"] }

      - name: id
        in: path
        required: true
        description: The entry's id or, to read, its slug.
        schema: { type: string }

    get:
      operationId: getEntry
      tags: [Entries]
      summary: Read an entry
      description: |
        One entry, by id or slug. The `ETag` header versions it for `If-Match`.
      x-scope: entries:read
      x-permission: none
