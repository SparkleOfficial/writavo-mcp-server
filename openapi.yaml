  # ==========================================================================
  # API KEYS  (specified here; implemented in API-2)
  # ==========================================================================
  /keys:
    get:
      operationId: listApiKeys
      tags: [API keys]
      summary: List API keys
      description: |
        Metadata only. The secret itself is shown once, at creation, and is never retrievable
        afterwards because only a hash is stored. `key_prefix` is the displayable fragment you
        use to tell keys apart.

        Requires a secret key carrying `keys:read`. A publishable key can never read this.
      x-scope: keys:read
      x-permission: api_keys.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      responses:
        "200":
          description: A page of keys.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
    post:
      operationId: createApiKey
      tags: [API keys]
      summary: Create an API key
      description: |
        Returns the secret exactly once, in `data.secret`. Store it immediately. There is no way
        to recover it later, and support cannot retrieve it for you.

        A key can never be created with more authority than its creator has. The scopes you
        request are intersected with the creator's own permissions, and the granted set comes
        back in `data.scopes`. If you asked for something you do not hold, the key is still
        created, without it. Compare what you asked for against what you got.

        A secret key's authority is also re-evaluated on every request against its creator's
        live permissions, so revoking a person's access immediately narrows every key they made.

        **A retry does not give you the secret again.** `Idempotency-Key` guarantees you created
        one key rather than two, and a replayed response returns the key's `id`, `kind`,
        `key_prefix` and `scopes` with `secret: null` and `secret_replayable: false`. The secret
        is never stored anywhere, including in the idempotency record, because storing it would
        put a live credential in a database backup. If you lost it, rotate the key.
      x-scope: keys:write
      x-permission: api_keys.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, scopes]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: A label for humans. Say where the key lives, so you know what breaks if you revoke it.
                kind: { $ref: "#/components/schemas/KeyKind" }
                scopes:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Scope" }
                expires_at:
                  type: [string, "null"]
                  format: date-time
                  description: Optional expiry. After it passes the key returns `401 API_KEY_EXPIRED`.
      responses:
        "201":
          description: The key was created. This is the only time the secret is returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/ApiKey"
                          - type: object
                            required: [secret]
                            properties:
                              secret:
                                type: string
                                description: The full key. Shown once. Never retrievable again.
                                # API-2: the issued shape is prefix + 32 base64url chars from 24
                                # random bytes. No `live_` segment: environment is a column, not
                                # part of the string (there is no test mode in v1).
                                examples: ["wv_sk_EXAMPLE0000000000000000000000000000"]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /keys/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    post:
      operationId: rotateApiKey
      tags: [API keys]
      summary: Rotate an API key
      description: |
        Issues a new secret for the same key record, keeping its name, and returns it once.

        Only the person who created the key, an organisation owner or a platform admin may rotate
        it: a rotation hands over a live credential that keeps acting with its creator's
        permissions. Anyone else with `api_keys.manage` gets `403 INSUFFICIENT_SCOPE`. The new
        secret's scopes are the old key's scopes limited to what the caller could grant today, and
        a rotation that would leave no scopes is refused with `403 INSUFFICIENT_SCOPE`.

        As with creation, a replayed retry returns `secret: null` and `secret_replayable: false`
        rather than handing out the credential a second time. Rotate again if you lost it.

        Set `grace_seconds` to keep the old secret working while you deploy the new one. During
        the grace window both work. After it, the old one returns `401 API_KEY_REVOKED`. A grace
        of `0` cuts the old secret off immediately, which is the right choice if you are rotating
        because it leaked.
      x-scope: keys:write
      x-permission: api_keys.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                grace_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
                  default: 0
      responses:
        "200":
          description: Rotated. The new secret is returned once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/ApiKey"
                          - type: object
                            required: [secret]
                            properties:
                              secret: { type: string, description: The new key. Shown once. }
                              previous_valid_until:
                                type: [string, "null"]
                                format: date-time
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /keys/{id}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    delete:
      operationId: revokeApiKey
      tags: [API keys]
      summary: Revoke an API key
      description: |
        Immediate and permanent. The key record is kept, marked revoked, so the audit trail
        survives, but the secret stops working at once and returns `401 API_KEY_REVOKED`.

        Revoking the key you are calling with is allowed. It is the last request that key makes.
      x-scope: keys:write
      x-permission: api_keys.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      responses:
        "204":
          description: Revoked. No body.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ==========================================================================
  # WEBHOOKS
  #
  # VERIFYING A DELIVERY. Do this before you parse the body; an unverified webhook endpoint is
  # an unauthenticated write path into your system.
  #
  #   1. read the raw request body as BYTES, before any JSON parse
  #   2. signed   = `${Writavo-Timestamp}.${rawBody}`
  #   3. expected = hex(HMAC_SHA256(your_signing_secret, signed))
  #   4. compare the `Writavo-Signature` header, which is `v1=<hex>`, to `v1=<expected>`,
  #      using a constant-time comparison
  #   5. reject if |now - Writavo-Timestamp| > 300 seconds
  #
  # The timestamp is inside the signed material, which is the whole reason it is sent: a captured
  # payload cannot be replayed later, because its signature only validates against the timestamp
  # it was signed with.
  #
  # Headers on every delivery: Writavo-Signature, Writavo-Timestamp, Writavo-Event,
  # Writavo-Delivery (this attempt) and Writavo-Attempt (1 to 6).
  #
  # DELIVERY IS AT LEAST ONCE. Retries use exponential backoff at roughly 1m, 5m, 15m, 1h and 6h,
  # six attempts in all. Answer 2xx as soon as you have durably accepted the event, and do the
  # work afterwards: a handler that finishes its work before answering will be retried while it
  # is still running. Deduplicate on the payload's `id`.
  # ==========================================================================
  /webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List webhook endpoints
      x-scope: webhooks:read
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of webhook endpoints.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Create a webhook endpoint
      description: |
        Registers a URL to receive signed event deliveries. The signing secret is returned once,
        at creation, and never again: record it before you close the response. If you lose it,
        `POST /webhooks/{id}/rotate-secret` issues a new one.

        Verify every delivery, using the recipe at the top of this section, before you parse the
        body.

        The URL must be public HTTPS. Private, loopback, link-local and metadata addresses are
        refused, and so is a hostname that resolves to one, at save time and again at delivery
        time. A webhook cannot be pointed at internal infrastructure.

        Delivery is at least once. Retries use exponential backoff, and an endpoint that keeps
        failing is disabled automatically and reported to you. Deduplicate on the payload's `id`
        and make your handler idempotent.

        A Site may register at most ten endpoints.
      x-scope: webhooks:write
      x-permission: integrations.manage
      x-entitlement: cms.webhooks
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              additionalProperties: false
              properties:
                url: { type: string, format: uri, examples: ["https://example.com/hooks/writavo"] }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                description: { type: [string, "null"], maxLength: 200 }
      responses:
        "201":
          description: The endpoint was created. The signing secret is returned once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Webhook"
                          - type: object
                            required: [signing_secret]
                            properties:
                              signing_secret: { type: string, description: Shown once. Never retrievable again. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      operationId: getWebhook
      tags: [Webhooks]
      summary: Read one webhook endpoint
      x-scope: webhooks:read
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      x-cross-tenant: 404
      responses:
        "200":
          description: The webhook endpoint.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: updateWebhook
      tags: [Webhooks]
      summary: Update a webhook endpoint
      description: |
        Change the URL, the subscribed events, or re-enable an endpoint that was auto-disabled
        after repeated failures. Re-enabling does not replay what you missed.
      x-scope: webhooks:write
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                description: { type: [string, "null"], maxLength: 200 }
                enabled: { type: boolean }
      responses:
        "200":
          description: The updated webhook endpoint.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      description: Deliveries stop at once. Queued retries for this endpoint are dropped.
      x-scope: webhooks:write
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      responses:
        "204":
          description: Deleted. No body.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhooks/{id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: Rotate the signing secret
      description: |
        Issues a new signing secret and returns it once. The old secret stops working
        immediately: there is no grace window, because a window in which two secrets both
        validate is a window in which a leaked secret still works.

        Deliveries sent between the rotation and your receiver being updated will fail
        verification. They are retried on the normal backoff, so update the receiver promptly and
        the queue drains itself.
      x-scope: webhooks:write
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      responses:
        "200":
          description: The new signing secret. Shown once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, signing_secret]
                        properties:
                          id: { type: string, format: uuid }
                          signing_secret: { type: string, description: Shown once. Never retrievable again. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhooks/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: List deliveries for an endpoint
      description: |
        The delivery log, newest first. Use it to answer "did you send it and did we accept it".
        `response_status` is what your server returned; `attempt` counts from 1 to 6.

        There is one row per ATTEMPT, and every attempt of one event shares its `event_id`. A row
        with `status: failed` and `exhausted: false` will be retried; `exhausted: true` means the
        ladder gave up.
      x-scope: webhooks:read
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, delivered, failed]
        - name: event
          in: query
          required: false
          description: Return only attempts for this event type.
          schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/WebhookDelivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhooks/{id}/deliveries/{delivery_id}/redeliver:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
      - $ref: "#/components/parameters/WebhookDeliveryId"
    post:
      operationId: redeliverWebhookDelivery
      tags: [Webhooks]
      summary: Send one delivery again
      description: |
        Queues the same event for delivery again, with the same `event_id` and byte-identical
        body, so your handler sees it as the event it already knows how to deduplicate rather
        than as a second, different fact. Use it after fixing a receiver that was down.

        The attempt counter starts again at 1: this is a fresh ladder you asked for, not a
        continuation of the one that failed. The endpoint must be enabled.
      x-scope: webhooks:write
      x-permission: integrations.manage
      x-entitlement: cms.webhooks
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      responses:
        "202":
          description: Queued. It will be attempted within the minute.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, status, attempt]
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The id of the NEW attempt, not of the one you asked to repeat.
                          status: { type: string, const: pending }
                          attempt: { type: integer, const: 1 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ==========================================================================
  # AUTHENTICATION (device sign-in)
  # ==========================================================================
  /auth/device:
    post:
      operationId: startDeviceAuthorization
      tags: [Device sign-in]
      summary: Start a device sign-in
      description: |
        Starts a sign-in for a command line tool or MCP client, modelled on the OAuth device
        authorization grant (RFC 8628). Takes no API key: this is how a client comes to have one.

        **The client generates the key.** Create a secret the same shape as ours, `wv_sk_`
        followed by 32 base64url characters (24 random bytes), keep it private, and send only its
        SHA-256 as `key_hash` plus its first 12 characters as `key_prefix`. The secret never
        leaves your machine; approval registers its hash as an ordinary secret key.

        Show the person `verification_uri_complete` (or `verification_uri` and `user_code`). They
        sign in to the dashboard, or create an account first, choose a Site, and approve. Then
        poll `POST /auth/device/token` every `interval` seconds until it says `approved`, and
        start using your key. The request expires after `expires_in` seconds.

        The key is created for the approving person, on the Site they choose, with the scopes you
        asked for that they are allowed to grant, and expires after 90 days. It appears under
        Settings > API keys, where it can be revoked like any other.

        `flow: "oauth"` is reserved for Writavo's own hosted MCP server, which runs this sign-in
        on a person's behalf behind its OAuth consent. Sent by anything else it is refused with
        `403 FORBIDDEN`: leave `flow` out.
      security: []
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: auth
      x-publishable: false
      parameters:
        - $ref: "#/components/parameters/McpWorker"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_name, key_hash, key_prefix, scopes]
              properties:
                flow:
                  type: string
                  enum: [device, oauth]
                  default: device
                  description: |
                    `device` (the default) for a command line tool or a local MCP client. `oauth`
                    only from Writavo's hosted MCP server, with its `X-Writavo-Mcp-Worker` header;
                    from anything else it is `403 FORBIDDEN`.
                redirect_host:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 253
                  description: |
                    `oauth` only. The host of the AI client's registered redirect URI, shown
                    prominently on the consent screen so the person can recognise where access is
                    going. Sent with `flow: device` it is `422 VALIDATION_FAILED`.
                client_name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: What the person sees on the approval screen, such as the name of your tool.
                client_host:
                  type: [string, "null"]
                  maxLength: 120
                  description: The machine asking, such as its hostname, so the person can recognise it.
                key_hash:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: SHA-256 of the full secret key you generated, as lower-case hex.
                key_prefix:
                  type: string
                  pattern: "^wv_sk_[A-Za-z0-9_-]{6}$"
                  description: The first 12 characters of that key, shown in the dashboard to identify it.
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items: { $ref: "#/components/schemas/Scope" }
                  description: |
                    The scopes you want. The key receives those the approving person may grant on
                    the Site they pick; the rest are dropped.
      responses:
        "201":
          description: The sign-in is waiting for approval.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
                        properties:
                          device_code:
                            type: string
                            description: Opaque. Keep it private and send it when you poll.
                          user_code:
                            type: string
                            pattern: "^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$"
                            description: What the person confirms on the approval screen.
                          verification_uri: { type: string, format: uri }
                          verification_uri_complete:
                            type: string
                            format: uri
                            description: The approval page with the code filled in. Show this one when you can.
                          expires_in: { type: integer, const: 1800 }
                          interval:
                            type: integer
                            const: 5
                            description: Seconds to wait between polls.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/device/token:
    post:
      operationId: pollDeviceAuthorization
      tags: [Device sign-in]
      summary: Poll a device sign-in
      description: |
        Reports whether the person has approved the sign-in. It returns an outcome, never a
        credential: on `approved`, the key you generated is live, and the response says which
        Site it belongs to, which scopes it carries and when it expires.

        `pending` means keep waiting. `slow_down` means you polled faster than `interval`; wait
        the `interval` it returns before the next poll. `denied` and `expired` are final: start
        again with a new key.
      security: []
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: auth
      x-publishable: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_code]
              properties:
                device_code: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: The current outcome.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status:
                            type: string
                            enum: [pending, slow_down, approved, denied, expired]
                          interval:
                            type: integer
                            description: Present on `slow_down`. Seconds to wait before polling again.
                          key:
                            type: object
                            description: Present on `approved`.
                            properties:
                              id: { type: string, format: uuid }
                              key_prefix: { type: string }
                              scopes:
                                type: array
                                items: { $ref: "#/components/schemas/Scope" }
                              expires_at: { type: [string, "null"], format: date-time }
                          website:
                            type: object
                            description: Present on `approved`. The Site the key belongs to.
                            properties:
                              id: { type: string, format: uuid }
                              name: { type: string }
                          callback_nonce_hash:
                            type: string
                            pattern: "^[0-9a-f]{64}$"
                            description: |
                              Present only for an OAuth sign-in (Writavo's hosted MCP server), on
                              `approved`: the SHA-256, as lower-case hex, of the one-time nonce the
                              dashboard put on the approving browser's callback URL. The server
                              completes the sign-in only for the browser whose nonce matches. A
                              device sign-in never carries it.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/key/extend:
    post:
      operationId: extendApiKey
      tags: [API keys]
      summary: Extend the calling key's expiry
      description: |
        Pushes the expiry of the key you are calling with further out, so a sign-in that is in
        regular use does not stop working after 90 days. Acts on the calling key only: there is
        no id to send.

        Only a key obtained through a device or OAuth sign-in can extend itself, and only while
        it is live, its creator can still manage API keys on the Site, and the organisation has
        not turned AI agent access off. Anything else is `403 FORBIDDEN` with the reason. A key
        made in the dashboard keeps the expiry the person chose.

        Nothing changes until the key is within 30 days of expiry; before that you get
        `extended: false` and the current `expires_at`, so it is safe to call on every start. An
        extension moves the expiry to 90 days from now, but never past 365 days from the key's
        creation (`extended: false`, `reason: max_lifetime`), after which a person signs in
        again. Needs no scope; a publishable key gets `403 INSUFFICIENT_SCOPE`.
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      responses:
        "200":
          description: The key's expiry, extended or not.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [key, extended]
                        properties:
                          key:
                            type: object
                            required: [id, expires_at]
                            properties:
                              id: { type: string, format: uuid }
                              expires_at: { type: [string, "null"], format: date-time }
                          extended:
                            type: boolean
                            description: True when this call moved `expires_at`.
                          reason:
                            type: string
                            enum: [max_lifetime]
                            description: Present when the key is due and still could not be extended.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/key/revoke:
    post:
      operationId: revokeCurrentApiKey
      tags: [API keys]
      summary: Revoke the calling key
      description: |
        Revokes the key you are calling with, immediately. It is the last request that key makes;
        every later one returns `401 API_KEY_REVOKED`. This is what signing out of a command line
        tool or an MCP client should call, so the credential ends on the server rather than only
        being forgotten on the machine.

        Any secret key may revoke itself, whatever its scopes. Acts on the calling key only:
        there is no id to send. To revoke a different key use `DELETE /keys/{id}`.
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [revoked]
                        properties:
                          revoked: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

# ============================================================================
# COMPONENTS
# ============================================================================
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <key>`.

        Two kinds of key, distinguished by their prefix:

        - **`wv_pub_`, publishable.** Safe in a browser or a mobile app. Read only, and it can
          only see content at `status: published`. It cannot read drafts, cannot write, and
          cannot see keys, usage, media, the pipeline queue or webhooks. The operations it may
          reach are marked `x-publishable: true`; everything else is `403 INSUFFICIENT_SCOPE`
          for a publishable key regardless of its scopes.
        - **`wv_sk_`, secret.** Server side only. Never ship one to a client, and never commit
          one. It can carry any scope.

        A secret key's authority is its creator's live permissions intersected with the scopes
        it was given. Narrowing or removing that person's access narrows every key they created,
        on the next request. A key never outranks the person who made it.

        Only a hash is stored. A lost key cannot be recovered, only rotated.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The opaque cursor from `data.next_cursor` on the previous page. Do not parse it or
        construct one; its encoding is not part of this contract and will change.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Values above the maximum are clamped rather than rejected, so a client asking
        for a thousand rows gets a hundred and a `next_cursor`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A unique key you generate per logical operation, 1 to 255 printable ASCII characters. A
        UUID is the obvious choice.

        Retry with the **same** key and the same body and you get the original response replayed
        rather than a second object. This is what makes a network timeout safe: you never know
        whether the first request landed, so you retry with the same key and find out.

        Same key with a **different** body is `409 IDEMPOTENCY_KEY_CONFLICT`, because reusing a
        key for different work is a bug in your client rather than a retry. Same key while the
        first request is still running is `409 IDEMPOTENCY_KEY_IN_FLIGHT`; wait and retry.

        Keys are scoped to the Site and the endpoint, and are retained for 24 hours. After that
        the same key is a new operation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The `ETag` from your last read of this object. If it has changed since then you get
        `412 PRECONDITION_FAILED` and your write is not applied, so two people editing the same
        article cannot silently overwrite each other.

        Optional in v1 for compatibility. Omitting it means last write wins. Send it.
      schema: { type: string }
    WritavoApproval:
      name: Writavo-Approval
      in: header
      required: false
      description: |
        The `error.approval.id` from a `428 APPROVAL_REQUIRED`, sent on the retry once a person
        has approved it. Only meaningful for a key approved for an AI agent; every other caller
        can leave it out. It is single use and bound to the key, to the exact request that
        asked for it (method, path and body) and to what that request would do: anything else,
        including a request whose effect changed since it was approved, is `409 APPROVAL_INVALID`.
      schema: { type: string, format: uuid }
    McpTool:
      name: Writavo-Mcp-Tool
      in: header
      required: false
      description: |
        The MCP tool that made this call, such as `delete_article`. Accepted on every operation.
        It is a decision input in one direction only, toward more gating: a request that carries
        it (or arrives through Writavo's hosted MCP server) is treated as an AI agent's request for
        approvals and for the AI agent call log, whatever key it uses, so approval-gated operations
        ask a person first even with a key made in the dashboard. The organisation's AI agent
        on/off switch still follows only the key's origin. It never widens what a request is
        allowed to do, and a value that is not a lower-case tool name is logged as unknown rather
        than refused.
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
    McpWorker:
      name: X-Writavo-Mcp-Worker
      in: header
      required: false
      description: |
        Sent only by Writavo's hosted MCP server, and required with `flow: "oauth"`. You do not
        have one and do not need one: leave it out and leave `flow` out.
      schema: { type: string }
    ArticleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuthorId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PipelineRunId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookDeliveryId:
      name: delivery_id
      in: path
      required: true
      schema: { type: string, format: uuid }

    PlanItemId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ContentTypeId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PromptStage:
      name: stage
      in: path
      required: true
      description: The pipeline stage whose prompt this is.
      schema: { $ref: "#/components/schemas/PromptStage" }
    CmsProvider:
      name: provider
      in: path
      required: true
      schema: {type: string, enum: [wordpress, ghost]}
    CompetitorId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    KeywordId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ContentGapId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    LinkOpportunityId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DisavowEntryId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: user_id
      in: path
      required: true
      description: The member's user id, from `GET /team/members`.
      schema: {type: string, format: uuid}
    InviteId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RoleName:
      name: role
      in: path
      required: true
      description: 'The role to change. `owner` is not a value: owners always have every permission.'
      schema: {type: string, enum: [admin, editor, viewer]}
    CreditPackKey:
      name: key
      in: path
      required: true
      description: The pack's `key`, from `GET /billing/credit-packs`.
      schema: {type: string, pattern: '^[a-z0-9_-]{1,40}$'}

  headers:
    RateLimitLimit:
      description: Requests permitted in the current window for this endpoint class.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Unix seconds at which the window resets.
      schema: { type: integer }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  schemas:
    # ---- envelopes -------------------------------------------------------
    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, const: true }
        data: {}
      description: |
        Every successful response has this shape. Check `ok` before reading `data`.

    ErrorEnvelope:
      type: object
      required: [ok, error]
      additionalProperties: false
      properties:
        ok: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: |
                A short, safe for display sentence. It never contains a stack trace, SQL, an
                internal identifier, or anything belonging to another customer. Branch on `code`,
                not on this string: wording may change within v1.
            fields:
              type: object
              additionalProperties: { type: string }
              description: |
                Present on `VALIDATION_FAILED`. Maps each offending field to a message you can
                show next to the input.
            approval:
              $ref: "#/components/schemas/ApprovalRef"
            request_id:
              type: string
              description: Quote this when contacting support. It identifies the exact request in our logs.
      description: Every failed response has this shape.

    ApprovalRef:
      type: object
      required: [id, url, expires_at, status]
      description: |
        Present on `428 APPROVAL_REQUIRED` and `428 APPROVAL_PENDING`. Show `url` to the person
        who can approve the action; once they have, repeat the identical request with
        `Writavo-Approval: <id>`.
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          format: uri
          description: The dashboard page where a person approves or denies this request.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: After this the approval can no longer be used. Null only if it could not be read.
        status:
          type: string
          enum: [pending]

    ErrorCode:
      type: string
      description: |
        Stable machine readable codes. New codes may be added within v1, so treat an unknown
        code as a generic failure of its HTTP status class rather than crashing.

        | Code | HTTP | What it means |
        |---|---|---|
        | `INVALID_REQUEST` | 400 | Malformed JSON, a bad parameter, or a missing required header. |
        | `INVALID_API_KEY` | 401 | No key, an unparseable key, or one that does not exist. |
        | `API_KEY_REVOKED` | 401 | The key was revoked or rotated past its grace window. |
        | `API_KEY_EXPIRED` | 401 | The key passed its `expires_at`. |
        | `INSUFFICIENT_SCOPE` | 403 | The key is valid but lacks the scope this operation needs. For an AI agent, the message names the permission row the person must set to Read or Read and write when they reconnect. |
        | `FORBIDDEN` | 403 | Refused for a reason no scope would change: a key that may not extend itself, an OAuth sign-in not started by Writavo's MCP server, an AI agent changing the access of the person it acts for, anything to do with ownership, or a setting only a person may change. The message says which and what to do instead. |
        | `AGENT_ACCESS_DISABLED` | 403 | The key belongs to an AI agent and the organisation has turned AI agent access off. |
        | `APPROVAL_REQUIRED` | 428 | An AI agent asked for an action a person must approve. `error.approval` has the link and the id to retry with. |
        | `APPROVAL_PENDING` | 428 | The approval you sent has not been decided yet. Retry once it has. |
        | `APPROVAL_DENIED` | 403 | A person denied the action. |
        | `APPROVAL_INVALID` | 409 | The approval you sent cannot be used for this request: expired, already used, for a different request, unknown, or what the request would do has changed since it was approved. |
        | `NOT_ENTITLED` | 402 | Your plan does not include this AI pipeline capability. Upgrade. CMS capabilities are on every plan and never return this. |
        | `INSUFFICIENT_CREDITS` | 402 | The organisation cannot afford the next unit of work. Top up. |
        | `SPEND_CAP_REACHED` | 402 | This Site hit its own monthly ceiling. Raise it or wait. |
        | `PAYMENT_METHOD_REQUIRED` | 402 | This would go past your included CMS allowance and there is no payment method on file. Not a plan limit and not an upgrade: CMS resources are pay-as-you-go on every plan. Add a card and retry. Nothing already published stops serving. |
        | `NOT_FOUND` | 404 | No such object, or it belongs to another Site. Deliberately indistinguishable. |
        | `SLUG_CONFLICT` | 409 | Another object on this Site already uses that slug. |
        | `IDEMPOTENCY_KEY_CONFLICT` | 409 | The key was reused with a different request body. |
        | `IDEMPOTENCY_KEY_IN_FLIGHT` | 409 | The first request with this key is still running. Retry shortly. |
        | `CONFLICT` | 409 | The request clashes with the object's current state, or the object changed under you mid request. The message names the step to take. |
        | `PREREQUISITE_MISSING` | 409 | Something this operation needs is not set up yet. The message names it and the operation that sets it up. Nothing was done and nothing was charged. |
        | `FEATURE_UNAVAILABLE` | 409 | Writavo has this capability switched off right now: paid backlink data platform wide, or spending while the plan has no daily spend cap configured. Nothing the caller sends changes it. |
        | `PRECONDITION_FAILED` | 412 | Your `If-Match` did not match. Someone else edited it. Re-read and retry. |
        | `VALIDATION_FAILED` | 422 | The request parsed but the values are not acceptable. See `fields`. |
        | `RATE_LIMIT_EXCEEDED` | 429 | Too many requests. Back off and honour `Retry-After`. |
        | `MAINTENANCE` | 503 | Writes are paused for maintenance. Retry later. |
        | `INTERNAL_ERROR` | 500 | Our fault. Safe to retry an idempotent request. |
      enum:
        - INVALID_REQUEST
        - INVALID_API_KEY
        - API_KEY_REVOKED
        - API_KEY_EXPIRED
        - INSUFFICIENT_SCOPE
        - NOT_ENTITLED
        - INSUFFICIENT_CREDITS
        - SPEND_CAP_REACHED
        - PAYMENT_METHOD_REQUIRED
        - NOT_FOUND
        - SLUG_CONFLICT
        - IDEMPOTENCY_KEY_CONFLICT
        - IDEMPOTENCY_KEY_IN_FLIGHT
        - CONFLICT
        - PRECONDITION_FAILED
        - VALIDATION_FAILED
        - RATE_LIMIT_EXCEEDED
        - MAINTENANCE
        - INTERNAL_ERROR
        - FORBIDDEN
        - AGENT_ACCESS_DISABLED
        - APPROVAL_REQUIRED
        - APPROVAL_PENDING
        - APPROVAL_DENIED
        - APPROVAL_INVALID
        - PREREQUISITE_MISSING
        - FEATURE_UNAVAILABLE

    Page:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: [string, "null"]
          description: |
            Pass it back as `?cursor=` for the next page. `null` means you have reached the end.
            There is no total count: counting a growing table on every list request is the kind
            of query that gets slower exactly as a customer succeeds.
      description: |
        The shape of `data` on every list endpoint. Paging is cursor based rather than offset
        based, so rows are never skipped or repeated when content changes mid pagination.

    # ---- enums -----------------------------------------------------------
    ArticleStatus:
      type: string
      description: |
        The article state machine. Thirteen values, in two groups.

        **Yours, settable through the lifecycle endpoints:**

        - `draft` - private and editable. Where every article starts. Never touched by the AI.
        - `scheduled` - has a future `scheduled_publish_at`. A cron publishes it at that time.
        - `published` - public on your blog.

        **The pipeline's, readable but not settable.** A `PATCH` naming any of these is rejected
        with `422 VALIDATION_FAILED`:

        - `discovered`, `scored`, `skipped` - a candidate source found and triaged.
        - `scraped` - source fetched, research signal extracted.
        - `generated` - a draft the engine wrote, awaiting quality review.
        - `needs_improvement` - failed quality review; queued for a rewrite.
        - `needs_images` - text is final, images are being generated.
        - `queued` - finished and waiting for its publishing slot.
        - `rejected`, `failed` - abandoned, or errored past retry.

        More pipeline values may be added within v1 as the engine grows. Handle unknown values
        gracefully.
      enum:
        - discovered
        - scored
        - skipped
        - scraped
        - generated
        - needs_improvement
        - needs_images
        - queued
        - published
        - rejected
        - failed
        - draft
        - scheduled

    MediaBucket:
      type: string
      description: |
        Which library the asset belongs to. `blog-images` for article imagery, `author-avatars`
        for byline portraits.
      enum: [blog-images, author-avatars]
      default: blog-images

    PipelineStage:
      type: string
      description: The engine stage a run belongs to.
      enum: [dispatch, discover, scrape, extract, plan, generate, improve, classify, images, publish]

    PipelineRunStatus:
      type: string
      description: |
        `partial` means the run did useful work and then stopped early. That is the normal
        outcome when credits or a spend cap run out mid run, and it is not an error: what was
        produced is kept.
      enum: [running, success, failed, partial]

    PlanItemStatus:
      type: string
      enum: [planned, in_progress, done, skipped]

    PlanItemSource:
      type: string
      description: |
        Where the topic came from. `manual` if a person (or an API client) added it,
        `content_gap` if gap analysis found it, `competitor_seed` if it came from a competitor
        page, `link_opportunity` if it was planned from a link opportunity.
      enum: [content_gap, manual, competitor_seed, link_opportunity]

    KeyKind:
      type: string
      description: |
        `publishable` keys are prefixed `wv_pub_` and are safe in client code: read only, limited
        to published content, and admitted only to the operations marked `x-publishable: true`.
        Anything else returns `403 INSUFFICIENT_SCOPE`, whatever scopes the key carries.

        `secret` keys are prefixed `wv_sk_` and are server side only.
      enum: [publishable, secret]

    Scope:
      type: string
      description: |
        What a key is permitted to do. A key carries a set of these, and every operation names
        the one it needs.

        Scope is the outer bound, not the whole answer. A request must also pass the creator's
        live permissions, the plan entitlement, and, for a pipeline run, credits and the spend
        cap. A scope you hold can still be refused by the gate behind it.

        A publishable key may only carry `:read` scopes, and only ever sees published content.
        Three of them are deliberately NOT available to a publishable key, because the endpoints
        behind them return things a browser bundle must not carry: `media:read` lists the whole
        library including assets attached only to drafts, `pipeline:read` returns the Site's
        unpublished editorial queue, and `webhooks:read` is account configuration.

        `meta:read` IS publishable, but `GET /usage` within it is not: it returns the
        organisation's credit balance and plan, and a publishable key presenting it gets
        `403 INSUFFICIENT_SCOPE`. Every operation states which side of that line it is on in
        `x-publishable`. None of the settings, delivery, SEO, outreach, team, billing, insights or
        logs scopes can be held by a publishable key.

        An AI agent's key (from a device or OAuth sign-in) can carry every scope except
        `keys:read`, `keys:write`, `webhooks:read` and `webhooks:write`: credentials and event
        delivery stay with people. `plan:write` and `prompts:write` let a key change what the AI
        writes; `pipeline:config`, `seo:write`, `delivery:write` and `billing:write` include
        operations that spend money; `team:write` and `roles:write` change who can do what.
      enum:
        - articles:read
        - articles:write
        - taxonomy:read
        - taxonomy:write
        - authors:read
        - authors:write
        - media:read
        - media:write
        - pipeline:read
        - pipeline:run
        - keys:read
        - keys:write
        - webhooks:read
        - webhooks:write
        - meta:read
        - site:read
        - site:write
        - pipeline:config
        - prompts:write
        - plan:write
        - delivery:read
        - delivery:write
        - integrations:write
        - seo:read
        - seo:write
        - outreach:read
        - team:read
        - team:write
        - roles:write
        - billing:read
        - billing:write
        - insights:read
        - logs:read
        - org:write

    WebhookEvent:
      type: string
      description: |
        Events you can subscribe to. Every one of them corresponds to a mutation this API can
        perform, and each fires whether the change came from this API or from the dashboard.

        More may be added within v1, so ignore an event type you do not recognise rather than
        failing the delivery.

        `article.published` is the one most integrations want: it is the signal to rebuild a
        statically generated site. `article.unpublished` and `article.deleted` are the ones people
        forget, and forgetting them leaves content live on your site after it is gone from ours.
      enum:
        - article.created
        - article.updated
        - article.deleted
        - article.published
        - article.unpublished
        - article.scheduled
        - article.unscheduled
        - category.created
        - category.updated
        - category.deleted
        - tag.created
        - tag.updated
        - tag.deleted
        - author.created
        - author.updated
        - author.deleted
        - media.created
        - media.updated
        - media.deleted
        - pipeline.run.completed
        - pipeline.run.failed

    WebhookPayload:
      type: object
      description: |
        The body of every delivery. It is JSON, it is what the signature is computed over, and it
        is byte-identical across retries and redeliveries of the same event.

        `data` is the resource in the same shape the REST API returns it, so a handler for
        `article.published` can use the same parser as `GET /articles/{id}`. The one exception is
        a `*.deleted` event, where the object no longer exists and `data` carries only its `id`.

        `website_id` deliberately appears nowhere: you already know which Site you configured.
      required: [id, event, created_at, data]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The EVENT id. Stable across every retry and across a manual redelivery, and this is
            what you deduplicate on. The id of the individual HTTP attempt is in the
            `Writavo-Delivery` header instead, because it identifies the request rather than the
            fact.
        event: { $ref: "#/components/schemas/WebhookEvent" }
        created_at:
          type: string
          format: date-time
          description: When the event was queued, not when this attempt was sent.
        data:
          type: object
          additionalProperties: true
          description: 'The resource, as the REST API returns it. `{ "id": "..." }` for a delete.'

    # ---- resources -------------------------------------------------------
    Article:
      type: object
      description: |
        An article. `content` is **markdown**, not HTML, in both directions: what you send is
        what is stored, and it is rendered at publish time. Send markdown.

        Several pipeline columns are deliberately absent from this schema rather than exposed as
        read only, because they describe the engine's internal working rather than your content:
        the source URL and competitor a draft was researched from (provenance about a third
        party page, not about your article), the image job handle and image ladder stage (vendor
        job state that changes shape when we change provider), the raw quality critique (an
        unstable model output), the source page's SEO score (a number about someone else's page),
        the dispatcher's priority ordering knob, and the rewrite attempt counter. Exposing any of
        them would freeze an internal detail into a contract we have promised not to break.

        `quality_score` **is** exposed, read only, because it is a stable, meaningful number
        about your own article.
      required: [id, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        status:
          allOf: [{ $ref: "#/components/schemas/ArticleStatus" }]
          readOnly: true
          description: Read only here. Change it with the lifecycle endpoints.
        title: { type: [string, "null"], maxLength: 300 }
        slug:
          type: [string, "null"]
          maxLength: 200
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: |
            The URL segment on your blog. Unique within the Site; a collision is
            `409 SLUG_CONFLICT`. May be null on a draft, and is required to publish.
        external_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
          pattern: "^[!-~]+$"
          description: |
            Your own stable id for this article in the system it came from, such as the
            primary key in your old CMS. Printable ASCII, no spaces. Unique within the Site: a
            second article with the same value is `409 CONFLICT`. Null for anything written in
            Writavo. Filter on it with `GET /articles?external_id=`.
        content:
          type: [string, "null"]
          description: |
            The body, in markdown. Not returned in the list default projection; ask for it by
            name or fetch the article individually.
        excerpt: { type: [string, "null"], maxLength: 1000 }
        featured_image_url: { type: [string, "null"], format: uri }
        seo_title: { type: [string, "null"], maxLength: 200 }
        seo_description: { type: [string, "null"], maxLength: 400 }
        seo_keywords:
          type: [array, "null"]
          items: { type: string }
        faqs:
          type: [array, "null"]
          description: Question and answer pairs, rendered as FAQ structured data on your blog.
          items:
            type: object
            required: [question, answer]
            properties:
              question: { type: string }
              answer: { type: string }
        key_takeaways:
          type: [array, "null"]
          description: Short summary bullets rendered above the body.
          items: { type: string }
        howto_steps:
          type: [array, "null"]
          description: Ordered steps, rendered as HowTo structured data.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              text: { type: string }
              image_url: { type: string, format: uri }
        comparison:
          type: [object, "null"]
          description: A comparison table, rendered as a table in the body.
          properties:
            headers:
              type: array
              items: { type: string }
            rows:
              type: array
              items:
                type: array
                items: { type: string }
        category_id: { type: [string, "null"], format: uuid }
        author_id: { type: [string, "null"], format: uuid }
        format_id:
          type: [string, "null"]
          format: uuid
          description: The content type. See `GET /content-types`.
        tag_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Every tag on this article. On `PATCH` this is a full replacement, not a merge: send
            the complete set you want, and send `[]` to clear.
        quality_score:
          type: [number, "null"]
          readOnly: true
          description: |
            The engine's quality rating out of 100 for an article it wrote. Null for anything
            written by hand.
        published_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: |
            When the article was **first** made public. Set by the first publish and never
            changed after, including across an unpublish and republish, because it is your blog's
            ordering key. An imported article's first publish may supply its original date.
        scheduled_publish_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: Set through `POST /articles/{id}/schedule`.
        content_updated_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: |
            When what a reader sees last changed: the title, slug, body, excerpt, images, SEO
            fields, structured blocks, category or author. Unlike `updated_at` it ignores internal
            bookkeeping, so it is the honest value for `dateModified` and a sitemap `lastmod`.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    ArticleCreate:
      type: object
      additionalProperties: false
      description: |
        Every field is optional. The article is created at `status: draft` regardless of what you
        send. `status`, `published_at` and `scheduled_publish_at` are not accepted: naming any of
        them is `422 VALIDATION_FAILED`, so a client that assumed it could create published
        content fails loudly rather than leaving a post silently offline.
      properties:
        title: { type: [string, "null"], maxLength: 300 }
        slug:
          type: [string, "null"]
          maxLength: 200
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Derived from `title` when omitted. Supply it if the URL matters.
        external_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
          pattern: "^[!-~]+$"
          description: Your id for this article in the system it came from. Unique within the Site.
        content: { type: [string, "null"], description: Markdown. }
        excerpt: { type: [string, "null"], maxLength: 1000 }
        featured_image_url: { type: [string, "null"], format: uri }
        seo_title: { type: [string, "null"], maxLength: 200 }
        seo_description: { type: [string, "null"], maxLength: 400 }
        seo_keywords: { type: [array, "null"], items: { type: string } }
        faqs: { type: [array, "null"], items: { type: object } }
        key_takeaways: { type: [array, "null"], items: { type: string } }
        howto_steps: { type: [array, "null"], items: { type: object } }
        comparison: { type: [object, "null"] }
        category_id: { type: [string, "null"], format: uuid }
        author_id: { type: [string, "null"], format: uuid }
        format_id: { type: [string, "null"], format: uuid }
        tag_ids: { type: array, items: { type: string, format: uuid } }

    ArticleUpdate:
      type: object
      additionalProperties: false
      description: |
        A partial update. Omitted fields are left alone; `null` clears a nullable field.
        `status`, `published_at` and `scheduled_publish_at` are rejected with
        `422 VALIDATION_FAILED`.
      properties:
        title: { type: [string, "null"], maxLength: 300 }
        slug:
          type: [string, "null"]
          maxLength: 200
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: |
            Changing the slug of a published article changes its live URL and nothing is
            redirected for you. The old URL starts returning 404.
        external_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
          pattern: "^[!-~]+$"
          description: Your id for this article in the system it came from. `null` clears it.
        content: { type: [string, "null"], description: Markdown. }
        excerpt: { type: [string, "null"], maxLength: 1000 }
        featured_image_url: { type: [string, "null"], format: uri }
        seo_title: { type: [string, "null"], maxLength: 200 }
        seo_description: { type: [string, "null"], maxLength: 400 }
        seo_keywords: { type: [array, "null"], items: { type: string } }
        faqs: { type: [array, "null"], items: { type: object } }
        key_takeaways: { type: [array, "null"], items: { type: string } }
        howto_steps: { type: [array, "null"], items: { type: object } }
        comparison: { type: [object, "null"] }
        category_id: { type: [string, "null"], format: uuid }
        author_id: { type: [string, "null"], format: uuid }
        format_id: { type: [string, "null"], format: uuid }
        tag_ids:
          type: array
          items: { type: string, format: uuid }
          description: Full replacement, not a merge. Send `[]` to clear.

    ArticleLifecycleState:
      type: object
      description: What every lifecycle endpoint returns. Enough to update your UI without a re-read.
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ArticleStatus" }
        published_at: { type: [string, "null"], format: date-time }
        scheduled_publish_at: { type: [string, "null"], format: date-time }
        url:
          type: [string, "null"]
          format: uri
          description: The live URL, when the article is published and the Site has a delivery route configured.

    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 120 }
        slug:
          type: string
          maxLength: 120
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        article_count:
          type: integer
          readOnly: true
          description: How many articles carry this category. Counted server side.

    Tag:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 120 }
        slug:
          type: string
          maxLength: 120
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        article_count:
          type: integer
          readOnly: true
          description: How many articles carry this tag. Counted server side.

    TaxonomyTermWrite:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug:
          type: string
          maxLength: 120
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Derived from `name` when omitted.

    TaxonomyTermUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug:
          type: string
          maxLength: 120
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

    Author:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 160 }
        bio: { type: [string, "null"], maxLength: 2000 }
        avatar_url: { type: [string, "null"], format: uri }
        is_ai_generated:
          type: boolean
          description: True for a persona the engine created, false for a real person.
        is_default:
          type: boolean
          description: The byline used when an article names no author. At most one per Site.
        created_at: { type: string, format: date-time, readOnly: true }

    AuthorWrite:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        bio: { type: [string, "null"], maxLength: 2000 }
        avatar_url: { type: [string, "null"], format: uri }
        is_ai_generated: { type: boolean, default: true }
        is_default: { type: boolean, default: false }

    AuthorUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        bio: { type: [string, "null"], maxLength: 2000 }
        avatar_url: { type: [string, "null"], format: uri }
        is_ai_generated: { type: boolean }
        is_default: { type: boolean }

    MediaAsset:
      type: object
      description: |
        A file in the media library. The storage location is not part of this contract: you get
        a `url` you can use, and the path behind it is ours to change.
      required: [id, bucket, url]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        bucket: { $ref: "#/components/schemas/MediaBucket" }
        url:
          type: string
          format: uri
          readOnly: true
          description: The public URL. Put this in `featured_image_url` or in article markdown.
        file_name: { type: [string, "null"], readOnly: true }
        mime_type:
          type: [string, "null"]
          readOnly: true
          description: The type read from the bytes at registration, not the type you declared.
        size_bytes: { type: [integer, "null"], readOnly: true }
        width: { type: [integer, "null"], readOnly: true }
        height: { type: [integer, "null"], readOnly: true }
        alt_text: { type: [string, "null"], maxLength: 500 }
        created_at: { type: string, format: date-time, readOnly: true }

    Site:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: |
            The identifier of the Site this key belongs to, for your own logging and support
            requests. It is never a request parameter: the Site is always resolved from the key,
            so sending it anywhere would have no effect.
        name: { type: string }
        domain:
          type: [string, "null"]
          description: The domain the blog is served from, if a delivery route is configured.
        blog_base_url:
          type: [string, "null"]
          format: uri
          description: The base URL published articles appear under.
        locale: { type: [string, "null"], examples: ["en-GB"] }
        timezone:
          type: [string, "null"]
          description: |
            IANA name, `UTC` unless changed with `PATCH /site/settings`. Informational: scheduling
            takes absolute ISO 8601 timestamps and a timestamp without an offset is read as UTC.
          examples: ["Europe/London"]
        pipeline_enabled:
          type: boolean
          description: |
            Whether the AI engine runs on its own cadence for this Site. False means the CMS
            works exactly as before and nothing is generated unless you ask for a run.

    ContentType:
      type: object
      description: An article format, that is, an SEO blueprint you can set on an article via `format_id`.
      required: [id, key, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        key: { type: string, examples: ["how_to"] }
        name: { type: string, examples: ["How-To"] }
        is_active: { type: boolean }
        is_platform_default:
          type: boolean
          description: True for a format we ship, false for one defined on your Site.

    Usage:
      type: object
      description: |
        Plan limits, current period usage, credit balance and spend cap in one payload. Read it
        before a pipeline run to fail fast, or after one to see the balance move.
      required: [plan, period, limits, credits]
      properties:
        plan:
          type: object
          required: [key, name]
          properties:
            key: { type: string, examples: ["growth"] }
            name: { type: string, examples: ["Growth"] }
        period:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        limits:
          type: array
          description: One row per metered limit, with what you have used against it.
          items:
            type: object
            required: [key, used]
            properties:
              key: { type: string, examples: ["articles.per_month"] }
              limit:
                type: [integer, "null"]
                description: Null means unlimited on this plan.
              used: { type: integer }
        features:
          type: array
          description: Capability keys your plan grants. A pipeline run needs `ai.article_generation`.
          items: { type: string }
        credits:
          type: object
          required: [balance]
          properties:
            balance:
              type: number
              description: Credits available to the whole organisation, shared across its Sites.
            reserved:
              type: number
              description: Credits committed to work already in flight.
        spend_cap:
          type: object
          description: This Site's own monthly ceiling, independent of the organisation balance.
          properties:
            monthly_credit_cap:
              type: [number, "null"]
              description: Null means uncapped. Zero means this Site may not spend at all.
            period_spent: { type: number }
            reached:
              type: boolean
              description: True when a pipeline run would be refused with `SPEND_CAP_REACHED`.

    PipelineRun:
      type: object
      required: [id, stage, status, started_at]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        stage: { $ref: "#/components/schemas/PipelineStage" }
        status: { $ref: "#/components/schemas/PipelineRunStatus" }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        items_processed: { type: integer }
        items_succeeded: { type: integer }
        items_failed: { type: integer }
        triggered_by:
          type: string
          description: "`cron` for the normal cadence, or `api` for a run you requested."
        error_summary:
          type: [string, "null"]
          description: |
            Why the run ended early, when it did. On a `partial` run this is where you find out
            it was credits, the spend cap, or a vendor failure.

    QueueItem:
      type: object
      required: [id, topic_or_keyword, source, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        topic_or_keyword: { type: string }
        source: { $ref: "#/components/schemas/PlanItemSource" }
        status: { $ref: "#/components/schemas/PlanItemStatus" }
        signal:
          type: [object, "null"]
          description: |
            Structured research for a competitor sourced item: the angle, hook, data points and
            gaps found. Extracted signal, never copied prose.
        target_publish_date: { type: [string, "null"], format: date }
        priority: { type: integer }
        linked_article_id:
          type: [string, "null"]
          format: uuid
          description: The article this item produced, once it has been written.
        created_at: { type: string, format: date-time, readOnly: true }

    ApiKey:
      type: object
      description: Key metadata. The secret is never included except in the response that created or rotated it.
      required: [id, name, kind, key_prefix, scopes]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        kind: { $ref: "#/components/schemas/KeyKind" }
        key_prefix:
          type: string
          readOnly: true
          description: The only displayable fragment of the secret. Use it to identify a key in your own UI.
          # The first 12 characters of the key. API-2: prefix + the first few random chars.
          examples: ["wv_sk_EXAMPLE"]
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
          description: The scopes actually granted, after intersection with the creator's permissions.
        last_used_at: { type: [string, "null"], format: date-time, readOnly: true }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        origin:
          type: string
          enum: [dashboard, api, device, oauth]
          readOnly: true
          description: |
            How the key came to exist: made in the dashboard, made through this API, or approved
            for a tool through a device sign-in or an AI assistant's OAuth sign-in. `device` and
            `oauth` keys are AI agent keys, subject to the organisation's agent controls.
        client_name:
          type: [string, "null"]
          readOnly: true
          description: The client name a person approved, for a `device` or `oauth` key. Null otherwise.

    Webhook:
      type: object
      required: [id, url, events, enabled]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        url: { type: string, format: uri }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEvent" }
        description: { type: [string, "null"] }
        enabled:
          type: boolean
          description: |
            Set to false automatically after repeated delivery failures. Fix your endpoint, then
            PATCH it back to true. Missed deliveries are not replayed.
        disabled_reason: { type: [string, "null"], readOnly: true }
        last_delivery_at: { type: [string, "null"], format: date-time, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    WebhookDelivery:
      type: object
      description: |
        ONE ATTEMPT. Six attempts of the same event are six of these, all sharing one `event_id`.
      required: [id, event_id, event_type, status, attempt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: This attempt. Sent as the `Writavo-Delivery` header, and what you pass to redeliver.
        event_id:
          type: string
          format: uuid
          description: |
            Stable across retries of the same event, and equal to the payload's `id`. Key your
            idempotency off this, never off the attempt id.
        event_type: { $ref: "#/components/schemas/WebhookEvent" }
        status:
          type: string
          enum: [pending, delivered, failed]
        attempt: { type: integer, minimum: 1, maximum: 6 }
        exhausted:
          type: boolean
          readOnly: true
          description: |
            True when this was the last attempt and we stopped trying. `status: failed` with
            `exhausted: false` means another attempt is scheduled.
        response_status:
          type: [integer, "null"]
          description: The HTTP status your endpoint returned. Null if the request never completed.
        response_body_excerpt:
          type: [string, "null"]
          readOnly: true
          description: The first 512 characters of your response, kept so a failure can be diagnosed.
        duration_ms: { type: [integer, "null"], readOnly: true }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time, readOnly: true }
        delivered_at: { type: [string, "null"], format: date-time }

    # ---- MCP-3: settings, delivery, SEO, outreach, team, billing, insights ----
    EmptyBody:
      type: object
      description: No fields. Send `{}` or no body.
      additionalProperties: false
      properties: {}

    Queued:
      type: object
      description: Accepted and running in the background. Nothing is returned now; read `check` in a few minutes.
      required: [queued, check]
      properties:
        queued: {type: boolean, const: true}
        check:
          type: string
          description: The operation that shows the result once the work is done, named by its operationId or its snake-case name (for example `listCmsPushLog` or `list_cms_push_log`). `run_writavo_action` accepts either.

    ConnectLink:
      type: object
      description: Where a person connects this. The credential is entered only on that page, never through the API.
      required: [provider, connect_url, next_step]
      properties:
        provider: {type: string, enum: [wordpress, ghost, bing_wmt]}
        connect_url:
          type: string
          format: uri
          description: The dashboard page where the person pastes the credential, for example `https://app.writavo.com/delivery?connect=wordpress&site=<site id>`. The `site` parameter opens the dashboard on this Site.
        next_step: {type: string, description: One sentence to tell the person.}

    SiteSettings:
      type: object
      required: [id, name, locale_language, locale_country, locale, timezone, status, created_at]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        name: {type: string, maxLength: 120}
        primary_domain:
          type: [string, "null"]
          description: The Site's own domain, measured by the SEO suite. Not where the blog is served (see `GET /delivery`).
        locale_language: {type: string, pattern: '^[a-z]{2}$', examples: [en]}
        locale_country: {type: string, pattern: '^[A-Z]{2}$', examples: [GB]}
        locale:
          type: string
          description: '`<language>-<country>`.'
          examples: [en-GB]
          readOnly: true
        niche: {type: [string, "null"], maxLength: 200}
        timezone:
          type: string
          description: 'IANA time zone name, `UTC` by default. Informational: schedule times are absolute ISO 8601 timestamps.'
          examples: [Europe/London]
        status:
          type: string
          enum: [active, paused, suspended]
          description: Read only. `suspended` is set by Writavo, `paused` by the organisation.
          readOnly: true
        live_base_url:
          type: [string, "null"]
          format: uri
          description: Where published articles are served, once a delivery route is verified.
          readOnly: true
        created_at: {type: string, format: date-time, readOnly: true}

    SiteSettingsUpdate:
      type: object
      description: Send at least one field. `status` is not settable.
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        primary_domain:
          type: [string, "null"]
          maxLength: 253
          description: A bare hostname such as `example.com`, or null to clear it.
        locale_language: {type: string, pattern: '^[a-z]{2}$'}
        locale_country: {type: string, pattern: '^[A-Z]{2}$'}
        niche: {type: [string, "null"], maxLength: 200}
        timezone:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^(UTC|[A-Z][A-Za-z_]+(/[A-Za-z0-9_+-]+){1,2})$
          description: '`UTC`, or an IANA Area/Location name such as `Europe/London` or `America/Argentina/Buenos_Aires`. Single-segment names such as `GMT` or `EST` are refused; a name that is not a real time zone is `422`.'

    KnowledgeProfile:
      type: object
      required: [brand_voice, product_description, target_audience, competitors_seed, is_auto_generated]
      properties:
        brand_voice: {type: [string, "null"], maxLength: 4000, description: How the articles should sound.}
        product_description: {type: [string, "null"], maxLength: 4000, description: What the business sells or does.}
        target_audience: {type: [string, "null"], maxLength: 4000, description: Who the articles are for.}
        competitors_seed:
          type: array
          items: {type: string}
          description: The onboarding suggestion list. Read only; tracked competitors are `GET /seo/competitors`.
          readOnly: true
        is_auto_generated:
          type: boolean
          description: True until a person (or this API) edits the profile.
          readOnly: true
        updated_at: {type: [string, "null"], format: date-time, readOnly: true}

    KnowledgeProfileUpdate:
      type: object
      description: Send at least one field; `null` clears it.
      additionalProperties: false
      minProperties: 1
      properties:
        brand_voice: {type: [string, "null"], maxLength: 4000}
        product_description: {type: [string, "null"], maxLength: 4000}
        target_audience: {type: [string, "null"], maxLength: 4000}

    Organisation:
      type: object
      required: [id, name, your_role, agent_access_enabled, agent_approvals_required, created_at]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        name: {type: string, maxLength: 120}
        your_role:
          type: [string, "null"]
          enum: [owner, admin, editor, viewer, null]
          description: The role of the person this key acts for. Null only for a key whose creator is not a member (never an AI agent's key).
          readOnly: true
        agent_access_enabled:
          type: boolean
          description: Read only. A person changes it at https://app.writavo.com/settings/agents.
          readOnly: true
        agent_approvals_required:
          type: boolean
          description: Read only. Money and team actions are asked whatever it says.
          readOnly: true
        created_at: {type: string, format: date-time, readOnly: true}

    OrganisationUpdate:
      type: object
      description: 'The name only. Any other field is `422`: the AI agent and outreach settings change only in the dashboard.'
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}

    PipelineConfig:
      type: object
      required:
        - pipeline_enabled
        - publish_mode
        - articles_per_day
        - batch_size
        - max_auto_improve_attempts
        - quality_score_threshold
        - in_flight
      properties:
        pipeline_enabled: {type: boolean, description: Whether the AI pipeline runs on its own every 10 minutes.}
        publish_mode:
          type: string
          enum: [auto, review]
          description: '`auto` publishes finished articles without review; `review` waits for a person.'
        articles_per_day:
          type: integer
          description: The most articles published per day in `auto` mode. It caps publishing, not generation.
        batch_size: {type: integer, description: The most articles generated per 10-minute tick.}
        max_auto_improve_attempts:
          type: integer
          description: How many AI rewrites an article below the quality threshold gets.
        quality_score_threshold:
          type: number
          minimum: 0
          maximum: 1
          description: The quality score, 0 to 1, an article must reach to move on without a rewrite.
        next_run_at: {type: [string, "null"], format: date-time, readOnly: true}
        last_dispatched_at: {type: [string, "null"], format: date-time, readOnly: true}
        in_flight:
          type: boolean
          description: True while a pipeline stage is running for this Site.
          readOnly: true
        updated_at: {type: string, format: date-time, readOnly: true}

    PipelineConfigUpdate:
      type: object
      description: Send at least one field.
      additionalProperties: false
      minProperties: 1
      properties:
        pipeline_enabled: {type: boolean}
        publish_mode: {type: string, enum: [auto, review]}
        articles_per_day: {type: integer, minimum: 0, maximum: 100}
        batch_size: {type: integer, minimum: 1, maximum: 50}
        max_auto_improve_attempts: {type: integer, minimum: 0, maximum: 10}
        quality_score_threshold: {type: number, minimum: 0, maximum: 1}

    PlanItem:
      description: 'A content plan item: a queue item plus the format it will be written in.'
      allOf:
        - { $ref: "#/components/schemas/QueueItem" }
        - type: object
          properties:
            format_key:
              type: [string, "null"]
              description: The format this topic will be written in, or null for the default.

    PlanItemCreate:
      type: object
      required: [topic_or_keyword]
      additionalProperties: false
      properties:
        topic_or_keyword: {type: string, minLength: 1, maxLength: 300}
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
          default: 0
          description: Higher is written first.
        target_publish_date: {type: [string, "null"], format: date}
        format_key:
          type: [string, "null"]
          pattern: ^[a-z][a-z0-9_]{1,39}$
          description: The `key` of an active format this Site can use (`GET /content-types`).

    PlanItemUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        topic_or_keyword: {type: string, minLength: 1, maxLength: 300}
        priority: {type: integer, minimum: -1000, maximum: 1000}
        target_publish_date: {type: [string, "null"], format: date}
        format_key:
          type: [string, "null"]
          pattern: ^[a-z][a-z0-9_]{1,39}$
          description: The `key` of an active format this Site can use (`GET /content-types`).
        status:
          type: string
          enum: [planned, skipped]
          description: '`skipped` parks the topic; the pipeline only takes `planned` ones.'

    PlanItemReorder:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          items: {type: string, format: uuid}
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Plan item ids, highest priority first.

    RequeueRequest:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to:
          type: string
          enum: [improve, images, publish]
          description: '`improve` and `images` spend credits; `publish` is free.'

    PromptStage:
      type: string
      enum: [plan, generate, improve, classify, extract]
      description: The pipeline stages that read a prompt.

    Prompt:
      type: object
      required: [stage, default_template, override, effective, placeholders]
      properties:
        stage: { $ref: "#/components/schemas/PromptStage" }
        default_template: {type: string, description: The platform default prompt.}
        override:
          type: [object, "null"]
          description: This Site's override, or null.
          required: [template, version, created_at]
          properties:
            template: {type: string}
            version: {type: integer}
            created_at: {type: string, format: date-time}
        effective: {type: string, enum: [default, override], description: Which of the two the stage uses.}
        placeholders:
          type: array
          items: {type: string}
          description: The `{{name}}` tokens in the default, which an override should keep.

    PromptSaved:
      description: The stage's prompt after an override, with any placeholders the override left out.
      allOf:
        - { $ref: "#/components/schemas/Prompt" }
        - type: object
          required: [missing_placeholders]
          properties:
            missing_placeholders:
              type: array
              items: {type: string}
              description: 'Default placeholders absent from the override. A warning: the save happened.'

    PromptOverride:
      type: object
      required: [template]
      additionalProperties: false
      properties:
        template: {type: string, minLength: 1, maxLength: 20000}

    Blueprint:
      type: object
      description: 'What a format tells the generator: the outline to follow and the structured blocks to fill.'
      required: [requires, sections]
      additionalProperties: false
      properties:
        requires:
          type: array
          items: {type: string, enum: [howto_steps, key_takeaways, comparison, faqs]}
          maxItems: 4
          uniqueItems: true
          description: Structured blocks the generator must fill.
        sections:
          type: array
          items: {type: string, minLength: 1, maxLength: 60}
          minItems: 1
          maxItems: 20
          description: The outline, in order.

    ContentTypeDetail:
      description: An article format with its blueprint.
      allOf:
        - { $ref: "#/components/schemas/ContentType" }
        - type: object
          required: [blueprint]
          properties:
            blueprint: { $ref: "#/components/schemas/Blueprint" }

    ContentTypeCreate:
      type: object
      required: [name, blueprint]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,39}$
          description: Derived from `name` when omitted. A platform default's key overrides that default for this Site.
        blueprint: { $ref: "#/components/schemas/Blueprint" }
        is_active: {type: boolean, default: true}

    ContentTypeUpdate:
      type: object
      description: The key cannot change.
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        blueprint: { $ref: "#/components/schemas/Blueprint" }
        is_active: {type: boolean}

    DeliveryConnection:
      type: object
      required: [method, status]
      properties:
        method:
          type: string
          enum: [subdirectory_proxy, subdomain, headless_api, hosted]
          description: '`subdirectory_proxy` is the reverse proxy, `subdomain` a custom domain, `headless_api` the read API, `hosted` the writavo.com hosted site. More may be added.'
        target_domain: {type: [string, "null"]}
        status: {type: string, enum: [pending, verified, failed, disabled]}
        health_check_status: {type: [string, "null"]}
        health_check_last_run_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}

    CustomDomain:
      type: object
      required: [hostname, verification_status, cname_target, last_error]
      properties:
        hostname: {type: string}
        verification_status:
          type: string
          enum: [pending, verified, failed]
          description: '`pending` until the DNS record resolves and Writavo verifies it (checked every 10 minutes), then `verified`; `failed` if it could not be verified. Pending or failed for 14 days means it is deleted and released.'
        ssl_status: {type: [string, "null"]}
        cname_target: {type: string, description: 'The routing record''s value: where the CNAME points, or the IPv4 address for an apex domain.'}
        dns_records:
          type: array
          description: Every DNS record still to add, routing record first. Empty once DNS is right.
          items: {$ref: "#/components/schemas/DnsRecord"}
        last_error:
          type: [string, "null"]
          description: 'Why verification has not succeeded: the hosting provider''s reason. Cleared once it verifies. A domain still pending or failed 14 days after it was connected is deleted and released, and then no longer appears here.'
        created_at: {type: string, format: date-time}

    DeliveryStatus:
      type: object
      required: [live_base_url, connections, custom_domain, hosted_site, recommended_next_step]
      properties:
        live_base_url: {type: [string, "null"], format: uri}
        connections:
          type: array
          items: { $ref: "#/components/schemas/DeliveryConnection" }
        custom_domain:
          oneOf:
            - { $ref: "#/components/schemas/CustomDomain" }
            - {type: "null"}
        hosted_site:
          type: [object, "null"]
          properties:
            slug: {type: string}
            url: {type: string, format: uri}
            published_at: {type: [string, "null"], format: date-time}
        recommended_next_step: {type: string, description: One sentence naming the next operation to run.}

    Installers:
      type: object
      description: Ready-to-paste reverse proxy snippets. The customer installs one of them.
      required: [cloudflare_worker, next_rewrite, nginx]
      properties:
        cloudflare_worker: {type: string, description: A Cloudflare Worker script.}
        next_rewrite: {type: string, description: A `next.config.js` rewrite.}
        nginx: {type: string, description: An Nginx `location` block.}

    ProxySetup:
      type: object
      required: [domain]
      additionalProperties: false
      properties:
        domain:
          type: string
          maxLength: 253
          description: A bare hostname such as `example.com`. A scheme, path or port is stripped.

    ProxySetupResult:
      type: object
      required: [connection, installers, next_step]
      properties:
        connection: { $ref: "#/components/schemas/DeliveryConnection" }
        installers: { $ref: "#/components/schemas/Installers" }
        next_step: {type: string}

    HeadlessSetupResult:
      type: object
      required: [connection, sdk_base, has_publishable_key, next_step]
      properties:
        connection: { $ref: "#/components/schemas/DeliveryConnection" }
        sdk_base:
          type: string
          format: uri
          description: The public read API base, for example `https://blog.writavo.com/api/v1`.
        has_publishable_key: {type: boolean}
        next_step: {type: string}

    CustomDomainConnect:
      type: object
      required: [hostname]
      additionalProperties: false
      properties:
        hostname:
          type: string
          maxLength: 253
          description: The hostname to serve the blog at, such as `blog.example.com`.

    CustomDomainConnected:
      type: object
      required: [hostname, verification_status, cname_target, dns_records, instructions]
      properties:
        hostname: {type: string}
        verification_status: {type: string, enum: [pending, verified, failed]}
        ssl_status: {type: [string, "null"]}
        cname_target: {type: string, description: 'The routing record''s value (a CNAME target, or an IPv4 address for an apex domain).'}
        dns_records:
          type: array
          description: Every DNS record still to add, routing record first. Empty once DNS is right.
          items: {$ref: "#/components/schemas/DnsRecord"}
        instructions: {type: string, description: What the person adds at their DNS provider.}

    DnsRecord:
      type: object
      required: [type, name, value, purpose]
      properties:
        type: {type: string, enum: [CNAME, A, TXT]}
        name: {type: string, description: The full hostname the record is for.}
        value: {type: string}
        purpose:
          type: string
          enum: [routing, ownership]
          description: '`routing` points the domain at Writavo; `ownership` proves the domain may be used here.'

    CustomDomainRemoved:
      type: object
      required: [removed, hostname]
      properties:
        removed: {type: boolean, const: true}
        hostname: {type: string}

    HealthCheckRequest:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method: {type: string, enum: [subdirectory_proxy, subdomain]}

    HealthCheck:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [passed, failed]}
        checks:
          type: object
          required: [render, assets, sitemap, host]
          properties:
            render: {type: boolean}
            assets: {type: boolean}
            sitemap: {type: boolean}
            host: {type: boolean}
        fix: {type: [string, "null"], description: What to fix when a check failed.}

    Branding:
      type: object
      description: How the hosted blog looks.
      properties:
        site_title: {type: [string, "null"], maxLength: 120}
        tagline: {type: [string, "null"], maxLength: 200}
        theme_key: {type: string, enum: [editorial, minimal, magazine]}
        theme_mode: {type: string, enum: [light, dark, system]}
        brand_color: {type: [string, "null"], pattern: '^#[0-9a-fA-F]{6}$'}
        radius: {type: string, enum: [0rem, 0.375rem, 0.625rem, 1rem]}
        font_key: {type: string, enum: [inter, serif, mono]}
        logo_url: {type: [string, "null"], format: uri}
        favicon_url: {type: [string, "null"], format: uri}
        updated_at: {type: [string, "null"], format: date-time, readOnly: true}

    BrandingUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        site_title: {type: [string, "null"], maxLength: 120}
        tagline: {type: [string, "null"], maxLength: 200}
        theme_key: {type: string, enum: [editorial, minimal, magazine]}
        theme_mode: {type: string, enum: [light, dark, system]}
        brand_color: {type: [string, "null"], pattern: '^#[0-9a-fA-F]{6}$'}
        radius: {type: string, enum: [0rem, 0.375rem, 0.625rem, 1rem]}
        font_key: {type: string, enum: [inter, serif, mono]}
        logo_url: {type: [string, "null"], format: uri, maxLength: 2048, description: An https URL.}
        favicon_url: {type: [string, "null"], format: uri, maxLength: 2048, description: An https URL.}

    HostedSite:
      type: object
      required: [slug, url, published_at, branding]
      properties:
        slug: {type: [string, "null"]}
        url: {type: [string, "null"], format: uri}
        published_at: {type: [string, "null"], format: date-time}
        branding:
          oneOf:
            - { $ref: "#/components/schemas/Branding" }
            - {type: "null"}
          description: Null until the branding is first changed; the defaults apply.

    HostedSitePublish:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{1,38}[a-z0-9])?$
          description: Derived from the Site name when omitted.

    HostedSitePublished:
      type: object
      required: [hostname, url, slug, published]
      properties:
        hostname: {type: string}
        url: {type: string, format: uri}
        slug: {type: string}
        published: {type: boolean, const: true}

    CmsConnection:
      type: object
      description: A connected external CMS. The credential is never returned.
      required: [provider, status]
      properties:
        provider: {type: string, enum: [wordpress, ghost]}
        status: {type: string, enum: [pending, connected, failed, disabled]}
        external_site_url: {type: [string, "null"], format: uri}
        external_account_id: {type: [string, "null"]}
        last_verified_at: {type: [string, "null"], format: date-time}
        last_error: {type: [string, "null"]}
        created_at: {type: string, format: date-time}

    CmsConnectRequest:
      type: object
      description: 'Which CMS. No credential field exists: the person enters it in the dashboard.'
      required: [provider]
      additionalProperties: false
      properties:
        provider: {type: string, enum: [wordpress, ghost]}

    CmsDisconnected:
      type: object
      required: [provider, status]
      properties:
        provider: {type: string, enum: [wordpress, ghost]}
        status: {type: string, const: disabled}

    CmsPushLogEntry:
      type: object
      required: [id, article_id, provider, status, created_at]
      properties:
        id: {type: string, format: uuid}
        article_id: {type: string, format: uuid}
        article_title: {type: [string, "null"]}
        provider: {type: string, enum: [wordpress, ghost]}
        status: {type: string, enum: [pending, pushed, failed]}
        external_url: {type: [string, "null"], format: uri}
        error: {type: [string, "null"]}
        pushed_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}

    ScanQueued:
      type: object
      description: A paid scan accepted and running in the background.
      required: [scan, queued, estimated_credits, check]
      properties:
        scan:
          type: string
          enum:
            - site_metrics
            - rank_check
            - content_gaps
            - llm_mentions
            - backlink_profile
            - backlink_detail
            - link_intersect
        queued: {type: boolean, const: true}
        estimated_credits:
          type: number
          description: An upper-bound estimate. Charged per unit of work actually done. Zero for a rank check, which costs no credits.
        check:
          type: string
          description: The operation that shows the result, named by its operationId or its snake-case name (for example `getSeoOverview` or `get_seo_overview`). `run_writavo_action` accepts either.

    SeoSnapshot:
      type: object
      description: One measurement of a domain. A null number was not measured, which is not the same as zero.
      required: [domain, captured_at]
      properties:
        domain: {type: string}
        captured_at: {type: string, format: date-time}
        domain_rank: {type: [integer, "null"]}
        organic_traffic_estimate: {type: [integer, "null"]}
        organic_keywords: {type: [integer, "null"]}
        backlinks: {type: [integer, "null"]}
        referring_domains: {type: [integer, "null"]}
        keywords_top3: {type: [integer, "null"]}
        keywords_top10: {type: [integer, "null"]}
        keywords_top100: {type: [integer, "null"]}

    SeoOverview:
      type: object
      required: [own_site, competitors, trend]
      properties:
        own_site:
          oneOf:
            - { $ref: "#/components/schemas/SeoSnapshot" }
            - {type: "null"}
        competitors:
          type: array
          items:
            type: object
            required: [competitor_id, domain, latest]
            properties:
              competitor_id: {type: string, format: uuid}
              domain: {type: string}
              name: {type: [string, "null"]}
              latest:
                oneOf:
                  - { $ref: "#/components/schemas/SeoSnapshot" }
                  - {type: "null"}
        trend:
          type: array
          items: { $ref: "#/components/schemas/SeoSnapshot" }
          description: The own site, last 90 days, oldest first.

    Competitor:
      type: object
      required: [id, domain, is_own_site, is_active]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        domain: {type: string}
        name: {type: [string, "null"], maxLength: 120}
        is_own_site: {type: boolean, readOnly: true}
        is_active: {type: boolean}
        added_at: {type: string, format: date-time, readOnly: true}

    CompetitorCreate:
      type: object
      required: [domain]
      additionalProperties: false
      properties:
        domain:
          type: string
          maxLength: 253
          description: A bare hostname such as `example.com`. A scheme, path or port is stripped.
        name: {type: [string, "null"], maxLength: 120}

    CompetitorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: [string, "null"], maxLength: 120}
        is_active: {type: boolean}

    TrackedKeyword:
      type: object
      required: [id, keyword, is_priority, is_active, latest_position]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        keyword: {type: string}
        is_priority: {type: boolean, description: Checked daily rather than weekly.}
        target_url: {type: [string, "null"], format: uri, description: The page that should rank for it.}
        location_code: {type: integer}
        language_code: {type: string}
        is_active: {type: boolean}
        latest_position:
          type: [integer, "null"]
          description: Null when not in the top 100, or not checked yet.
        latest_checked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time, readOnly: true}

    TrackedKeywordCreate:
      type: object
      required: [keyword]
      additionalProperties: false
      properties:
        keyword: {type: string, minLength: 1, maxLength: 200}
        target_url: {type: [string, "null"], format: uri, description: An https URL on the Site.}
        is_priority: {type: boolean, default: false}
        location_code: {type: integer, description: A search location code. Defaults from the Site locale.}
        language_code: {type: string, pattern: '^[a-z]{2}$', description: Defaults from the Site locale.}

    TrackedKeywordUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        is_priority: {type: boolean}
        target_url: {type: [string, "null"], format: uri}
        is_active: {type: boolean}

    KeywordPosition:
      type: object
      required: [checked_at, position]
      properties:
        checked_at: {type: string, format: date-time}
        position: {type: [integer, "null"]}
        url: {type: [string, "null"]}
        search_volume: {type: [integer, "null"]}
        impressions: {type: [integer, "null"]}
        clicks: {type: [integer, "null"]}
        source: {type: string}

    KeywordAlert:
      type: object
      required: [id, tracked_keyword_id, keyword, type, created_at]
      properties:
        id: {type: string, format: uuid}
        tracked_keyword_id: {type: string, format: uuid}
        keyword: {type: string}
        type: {type: string}
        old_position: {type: [integer, "null"]}
        new_position: {type: [integer, "null"]}
        created_at: {type: string, format: date-time}
        acknowledged_at: {type: [string, "null"], format: date-time}

    AlertAcknowledge:
      type: object
      description: Exactly one of `ids` or `all`.
      additionalProperties: false
      properties:
        ids:
          type: array
          items: {type: string, format: uuid}
          minItems: 1
          maxItems: 100
          uniqueItems: true
        all: {type: boolean, const: true}

    AlertsAcknowledged:
      type: object
      required: [acknowledged]
      properties:
        acknowledged: {type: integer}

    ContentGap:
      type: object
      required: [id, keyword, status]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        competitor_id: {type: [string, "null"], format: uuid}
        keyword: {type: string}
        search_volume: {type: [integer, "null"]}
        keyword_difficulty: {type: [number, "null"]}
        competitor_position: {type: [integer, "null"]}
        our_position: {type: [integer, "null"]}
        opportunity_score: {type: [number, "null"]}
        status: {type: string, enum: [open, planned, dismissed]}
        linked_plan_item_id: {type: [string, "null"], format: uuid}
        captured_at: {type: string, format: date-time}

    ContentGapUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, enum: [open, dismissed]}

    PlanFromSource:
      type: object
      description: Optional. The priority and format for the new plan item.
      additionalProperties: false
      properties:
        priority: {type: integer, minimum: -1000, maximum: 1000}
        format_key:
          type: [string, "null"]
          pattern: ^[a-z][a-z0-9_]{1,39}$
          description: The `key` of an active format this Site can use (`GET /content-types`).

    GapPlanned:
      type: object
      required: [plan_item, gap]
      properties:
        plan_item: { $ref: "#/components/schemas/PlanItem" }
        gap: { $ref: "#/components/schemas/ContentGap" }

    InternalLinkHealth:
      type: object
      required: [total, broken, orphans, broken_links, orphan_articles, top_anchors]
      properties:
        total: {type: integer}
        broken: {type: integer}
        orphans: {type: integer}
        broken_links:
          type: array
          items:
            type: object
            properties:
              source_article_id: {type: string, format: uuid}
              source_title: {type: [string, "null"]}
              target_url: {type: string}
              anchor_text: {type: [string, "null"]}
          maxItems: 200
        orphan_articles:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              title: {type: [string, "null"]}
              slug: {type: [string, "null"]}
          maxItems: 200
        top_anchors:
          type: array
          items:
            type: object
            properties:
              anchor_text: {type: string}
              count: {type: integer}
          maxItems: 50

    LlmMention:
      type: object
      required: [id, topic, engine, is_mentioned, is_cited, checked_at]
      properties:
        id: {type: string, format: uuid}
        topic: {type: string}
        engine: {type: string}
        is_mentioned: {type: boolean}
        is_cited: {type: boolean}
        citation_url: {type: [string, "null"]}
        position: {type: [integer, "null"]}
        checked_at: {type: string, format: date-time}

    Engagement:
      type: object
      required: [from, to, totals, by_day, top_posts]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        totals:
          type: object
          required: [views, reactions, shares]
          properties:
            views: {type: integer}
            reactions: {type: integer}
            shares: {type: integer}
        by_day:
          type: array
          items:
            type: object
            properties:
              day: {type: string, format: date}
              views: {type: integer}
              reactions: {type: integer}
              shares: {type: integer}
        top_posts:
          type: array
          items:
            type: object
            properties:
              post_slug: {type: string}
              article_id: {type: [string, "null"], format: uuid}
              views: {type: integer}
              reactions: {type: integer}
              shares: {type: integer}
          maxItems: 50

    BacklinkOverview:
      type: object
      required:
        - own_site
        - trend
        - competitors
        - top_anchors
        - detail
        - sources
        - paid_data_available
        - disavow_count
      properties:
        own_site:
          type: [object, "null"]
          description: The latest profile summary for the Site's own domain.
        trend:
          type: array
          items: {type: object}
          description: The own site's profile, last 180 days.
        competitors:
          type: array
          items: {type: object}
        top_anchors:
          type: array
          items:
            type: object
            properties:
              anchor: {type: string}
              count: {type: integer}
          maxItems: 25
        detail:
          type: object
          description: Counts over the individual links. `pulled_at` null means detail was never pulled, not that none exist.
          properties:
            live: {type: integer}
            lost: {type: integer}
            broken: {type: [integer, "null"], description: 'Null means never checked, not zero.'}
            toxic: {type: [integer, "null"], description: 'Null means never checked, not zero.'}
            nofollow: {type: [integer, "null"], description: 'Null means never checked, not zero.'}
            verified: {type: integer}
            pulled_at: {type: [string, "null"], format: date-time}
            verified_at: {type: [string, "null"], format: date-time}
        sources:
          type: array
          items: {type: string}
          description: Where the data came from, for example `import`, `bing_wmt` or the paid provider.
        last_import: {type: [object, "null"]}
        paid_data_available:
          type: boolean
          description: Whether Writavo's paid backlink data is switched on. While it is false the three paid backlink scans answer `409 FEATURE_UNAVAILABLE`.
        disavow_count: {type: integer}

    Backlink:
      type: object
      required: [id, source_url, source_domain, target_url, is_dofollow, is_broken]
      properties:
        id: {type: string, format: uuid}
        source_url: {type: string}
        source_domain: {type: string}
        source_title: {type: [string, "null"]}
        anchor: {type: [string, "null"]}
        target_url: {type: string}
        link_type: {type: [string, "null"]}
        is_dofollow: {type: [boolean, "null"], description: Null means not verified yet.}
        is_broken: {type: boolean}
        source_authority: {type: [integer, "null"]}
        spam_score: {type: [integer, "null"]}
        first_seen: {type: [string, "null"], format: date-time}
        last_seen: {type: [string, "null"], format: date-time}
        lost_at: {type: [string, "null"], format: date-time}
        verified_at: {type: [string, "null"], format: date-time}
        source: {type: string}

    BacklinkDetailPull:
      type: object
      required: [target_domain]
      additionalProperties: false
      properties:
        target_domain:
          type: string
          maxLength: 253
          description: The Site's own domain or a tracked competitor's.
        offset: {type: integer, minimum: 0, maximum: 50000, multipleOf: 1000, default: 0}
        mode:
          type: string
          enum: [one_per_domain, as_is, one_per_anchor]
          default: as_is
          description: '`as_is` (the default) returns every link; `one_per_domain` one link per linking domain; `one_per_anchor` one per anchor text.'

    DisavowEntry:
      type: object
      required: [id, kind, value]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        kind: {type: string, enum: [domain, url]}
        value: {type: string}
        reason: {type: [string, "null"]}
        created_at: {type: string, format: date-time, readOnly: true}

    DisavowEntryCreate:
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [domain, url]}
        value:
          type: string
          maxLength: 2048
          description: A bare domain for `domain`, an http or https URL for `url`.
        reason: {type: [string, "null"], maxLength: 500}

    DisavowFile:
      type: object
      required: [content, lines]
      properties:
        content: {type: string, description: 'The file, in Google''s disavow format.'}
        lines: {type: integer}

    BacklinkImport:
      type: object
      required: [csv]
      additionalProperties: false
      properties:
        csv:
          type: string
          maxLength: 900000
          description: The CSV text of a Search Console links export.
        file_name: {type: [string, "null"], maxLength: 200}

    BacklinkImportResult:
      type: object
      required: [rows_seen, rows_imported, rows_skipped]
      properties:
        rows_seen: {type: integer}
        rows_imported: {type: integer}
        rows_skipped: {type: integer}
        note: {type: [string, "null"]}

    LinkOpportunity:
      type: object
      required: [id, source_domain, status]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        source_domain: {type: string}
        source_url: {type: [string, "null"]}
        source_authority: {type: [integer, "null"]}
        spam_score: {type: [integer, "null"]}
        intersect_count: {type: [integer, "null"]}
        competitor_ids:
          type: array
          items: {type: string, format: uuid}
        opportunity_score: {type: [number, "null"]}
        discovered_via: {type: string}
        status: {type: string, enum: [open, planned, contacted, won, dismissed]}
        linked_plan_item_id: {type: [string, "null"], format: uuid}
        linked_article_id: {type: [string, "null"], format: uuid}
        note: {type: [string, "null"]}
        discovered_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    LinkOpportunityCreate:
      type: object
      required: [source_domain]
      additionalProperties: false
      properties:
        source_domain:
          type: string
          maxLength: 253
          description: A bare hostname such as `example.com`. A scheme, path or port is stripped.
        source_url: {type: [string, "null"], format: uri}
        note: {type: [string, "null"], maxLength: 1000}

    LinkOpportunityUpdate:
      type: object
      additionalProperties: false
