  /engagement/events:
    post:
      operationId: recordEngagement
      tags: [SEO]
      summary: Record a view, reaction or share
      description: |
        For a site that renders its articles itself: record one view, a reader's reaction, or a share
        click on a published article, from your own server (never from the browser: the key is a
        secret key). Filter bots and link prefetches before calling.

        Reactions follow one rule per reader and article: a reader has at most one current reaction;
        sending another replaces it and `reaction: null` removes it. `visitor_id` is your own stable
        anonymous id for the reader (a cookie value, for example); Writavo stores only a hash of it.
        The response is the article's totals after the write. An unknown or unpublished slug is 404.
        A recorded view, reaction or share shows in the dashboard and in `GET /seo/engagement` at once.

        This records article views. Visitors and pageviews come from the visitor analytics script
        instead: one script tag on the pages that show your articles. `GET /analytics/setup` returns
        it ready to paste (guide: https://writavo.com/docs/analytics). Until it is added, visitors
        are shown as not measured.
      x-scope: engagement:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-mcp-surface: action
