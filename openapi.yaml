  /categories/bulk-delete:
    post:
      operationId: bulkDeleteCategories
      tags: [Categories]
      summary: Delete many categories
      description: |
        Deletes up to 100 categories in one call, exactly as `DELETE /categories/{id}` does for
        each. No article is deleted: an article filed under a deleted category keeps its content
        and loses that category (its next category becomes its primary one, if it has one), and a
        child category of a deleted one moves to the top level.

        Each id is deleted exactly as the single `DELETE` does it, with its own audit entry and
        webhook. An id that names no category on this Site, whether it never existed, was already
        deleted or belongs to another Site, is listed in `not_found`. A repeated id counts once. If
        one category cannot be deleted it is listed in `failed` with the error the single delete
        would have returned, and the rest of the list still runs.

        `dry_run: true` deletes nothing and returns the same report: `deleted` then lists the ids
        that would be deleted.

        **When an AI agent asks.** A key approved for an AI assistant (a device or OAuth sign-in),
        or any request from an MCP client, gets `428 APPROVAL_REQUIRED` on the first try while the
        organisation requires approvals, with `error.approval.url` for a person to approve or deny
        in the dashboard. ONE approval covers the whole list: the person sees how many categories.
        Retry the same request with `Writavo-Approval: <error.approval.id>` once they have. The
        approval is for the exact categories that existed on this Site when it was asked: if one of
        them has since been deleted, the retry is `409 APPROVAL_INVALID` and you ask again. When
        none of the ids is a category on this Site, or on a dry run, no approval is asked for
        and the report comes back directly. Other callers are unaffected.
      x-scope: taxonomy:write
      x-permission: taxonomy.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-writavo-approval: category.delete
      x-writavo-approval-kind: destructive
      x-agent-consequence: Permanently deletes every category in the list; their articles keep their content and lose those categories.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/WritavoApproval"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDeleteInput" }
            examples:
              list:
                summary: Delete two categories
                value:
                  ids:
                    - "4f6b2c1e-8a3d-4e5f-9b7a-1c2d3e4f5a6b"
                    - "9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d"
      responses:
        "200":
          description: What happened to each id. Every id sent appears in exactly one list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/BulkDeleteResult" }
              examples:
                report:
                  summary: One deleted, one not on this Site
                  value:
                    ok: true
                    data:
                      deleted: ["4f6b2c1e-8a3d-4e5f-9b7a-1c2d3e4f5a6b"]
                      not_found: ["9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d"]
                      failed: []
                      dry_run: false
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/ApprovalRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      operationId: getCategory
      tags: [Categories]
