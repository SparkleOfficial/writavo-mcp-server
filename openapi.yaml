            - type: "null"
        category_id:
          type: [string, "null"]
          format: uuid
          description: |
            The PRIMARY category. Sent alone it files the article under that category too; an
            article that was in only its old primary category is moved, one in several keeps them.
        category_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
          description: |
            Every category the article is filed under: a full replacement, not a merge (send `[]` to
            clear). With `category_id` too, the primary is put first if missing; without it the
