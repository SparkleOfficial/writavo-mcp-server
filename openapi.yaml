  headers:
    RateLimitLimit:
      description: Requests permitted in the current window for this endpoint class.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Unix seconds at which the window resets.
      schema: { type: integer }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  schemas:
    # ---- envelopes -------------------------------------------------------
    ConnectionSiteKeyResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [key_id, key_prefix, created]
              properties:
                key_id: { type: string, format: uuid }
                key_prefix: { type: string }
                created:
                  type: boolean
                  description: False when the Site already had this key.

    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, const: true }
        data: {}
      description: |
        Every successful response has this shape. Check `ok` before reading `data`.

    ErrorEnvelope:
      type: object
      required: [ok, error]
      additionalProperties: false
      properties:
        ok: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: |
                A short, safe for display sentence. It never contains a stack trace, SQL, an
                internal identifier, or anything belonging to another customer. Branch on `code`,
                not on this string: wording may change within v1.
            fields:
              type: object
              additionalProperties: { type: string }
              description: |
                Present on `VALIDATION_FAILED`. Maps each offending field to a message you can
                show next to the input.
            approval:
              $ref: "#/components/schemas/ApprovalRef"
            request_id:
              type: string
              description: Quote this when contacting support. It identifies the exact request in our logs.
      description: Every failed response has this shape.

    ApprovalRef:
      type: object
      required: [id, url, expires_at, status]
      description: |
        Present on `428 APPROVAL_REQUIRED` and `428 APPROVAL_PENDING`. Show `url` to the person
        who can approve the action; once they have, repeat the identical request with
        `Writavo-Approval: <id>`.
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          format: uri
          description: The dashboard page where a person approves or denies this request.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: After this the approval can no longer be used. Null only if it could not be read.
        status:
          type: string
          enum: [pending]

    ImportStartOptions:
      type: object
      additionalProperties: false
      properties:
        publish:
          type: boolean
          default: true
          description: Publish articles whose status is published, with their original dates. false imports everything as a draft.
        confirm:
          type: boolean
          default: false
          description: Required as true when publish is true. Set it only when the person responsible for the site has agreed.
        rehost_images:
          type: boolean
          default: true
          description: Copy https images into the media library and rewrite their URLs.
        retry_failed:
          type: boolean
          default: false
          description: Retry, once, the articles an earlier run skipped or failed.
    ImportProgress:
      type: object
      properties:
        articles_total: { type: integer }
        articles_done: { type: integer }
        articles_failed: { type: integer }
        articles_skipped: { type: integer }
        images_copied: { type: integer }
        images_failed: { type: integer }
        categories_created: { type: integer }
        tags_created: { type: integer }
        authors_created: { type: integer }
    ImportStatus:
      type: object
      required: [import_id, state, progress]
      properties:
        import_id: { type: string }
        state:
          type: string
          enum: [idle, running, complete, failed, cancelled, waiting_for_confirm]
          description: idle means it has not been started.
        progress: { $ref: "#/components/schemas/ImportProgress" }
        started_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        batches: { type: integer }
        error: { type: [string, "null"], description: Why it stopped, when it did. }
        last_report: { type: [string, "null"], description: The last batch's report, including where its time went. }
        document:
          type: object
          properties:
            bytes: { type: integer }
            articles: { type: [integer, "null"] }
    ImportDryRun:
      type: object
      required: [import_id, dry_run]
      properties:
        import_id: { type: string }
        document:
          type: object
          properties:
            bytes: { type: integer }
            articles: { type: [integer, "null"] }
        dry_run:
          type: object
          required: [report, ok]
          properties:
            report: { type: string, description: The dry run, as text. }
            ok: { type: boolean, description: false when the document could not be checked at all. }
    ErrorCode:
      type: string
      description: |
        Stable machine readable codes. New codes may be added within v1, so treat an unknown
        code as a generic failure of its HTTP status class rather than crashing.

        | Code | HTTP | What it means |
        |---|---|---|
        | `INVALID_REQUEST` | 400 | Malformed JSON, a bad parameter, or a missing required header. |
        | `INVALID_API_KEY` | 401 | No key, an unparseable key, or one that does not exist. |
        | `API_KEY_REVOKED` | 401 | The key was revoked or rotated past its grace window. |
        | `API_KEY_EXPIRED` | 401 | The key passed its `expires_at`. |
        | `INSUFFICIENT_SCOPE` | 403 | The key is valid but lacks the scope this operation needs. For an AI agent, the message names the permission row the person must set to Read or Read and write when they reconnect. |
        | `FORBIDDEN` | 403 | Refused for a reason no scope would change: a key that may not extend itself, an OAuth sign-in not started by Writavo's MCP server, an AI agent changing the access of the person it acts for, anything to do with ownership, or a setting only a person may change. The message says which and what to do instead. |
        | `AGENT_ACCESS_DISABLED` | 403 | The key belongs to an AI agent and the organisation has turned AI agent access off. |
        | `APPROVAL_REQUIRED` | 428 | An AI agent asked for an action a person must approve. `error.approval` has the link and the id to retry with. |
        | `APPROVAL_PENDING` | 428 | The approval you sent has not been decided yet. Retry once it has. |
        | `APPROVAL_DENIED` | 403 | A person denied the action. |
        | `APPROVAL_INVALID` | 409 | The approval you sent cannot be used for this request: expired, already used, for a different request, unknown, or what the request would do has changed since it was approved. |
        | `NOT_ENTITLED` | 402 | Your plan does not include this AI pipeline capability. Upgrade. CMS capabilities are on every plan and never return this. |
        | `INSUFFICIENT_CREDITS` | 402 | The organisation cannot afford the next unit of work. Top up. |
        | `SPEND_CAP_REACHED` | 402 | This Site hit its own monthly ceiling. Raise it or wait. |
        | `PAYMENT_METHOD_REQUIRED` | 402 | This would go past your included CMS allowance and there is no payment method on file. Not a plan limit and not an upgrade: CMS resources are pay-as-you-go on every plan. Add a card and retry. Nothing already published stops serving. |
        | `NOT_FOUND` | 404 | No such object, or it belongs to another Site. Deliberately indistinguishable. |
        | `SLUG_CONFLICT` | 409 | Another object on this Site already uses that slug. |
        | `IDEMPOTENCY_KEY_CONFLICT` | 409 | The key was reused with a different request body. |
        | `IDEMPOTENCY_KEY_IN_FLIGHT` | 409 | The first request with this key is still running. Retry shortly. |
        | `CONFLICT` | 409 | The request clashes with the object's current state, or the object changed under you mid request. The message names the step to take. |
        | `PREREQUISITE_MISSING` | 409 | Something this operation needs is not set up yet. The message names it and the operation that sets it up. Nothing was done and nothing was charged. |
        | `FEATURE_UNAVAILABLE` | 409 | Writavo has this capability switched off right now: paid backlink data platform wide, or spending while the plan has no daily spend cap configured. Nothing the caller sends changes it. |
        | `PRECONDITION_FAILED` | 412 | Your `If-Match` did not match. Someone else edited it. Re-read and retry. |
        | `VALIDATION_FAILED` | 422 | The request parsed but the values are not acceptable. See `fields`. |
        | `RATE_LIMIT_EXCEEDED` | 429 | Too many requests. Back off and honour `Retry-After`. |
        | `MAINTENANCE` | 503 | Writes are paused for maintenance. Retry later. |
        | `INTERNAL_ERROR` | 500 | Our fault. Safe to retry an idempotent request. |
      enum:
        - INVALID_REQUEST
        - INVALID_API_KEY
        - API_KEY_REVOKED
        - API_KEY_EXPIRED
        - INSUFFICIENT_SCOPE
        - NOT_ENTITLED
        - INSUFFICIENT_CREDITS
        - SPEND_CAP_REACHED
        - PAYMENT_METHOD_REQUIRED
        - NOT_FOUND
        - SLUG_CONFLICT
        - IDEMPOTENCY_KEY_CONFLICT
        - IDEMPOTENCY_KEY_IN_FLIGHT
        - CONFLICT
        - PRECONDITION_FAILED
        - VALIDATION_FAILED
        - RATE_LIMIT_EXCEEDED
        - MAINTENANCE
        - INTERNAL_ERROR
        - FORBIDDEN
        - AGENT_ACCESS_DISABLED
        - APPROVAL_REQUIRED
        - APPROVAL_PENDING
        - APPROVAL_DENIED
        - APPROVAL_INVALID
        - PREREQUISITE_MISSING
        - FEATURE_UNAVAILABLE

    Page:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: [string, "null"]
          description: |
            Pass it back as `?cursor=` for the next page. `null` means you have reached the end.
            There is no total count: counting a growing table on every list request is the kind
            of query that gets slower exactly as a customer succeeds.
      description: |
        The shape of `data` on every list endpoint. Paging is cursor based rather than offset
        based, so rows are never skipped or repeated when content changes mid pagination.

    # ---- enums -----------------------------------------------------------
    ArticleStatus:
      type: string
      description: |
        The article state machine. Thirteen values, in two groups.

        **Yours, settable through the lifecycle endpoints:**

        - `draft` - private and editable. Where every article starts. Never touched by the AI.
        - `scheduled` - has a future `scheduled_publish_at`. A cron publishes it at that time.
        - `published` - public on your blog.

        **The pipeline's, readable but not settable.** A `PATCH` naming any of these is rejected
        with `422 VALIDATION_FAILED`:

        - `discovered`, `scored`, `skipped` - a candidate source found and triaged.
        - `scraped` - source fetched, research signal extracted.
        - `generated` - a draft the engine wrote, awaiting quality review.
        - `needs_improvement` - failed quality review; queued for a rewrite.
        - `needs_images` - text is final, images are being generated.
        - `queued` - finished and waiting for its publishing slot.
        - `rejected`, `failed` - abandoned, or errored past retry.

        More pipeline values may be added within v1 as the engine grows. Handle unknown values
        gracefully.
      enum:
        - discovered
        - scored
        - skipped
        - scraped
        - generated
        - needs_improvement
        - needs_images
        - queued
        - published
        - rejected
        - failed
        - draft
        - scheduled

    MediaBucket:
      type: string
      description: |
        Which library the asset belongs to. `blog-images` for article imagery, `author-avatars`
        for byline portraits.
      enum: [blog-images, author-avatars]
      default: blog-images

    EngagementEventInput:
      type: object
      additionalProperties: false
      required: [slug, type]
      properties:
        slug: {type: string, minLength: 1, maxLength: 200, description: The published article's slug.}
        type: {type: string, enum: [view, reaction, share]}
        reaction:
          type: [string, "null"]
          enum: [useful, mind_blown, insightful, skeptical, loved, hot_take, null]
          description: Required when type is reaction. null removes the reader's reaction.
        platform:
          type: string
          enum: [x, linkedin, facebook, other]
          description: Required when type is share. `other` is a copied link or the system share sheet.
        visitor_id:
          type: [string, "null"]
          minLength: 8
          maxLength: 200
          description: |
            Your stable anonymous id for the reader. Required for reactions; only a hash is stored.
            With it, a view or a share counts once per 30 minutes per reader and article.

    PostEngagement:
      type: object
      required: [slug, views, reactions, shares, user_reaction, comments]
      properties:
        slug: {type: string}
        views: {type: integer, description: Lifetime views.}
        reactions:
          type: object
          description: Current totals per reaction (a reader counts once, for their current pick).
          properties:
            useful: {type: integer}
            mind_blown: {type: integer}
            insightful: {type: integer}
            skeptical: {type: integer}
            loved: {type: integer}
            hot_take: {type: integer}
        shares:
          type: object
          properties:
            x: {type: integer}
            linkedin: {type: integer}
            facebook: {type: integer}
            other: {type: integer, description: Copied links and system share sheets.}
            total: {type: integer}
        user_reaction:
          type: [string, "null"]
          description: The reader's current reaction when visitor_id was sent, else null.
        comments:
          type: integer
          description: Approved reader comments on the article; 0 while the Site has comments off.

    PostEngagementBatch:
      type: object
      required: [posts, missing]
      properties:
        posts:
          type: array
          description: One entry per published article named, ordered by slug.
          items: { $ref: "#/components/schemas/PostEngagement" }
        missing:
          type: array
          description: The slugs that are not a published article on this Site.
          items: { type: string }

    # ---- analytics (0159) ------------------------------------------------
    AnalyticsInstallStatus:
      type: object
      description: |
        What the collector has received. Raw arrivals, available at once (the visitor report is rolled
        up every 15 minutes).
      required: [last_event_at, last_event_host, last_event_path, events_24h, rejected_hosts]
      properties:
        last_event_at: { type: [string, "null"], format: date-time, description: The newest event in the last 90 days. }
        last_event_host: { type: [string, "null"], description: The host of the page that sent it. }
        last_event_path: { type: [string, "null"], description: The path of the page that sent it. }
        events_24h: { type: integer, description: Pageviews and engagement events counted in the last 24 hours. }
        rejected_hosts:
          type: array
          description: |
            Hosts whose pageviews carried this Site's id but were dropped because the host is not on
            the Site's domain list, today and yesterday (UTC), newest first, at most 20. Add the ones
            that are yours with `PATCH /analytics/settings` (`extra_domains`).
          items:
            type: object
            required: [hostname, hits, last_seen_at]
            properties:
              hostname: { type: string }
              hits: { type: integer }
              last_seen_at: { type: string, format: date-time }

    AnalyticsSetup:
      type: object
      required: [site_id, enabled, collector_origin, script_url, snippet, extra_domains, allowed_domains, install, docs_url]
      properties:
        site_id:
          type: string
          pattern: "^wa_[0-9a-f]{24}$"
          description: The Site's public analytics id, the script's `data-site`. Public by design; it is in every page.
        enabled: { type: boolean, description: Whether visits are being counted. }
        collector_origin:
          type: string
          description: Where the script and the collector live. Always a public https origin, `https://blog.writavo.com` in production.
        script_url: { type: string, description: "`collector_origin` + `/api/a/s`." }
        snippet: { type: string, description: The tag to paste inside `<head>` on every page that shows your articles. }
        extra_domains:
          type: array
          items: { type: string }
          description: Domains you added; each also counts its subdomains.
        allowed_domains:
          type: array
          description: Every domain whose visits count, and why.
          items:
            type: object
            required: [domain, source, subdomains]
            properties:
              domain: { type: string }
              source:
                type: string
                enum: [primary_domain, custom_hostname, proxy, extra_domain]
              subdomains: { type: boolean, description: Whether its subdomains count too. }
        install: { $ref: "#/components/schemas/AnalyticsInstallStatus" }
        docs_url: { type: string, description: The installation guide. }

    AnalyticsSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: { type: boolean, description: Count visits (true) or drop them all (false). }
        extra_domains:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 253 }
          description: |
            Replaces the whole list. Bare domains (`docs.example.com`); a pasted URL is reduced to its
            host. Each counts its subdomains too. `[]` clears the list.

    VisitorTotals:
      type: object
      required: [visitors, pageviews, bounces, engaged_ms, engaged_samples, avg_engaged_seconds]
      properties:
        visitors: { type: integer, description: Unique visitors per day, summed over the range. }
        pageviews: { type: integer }
        bounces: { type: integer, description: Visits of a single page. }
        engaged_ms: { type: integer, description: Total time the pages were visible, in milliseconds. }
        engaged_samples: { type: integer, description: How many engagement measurements `engaged_ms` sums. }
        avg_engaged_seconds: { type: integer, description: "`engaged_ms / engaged_samples / 1000`, rounded; 0 with no samples." }

    VisitorMetrics:
      type: object
      required: [visitors, pageviews, bounces, engaged_ms, engaged_samples]
      properties:
        visitors: { type: integer }
        pageviews: { type: integer }
        bounces: { type: integer }
        engaged_ms: { type: integer }
        engaged_samples: { type: integer }

    VisitorBreakdownRow:
      allOf:
        - type: object
          required: [value]
          properties:
            value: { type: string, description: "The page path, source, country code, device and so on." }
        - { $ref: "#/components/schemas/VisitorMetrics" }

    VisitorAnalytics:
      type: object
      required: [from, to, totals, previous, daily, breakdowns]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { $ref: "#/components/schemas/VisitorTotals" }
        previous:
          allOf:
            - { $ref: "#/components/schemas/VisitorTotals" }
          description: The same numbers for the range of the same length just before `from`.
        daily:
          type: array
          description: Every UTC day of the range, oldest first, zeros included.
          items:
            allOf:
              - type: object
                required: [day]
                properties:
                  day: { type: string, format: date }
              - { $ref: "#/components/schemas/VisitorMetrics" }
        breakdowns:
          type: object
          description: The top 50 values of each dimension over the range, most visitors first. Every key is present.
          required: [page, entry_page, source, referrer, utm_source, utm_medium, utm_campaign, country, region, city, device, browser, os]
          properties:
            page: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            entry_page: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            source: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            referrer: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            utm_source: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            utm_medium: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            utm_campaign: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            country: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            region: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            city: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            device: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            browser: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }
            os: { type: array, items: { $ref: "#/components/schemas/VisitorBreakdownRow" } }

    AnalyticsInstallCheckInput:
      type: object
      additionalProperties: false
      properties:
        url:
          type: [string, "null"]
          maxLength: 2000
          description: |
            The http(s) address of a page that should carry the script. Its host must be one this Site
            counts visits from. Omitted: the Site's first verified custom domain, else its primary domain.

    AnalyticsInstallCheck:
      type: object
      required: [url, final_url, status, checks, script, install]
      properties:
        url: { type: string, description: The page that was checked. }
        final_url: { type: [string, "null"], description: Where it ended after redirects; null when it could not be fetched. }
        status:
          type: string
          enum: [ok, warning, failed]
          description: "`failed`: this page will not be counted. `warning`: it will, but something needs a look."
        checks:
          type: array
          description: Always the seven checks, in this order.
          items:
            type: object
            required: [key, ok, message]
            properties:
              key:
                type: string
                enum: [page_reachable, tag_present, site_id_matches, collector_public, include_matches, collecting_enabled, recent_events]
              ok: { type: boolean }
              message: { type: string, description: What was found, and what to fix when it is not ok. }
        script:
          description: The analytics tag found in the page (the one with this Site's id when there are several), or null.
          oneOf:
            - type: "null"
            - type: object
              required: [found, src, site_id, data_include, data_api]
              properties:
                found: { type: boolean, const: true }
                src: { type: string }
                site_id: { type: [string, "null"], description: Its `data-site`. }
                data_include: { type: [string, "null"] }
                data_api: { type: [string, "null"] }
        install: { $ref: "#/components/schemas/AnalyticsInstallStatus" }

    # ---- comments (0159) -------------------------------------------------
    PublicComment:
      type: object
      description: A comment as readers see it. Never carries the email address.
      required: [id, parent_id, author_name, author_kind, body, created_at]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid, description: The comment this replies to; null for a top-level comment. }
        author_name: { type: string, maxLength: 80 }
        author_kind:
          type: string
          enum: [reader, staff]
          description: "`staff`: a reply from the Site's team, shown with a badge."
        body: { type: string, maxLength: 5000, description: Plain text. Render it as text, never as HTML. }
        created_at: { type: string, format: date-time }

    Comment:
      allOf:
        - { $ref: "#/components/schemas/PublicComment" }
        - type: object
          required: [status, author_email, source, article_id, article_slug, updated_at, approved_at]
          properties:
            status: { type: string, enum: [pending, approved, spam] }
            author_email: { type: [string, "null"], description: Never shown publicly. }
            source:
              type: string
              enum: [hosted, api, dashboard]
              description: "Where it came from: the hosted blog, `POST /comments`, or the dashboard."
            article_id: { type: string, format: uuid }
            article_slug: { type: [string, "null"] }
            updated_at: { type: string, format: date-time }
            approved_at: { type: [string, "null"], format: date-time }

    CommentPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [counts]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Comment" }
            counts:
              type: object
              description: The whole Site's comments in each status, whatever the filter.
              required: [pending, approved, spam]
              properties:
                pending: { type: integer }
                approved: { type: integer }
                spam: { type: integer }

    PostComments:
      type: object
      required: [slug, enabled, open, require_email, count, comments]
      properties:
        slug: { type: string }
        enabled: { type: boolean, description: Whether the Site has comments on. }
        open: { type: boolean, description: Whether this article takes new comments now. }
        require_email: { type: boolean, description: Whether a new comment needs `author_email`. }
        count: { type: integer, description: Approved comments on the article. }
        comments:
          type: array
          description: Approved comments, oldest first, at most 1,000. A reply whose parent is not approved is left out.
          items: { $ref: "#/components/schemas/PublicComment" }

    CommentSubmission:
      type: object
      additionalProperties: false
      required: [slug, body, author_name]
      properties:
        slug: { type: string, minLength: 1, maxLength: 200, description: The published article's slug. }
        body: { type: string, minLength: 1, maxLength: 5000, description: Plain text. Line breaks are kept. }
        author_name: { type: string, minLength: 1, maxLength: 80 }
        author_email:
          type: [string, "null"]
          maxLength: 254
          description: Required when the Site's `require_email` is on. Never shown publicly.
        parent_id:
          type: [string, "null"]
          format: uuid
          description: Reply to this approved comment.
        reader_ip:
          type: [string, "null"]
          maxLength: 45
          description: |
            The reader's IPv4 or IPv6 address as your server saw it. Used only, hashed under a daily
            salt, for the per-reader limit (5 comments in 10 minutes) and duplicate detection.

    SubmittedComment:
      allOf:
        - { $ref: "#/components/schemas/PublicComment" }
        - type: object
          required: [status, duplicate]
          properties:
            status:
              type: string
              enum: [pending, approved]
              description: "`approved`: shown now. `pending`: waiting for review."
            duplicate: { type: boolean, description: True when this is the same comment sent again; nothing new was stored. }

    CommentUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [pending, approved, spam] }

    CommentReplyInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        author_name:
          type: [string, "null"]
          maxLength: 80
          description: Defaults to the key creator's name, else the Site's name.

    CommentSettings:
      type: object
      required: [enabled, moderation, require_email, close_after_days]
      properties:
        enabled: { type: boolean, description: Readers can comment. Off by default. }
        moderation:
          type: string
          enum: [hold_all, hold_links, approve_all]
          description: |
            `hold_all`: every reader comment waits for review (the default). `hold_links`: only comments
            carrying a link wait. `approve_all`: published at once.
        require_email: { type: boolean }
        close_after_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
          description: Articles published longer ago than this take no new comments. Null keeps them open.

    CommentSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: { type: boolean }
        moderation: { type: string, enum: [hold_all, hold_links, approve_all] }
        require_email: { type: boolean }
        close_after_days: { type: [integer, "null"], minimum: 1, maximum: 3650 }

    CommentEraseInput:
      type: object
      additionalProperties: false
      required: [author_email]
      properties:
        author_email: { type: string, maxLength: 254, description: The commenter's email address. }

    CommentEraseResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, description: How many comments written under the address were deleted. Replies to them go too and are not counted. }

    EngagementImportInput:
      type: object
      additionalProperties: false
      description: |
        At most 5,000 `daily` rows and 10,000 `reactions` rows per call; split a larger history
        into several calls (each row SETs, so the order of calls does not matter). A body that is
        not this shape, or is over a cap, is refused whole with 422; a bad ROW is only skipped and
        reported in `problems`.
      properties:
        dry_run:
          type: boolean
          default: true
          description: Check and report without writing. Defaults to true; send false to write.
        daily:
          type: array
          maxItems: 5000
          description: Per article per UTC day, views, the reaction total and shares per platform.
          items: { $ref: "#/components/schemas/EngagementImportDay" }
        reactions:
          type: array
          maxItems: 10000
          description: Each reader's current reaction per article. One row per reader and article.
          items: { $ref: "#/components/schemas/EngagementImportPick" }

    EngagementImportDay:
      type: object
      additionalProperties: false
      required: [day]
      description: Give exactly one of `external_id` or `slug`, and at least one of `views`, `reactions`, `shares`.
      properties:
        external_id: {type: string, pattern: "^[!-~]{1,255}$", description: The article's external_id on this Site.}
        slug: {type: string, minLength: 1, maxLength: 200, description: Or the article's slug on this Site.}
        day:
          type: string
          format: date
          description: The UTC day, from 1990-01-01 to today. For today, live views and shares recorded after the import add to the imported counts.
        views: {type: integer, minimum: 0, maximum: 10000000, description: That day's views. Replaces the stored value.}
        reactions:
          description: That day's reaction total, or counts per reaction (summed; at most 10,000,000 in all).
          oneOf:
            - {type: integer, minimum: 0, maximum: 10000000}
            - type: object
              additionalProperties: false
              properties:
                useful: {type: integer, minimum: 0, maximum: 10000000}
                mind_blown: {type: integer, minimum: 0, maximum: 10000000}
                insightful: {type: integer, minimum: 0, maximum: 10000000}
                skeptical: {type: integer, minimum: 0, maximum: 10000000}
                loved: {type: integer, minimum: 0, maximum: 10000000}
                hot_take: {type: integer, minimum: 0, maximum: 10000000}
        shares:
          type: object
          additionalProperties: false
          description: Share clicks per platform. Replaces all four; a platform left out becomes 0.
          properties:
            x: {type: integer, minimum: 0, maximum: 10000000}
            linkedin: {type: integer, minimum: 0, maximum: 10000000}
            facebook: {type: integer, minimum: 0, maximum: 10000000}
            other: {type: integer, minimum: 0, maximum: 10000000, description: Copied links and system share sheets.}

    EngagementImportPick:
      type: object
      additionalProperties: false
      required: [visitor_id, reaction, set_at]
      description: Give exactly one of `external_id` or `slug`.
      properties:
        external_id: {type: string, pattern: "^[!-~]{1,255}$", description: The article's external_id on this Site.}
        slug: {type: string, minLength: 1, maxLength: 200, description: Or the article's slug on this Site.}
        visitor_id:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The reader's anonymous id at the old blog. Hashed with the Site's id before it is stored,
            the same way POST /engagement/events hashes it; never stored raw.
        reaction: {type: string, enum: [useful, mind_blown, insightful, skeptical, loved, hot_take]}
        set_at:
          type: string
          format: date-time
          description: When the reader made this reaction, with a timezone. Not in the future, not before 1990.

    EngagementImportResult:
      type: object
      required: [dry_run, written, posts, problems]
      properties:
        dry_run: {type: boolean}
        written:
          type: object
          description: What this call wrote. All zeros on a dry run.
          required: [daily, share_rows, picks]
          properties:
            daily: {type: integer, description: Days set (one per valid daily row).}
            share_rows: {type: integer, description: Per-platform share rows written (platforms above 0).}
            picks: {type: integer, description: Readers' reactions that changed. An identical reaction is not rewritten, so a repeat reports 0.}
        posts:
          type: array
          description: Per matched article, what the valid rows carry (the same on a dry run).
          items:
            type: object
            required: [slug, external_id, days, views, reactions, shares, picks]
            properties:
              slug: {type: string}
              external_id: {type: [string, "null"]}
              days: {type: integer}
              views: {type: integer}
              reactions: {type: integer}
              shares: {type: integer}
              picks: {type: integer}
        problems:
          type: array
          description: The rows that were skipped, and why.
          items:
            type: object
            required: [section, index, error]
            properties:
              section: {type: string, enum: [daily, reactions]}
              index: {type: integer, description: The row's position in its array, from 0.}
              error: {type: string}

    Redirect:
      type: object
      description: An old URL and where it sends readers now (0127).
      required: [id, from, from_host, from_path, from_query, to, to_article_id, to_category_id, to_tag_id,
                 target_path, status, origin, note, served_by_writavo, last_hit_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        from:
          type: string
          description: The old URL as stored (normalised), a path under the blog or a full URL.
        from_host:
          type: [string, "null"]
          description: The old URL's host, without `www.`. `null` means a path under the blog root, on every host the blog is served on.
        from_path: { type: string, description: The old path, lower case, no trailing slash. }
        from_query:
          type: [string, "null"]
          description: The query parameters the old URL must carry (`p=123`), or `null`.
        to: { type: [string, "null"], description: A literal target (path under the blog root or full URL). }
        to_article_id: { type: [string, "null"], format: uuid }
        to_category_id: { type: [string, "null"], format: uuid }
        to_tag_id: { type: [string, "null"], format: uuid }
        target_path:
          type: [string, "null"]
          description: |
            Where it points now: a path under the blog root (`/my-post`) or a full URL. `null`
            while the target is not published (or the term is archived): the old URL then gets
            the ordinary 404 rather than a redirect to one.
        status: { type: integer, enum: [301, 302], description: 301 permanent, 302 temporary. }
        origin:
          type: string
          enum: [manual, import, slug_change]
          description: "`slug_change`: made automatically when a published article, a category or a tag changed its slug."
        note: { type: [string, "null"], maxLength: 500 }
        served_by_writavo:
          type: boolean
          description: |
            True when Writavo's blog answers this old URL itself. False: install it on your own
            server (`GET /redirects/export`), or apply it in your own front end if you render the
            blog yourself.
        last_hit_at: { type: [string, "null"], format: date-time, description: Last used, to the hour. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RedirectWrite:
      type: object
      additionalProperties: false
      required: [from]
      description: The old URL and exactly one target.
      properties:
        from:
          type: string
          maxLength: 2048
          description: A path starting with `/`, or an `http(s)://` URL. Not the blog's home page.
        to:
          type: string
          maxLength: 2048
          description: A path under the blog root (`/my-post`) or an `http(s)://` URL.
        to_article_id: { type: string, format: uuid }
        to_external_id: { type: string, maxLength: 255, description: The article's `external_id` on this Site. }
        to_category_id: { type: string, format: uuid }
        to_tag_id: { type: string, format: uuid }
        status: { type: integer, enum: [301, 302], default: 301 }
        note: { type: [string, "null"], maxLength: 500 }

    RedirectUpdate:
      type: object
      additionalProperties: false
      description: At most one target field; fields left out keep their value.
      properties:
        to: { type: string, maxLength: 2048 }
        to_article_id: { type: string, format: uuid }
        to_external_id: { type: string, maxLength: 255 }
        to_category_id: { type: string, format: uuid }
        to_tag_id: { type: string, format: uuid }
        status: { type: integer, enum: [301, 302] }
        note: { type: [string, "null"], maxLength: 500 }

    RedirectBulkInput:
      type: object
      additionalProperties: false
      required: [redirects]
      properties:
        dry_run: { type: boolean, default: true, description: Check and report, write nothing. }
        redirects:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/RedirectWrite" }

    RedirectBulkResult:
      type: object
      required: [dry_run, written, items, problems]
      properties:
        dry_run: { type: boolean }
        written:
          type: object
          required: [created, updated, unchanged]
          description: What this call wrote (or would write, on a dry run).
          properties:
            created: { type: integer }
            updated: { type: integer }
            unchanged: { type: integer }
        items:
          type: array
          description: One per valid row. `id` is null for a redirect a dry run would create.
          items:
            type: object
            required: [index, id, action]
            properties:
              index: { type: integer }
              id: { type: [string, "null"], format: uuid }
              action: { type: string, enum: [created, updated, unchanged] }
        problems:
          type: array
          description: The rows that were skipped, and why.
          items:
            type: object
            required: [index, error]
            properties:
              index: { type: integer, description: The row's position in `redirects`, from 0. }
              error: { type: string }

    RedirectExport:
      type: object
      required: [format, filename, count, skipped, content]
      properties:
        format: { type: string, enum: [csv, nginx, apache, cloudflare, vercel] }
        filename: { type: string, description: A suggested file name. }
        count: { type: integer, description: Redirects in the file. }
        skipped:
          type: array
          items:
            type: object
            required: [id, from, reason]
            properties:
              id: { type: string, format: uuid }
              from: { type: string }
              reason: { type: string }
        content: { type: string, description: The file's text. }

    PipelineStage:
      type: string
      description: The engine stage a run belongs to.
      enum: [dispatch, discover, score, scrape, extract, plan, generate, improve, classify, images, publish]

    PipelineRunStatus:
      type: string
      description: |
        `partial` means the run did useful work and then stopped early. That is the normal
        outcome when credits or a spend cap run out mid run, and it is not an error: what was
        produced is kept.
      enum: [running, success, failed, partial]

    PlanItemStatus:
      type: string
      enum: [planned, in_progress, done, skipped]

    PlanItemSource:
      type: string
      description: |
        Where the topic came from. `manual` if a person (or an API client) added it,
        `content_gap` if gap analysis found it, `competitor_seed` if it came from a competitor
        page, `link_opportunity` if it was planned from a link opportunity.
      enum: [content_gap, manual, competitor_seed, link_opportunity]

    KeyKind:
      type: string
      description: |
        `publishable` keys are prefixed `wv_pub_` and are safe in client code: read only, limited
        to published content, and admitted only to the operations marked `x-publishable: true`.
        Anything else returns `403 INSUFFICIENT_SCOPE`, whatever scopes the key carries.

        `secret` keys are prefixed `wv_sk_` and are server side only.
      enum: [publishable, secret]

    Scope:
      type: string
      description: |
        What a key is permitted to do. A key carries a set of these, and every operation names
        the one it needs.

        Scope is the outer bound, not the whole answer. A request must also pass the creator's
        live permissions, the plan entitlement, and, for a pipeline run, credits and the spend
        cap. A scope you hold can still be refused by the gate behind it.

        A publishable key may only carry `:read` scopes, and only ever sees published content.
        Three of them are deliberately NOT available to a publishable key, because the endpoints
        behind them return things a browser bundle must not carry: `media:read` lists the whole
        library including assets attached only to drafts, `pipeline:read` returns the Site's
        unpublished editorial queue, and `webhooks:read` is account configuration.

        `meta:read` IS publishable, but `GET /usage` within it is not: it returns the
        organisation's credit balance and plan, and a publishable key presenting it gets
        `403 INSUFFICIENT_SCOPE`. Every operation states which side of that line it is on in
        `x-publishable`. None of the settings, delivery, SEO, outreach, team, billing, insights or
        logs scopes can be held by a publishable key.

        An AI agent's key (from a device or OAuth sign-in) can carry every scope except
        `keys:read`, `keys:write`, `webhooks:read` and `webhooks:write`: credentials and event
        delivery stay with people. `comments:read` and `comments:write` need the comments.moderate
        permission, because the moderation queue carries commenters' email addresses; a Site's
        approved comments are read with `articles:read`, and a reader's comment is posted with
        `engagement:write`. `plan:write` and `prompts:write` let a key change what the AI
        writes; `pipeline:config`, `seo:write`, `delivery:write` and `billing:write` include
        operations that spend money; `team:write` and `roles:write` change who can do what.
      enum:
        - articles:read
        - articles:write
        - taxonomy:read
        - taxonomy:write
        - authors:read
        - authors:write
        - media:read
        - media:write
        - pipeline:read
        - pipeline:run
        - keys:read
        - keys:write
        - webhooks:read
        - webhooks:write
        - meta:read
        - site:read
        - site:write
        - pipeline:config
        - prompts:write
        - plan:write
        - delivery:read
        - delivery:write
        - integrations:write
        - seo:read
        - seo:write
        - outreach:read
        - team:read
        - team:write
        - roles:write
        - billing:read
        - billing:write
        - engagement:write
        - insights:read
        - logs:read
        - org:write
        - entries:read
        - entries:write
        - content_types:write
        - comments:read
        - comments:write

    WebhookEvent:
      type: string
      description: |
        Events you can subscribe to. Every one of them corresponds to a mutation this API can
        perform, and each fires whether the change came from this API or from the dashboard.

        More may be added within v1, so ignore an event type you do not recognise rather than
        failing the delivery.

        `article.published` is the one most integrations want: it is the signal to rebuild a
        statically generated site. `article.unpublished` and `article.deleted` are the ones people
        forget, and forgetting them leaves content live on your site after it is gone from ours.
      enum:
        - article.created
        - article.updated
        - article.deleted
        - article.published
        - article.unpublished
        - article.scheduled
        - article.unscheduled
        - category.created
        - category.updated
        - category.deleted
        - tag.created
        - tag.updated
        - tag.deleted
        - author.created
        - author.updated
        - author.deleted
        - media.created
        - media.updated
        - media.deleted
        - pipeline.run.completed
        - pipeline.run.failed
        - entry.created
        - entry.updated
        - entry.deleted
        - entry.published
        - entry.unpublished
        - comment.created

    WebhookPayload:
      type: object
      description: |
        The body of every delivery. It is JSON, it is what the signature is computed over, and it
        is byte-identical across retries and redeliveries of the same event.

        `data` is the resource in the same shape the REST API returns it, so a handler for
        `article.published` can use the same parser as `GET /articles/{id}`. The one exception is
        a `*.deleted` event, where the object no longer exists and `data` carries only its `id`.

        `website_id` deliberately appears nowhere: you already know which Site you configured.
      required: [id, event, created_at, data]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The EVENT id. Stable across every retry and across a manual redelivery, and this is
            what you deduplicate on. The id of the individual HTTP attempt is in the
            `Writavo-Delivery` header instead, because it identifies the request rather than the
            fact.
        event: { $ref: "#/components/schemas/WebhookEvent" }
        created_at:
          type: string
          format: date-time
          description: When the event was queued, not when this attempt was sent.
        data:
          type: object
          additionalProperties: true
          description: 'The resource, as the REST API returns it. `{ "id": "..." }` for a delete.'

    # ---- resources -------------------------------------------------------
    Article:
      type: object
      description: |
        An article. `content` is **markdown**, not HTML, in both directions: what you send is
        what is stored, and it is rendered at publish time. Send markdown.

        Where the article came from is `source` (see `ArticleSource`): returned on
        `GET /articles/{id}` to a secret key only, never to a publishable key, never in a list and
        never in a webhook payload, because it is private provenance, not content.

        Several pipeline columns are deliberately absent from this schema rather than exposed as
        read only, because they describe the engine's internal working rather than your content:
        the image job handle and image ladder stage (vendor
        job state that changes shape when we change provider), the raw quality critique (an
        unstable model output), the source page's SEO score (a number about someone else's page),
        the dispatcher's priority ordering knob, and the rewrite attempt counter. Exposing any of
        them would freeze an internal detail into a contract we have promised not to break.

        `quality_score` **is** exposed, read only, because it is a stable, meaningful number
        about your own article.
      required: [id, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        status:
          allOf: [{ $ref: "#/components/schemas/ArticleStatus" }]
          readOnly: true
          description: Read only here. Change it with the lifecycle endpoints.
        article_kind:
          type: string
          enum: [article, news, page]
          description: |
            `article` is a post; `news` a news story written by a news recipe (NewsArticle markup, the
            Google News sitemap); `page` a page such as About or Contact: served at the blog's root like
            a post, but with no byline or date, never in the blog's listings or RSS feed, and never
            rewritten by the AI pipeline. Pages and posts share one URL space.
        title: { type: [string, "null"], maxLength: 300 }
        slug:
          type: [string, "null"]
          maxLength: 200
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: |
            The URL segment on your blog. Unique within the Site; a collision is
            `409 SLUG_CONFLICT`. May be null on a draft, and is required to publish.
        external_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
          pattern: "^[!-~]+$"
          description: |
            Your own stable id for this article in the system it came from, such as the
            primary key in your old CMS. Printable ASCII, no spaces. Unique within the Site: a
            second article with the same value is `409 CONFLICT`. Null for anything written in
            Writavo. Filter on it with `GET /articles?external_id=`.
        body_format:
          type: string
          enum: [markdown, json]
          readOnly: true
          description: |
            `json` when the article was last saved from the dashboard's rich editor: `body_json` is
            then its document and `content` that document's exact markdown. `markdown` otherwise.
            Writing `content` through this API makes it `markdown` again.
        body_json:
          type: [object, "null"]
          readOnly: true
          description: |
            The rich editor's document (ProseMirror JSON: doc, paragraph, heading, lists, table,
            image, codeBlock, embed, markdownRaw, and the bold / italic / strike / code / link marks)
            when `body_format` is `json`, else null. Not in the list default. `content` always holds
            the same body as markdown, so a reader that only knows markdown loses nothing.
        content:
          type: [string, "null"]
          description: |
            The body, in markdown. Not returned in the list default projection; ask for it by
            name or fetch the article individually.

            **Embeds.** A line on its own of the form `::embed{url="https://..."}` renders as an
            embedded YouTube or Vimeo player, or a link card for a post on X, on your blog and in
            `content_html`. Any other URL renders as a plain link. Raw HTML (an `<iframe>`) is
            never rendered, so use this line instead.
        excerpt: { type: [string, "null"], maxLength: 1000 }
        featured_image_url: { type: [string, "null"], format: uri }
        featured_image_alt:
          type: [string, "null"]
          maxLength: 500
          description: |
            Alt text for `featured_image_url`: what the image shows, for screen readers and image
            search. Rendered as the hero image's `alt` and as `og:image:alt` on your blog. Null
            when none has been written, and your blog then uses the article title.
        seo_title: { type: [string, "null"], maxLength: 200 }
        seo_description: { type: [string, "null"], maxLength: 400 }
        seo_keywords:
          type: [array, "null"]
          items: { type: string }
        faqs:
          type: [array, "null"]
          description: Question and answer pairs, rendered as FAQ structured data on your blog.
          items:
            type: object
            required: [question, answer]
            properties:
              question: { type: string }
              answer: { type: string }
        key_takeaways:
          type: [array, "null"]
          description: Short summary bullets rendered above the body.
          items: { type: string }
        howto_steps:
          type: [object, "null"]
          description: |
            A how-to: its own title and summary, and the ordered steps. Rendered on the blog and as
            HowTo structured data. `name` and `description` are "" when the how-to has none. On a
            write, a bare array of steps is also accepted and stored in this shape.
          properties:
            name: { type: string, description: The how-to's own title. }
            description: { type: string, description: A short summary of the how-to. }
            steps:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  text: { type: string }
                  image_url: { type: string, format: uri }
        comparison:
          type: [object, "null"]
          description: A comparison table, rendered as a table in the body.
          properties:
            title: { type: string, description: The table's own heading. "" when it has none. }
            headers:
              type: array
              items: { type: string }
            rows:
              type: array
              items:
                type: array
                items: { type: string }
        category_id:
          type: [string, "null"]
          format: uuid
          description: The PRIMARY category, shown on the article and used for its breadcrumb. Always one of `category_ids`.
        category_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Every category the article is filed under, the primary first (at most 20). Not in the list
            default projection; ask for it with `fields`.
        author_id: { type: [string, "null"], format: uuid }
        format_id:
          type: [string, "null"]
          format: uuid
          description: The article format. See `GET /formats`.
        tag_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Every tag on this article. On `PATCH` this is a full replacement, not a merge: send
            the complete set you want, and send `[]` to clear.
        quality_score:
          type: [number, "null"]
          readOnly: true
          description: |
            The engine's quality rating out of 100 for an article it wrote. Null for anything
            written by hand.
        published_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: |
            When the article was **first** made public. Set by the first publish and never
            changed after, including across an unpublish and republish, because it is your blog's
            ordering key. An imported article's first publish may supply its original date.
        scheduled_publish_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: Set through `POST /articles/{id}/schedule`.
        scheduled_unpublish_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: When a published article comes down on its own. Set through `POST /articles/{id}/schedule-unpublish`; cleared by any unpublish.
        content_updated_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: |
            When what a reader sees last changed: the title, slug, body, excerpt, images, SEO
            fields, structured blocks, category or author. Unlike `updated_at` it ignores internal
            bookkeeping, so it is the honest value for `dateModified` and a sitemap `lastmod`.
        original_published_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the article was ORIGINALLY published in the system it was imported from. Record it
            on create or update and the article's **first** publish, from any path (the dashboard,
            `POST /articles/{id}/publish`, an MCP client, a schedule or the pipeline), sets
            `published_at` to this date instead of now. Has no effect once `published_at` is set.
            Never shown on your blog on its own. Not in the list default (ask for it with `fields`),
            and never returned to a publishable key.

            **Setting or correcting it by hand:** `PATCH /articles/{id}` with a secret key that has
            `articles:write`, at any time; only its value at the moment of the first publish counts.
            Send `null` to clear it (the first publish then uses the time of publishing). There is no
            field for it in the dashboard; the dashboard shows it next to the Publish button, and
            publishing from there uses it. Stored to the millisecond: finer digits are dropped.
        original_content_updated_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the imported article's content last changed at its source. Needs
            `original_published_at` and may not be earlier than it. While the article has never been
            published, `content_updated_at` follows it (or `original_published_at` when it is null),
            so the first publish keeps the source's `lastmod`; an edit made in Writavo before then
            moves `content_updated_at` to the edit time as usual. Never returned to a publishable key.
        canonical_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: |
            The canonical URL override, an absolute http(s) URL. Set it when this article's primary
            copy lives at another address (a syndicated post). Null means the article's own URL.
            An article whose canonical points anywhere else is left out of your sitemap.
        noindex:
          type: boolean
          description: |
            `true` asks search engines not to index the page (`robots: noindex`) and leaves it out
            of your sitemap. The page stays reachable, listed on your blog and in your RSS feed.
        og_title:
          type: [string, "null"]
          maxLength: 200
          description: The social-share title (`og:title`). Null means `seo_title`, then `title`.
        og_description:
          type: [string, "null"]
          maxLength: 400
          description: The social-share description. Null means `seo_description`, then `excerpt`.
        og_image_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: The social-share image, an absolute http(s) URL. Null means `featured_image_url`.
        og_image_alt:
          type: [string, "null"]
          maxLength: 500
          description: Alt text for `og_image_url`. Null means `featured_image_alt`, then the title.
        custom_fields:
          type: object
          additionalProperties: true
          description: |
            The values of the Site's custom article fields (the content type of kind `article_fields`,
            `GET /content-types/article`), keyed by field API id. Not in the list default projection.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        source:
          readOnly: true
          description: |
            Secret keys only, on `GET /articles/{id}`: where the article came from, or null when it
            has no source. Absent for a publishable key, in lists and in webhook payloads.
          oneOf:
            - $ref: '#/components/schemas/ArticleSource'
            - type: "null"

    ArticleSource:
      type: object
      description: |
        Private provenance: the page an article was written from and how that page was used.
        `usage` is derived from `originality_pct` (the share of the article's 5-word phrases not
        found in the source text): `inspiration` at 85% or more, `rewrite` below, `unmeasured`
        when there is no figure. `originality_method` says whether Writavo measured it against the
        stored source text or kept a figure reported by another system on import.
      properties:
        url: { type: [string, "null"], format: uri }
        title: { type: [string, "null"] }
        origin:
          type: [string, "null"]
          enum: [competitor, feed, import, null]
          description: competitor = found by the pipeline; feed = a news feed item; import = recorded with an imported article.
        usage: { type: string, enum: [inspiration, rewrite, unmeasured] }
        originality_pct: { type: [number, "null"], minimum: 0, maximum: 100 }
        originality_method: { type: [string, "null"], enum: [measured, reported, null] }
        competitor:
          type: [object, "null"]
          properties:
            name: { type: [string, "null"] }
            domain: { type: string }
        metrics:
          type: [object, "null"]
          description: The source page's SEO strength when it was chosen.
          properties:
            seo_score: { type: [number, "null"] }
            organic_traffic: { type: [integer, "null"] }
            backlinks: { type: [integer, "null"] }
            referring_domains: { type: [integer, "null"] }
            ranking_keywords: { type: [integer, "null"] }
            top10_keywords: { type: [integer, "null"] }
        target_keywords: { type: array, items: { type: string } }
        has_source_text:
          type: boolean
          description: Whether the source page's text is stored (kept permanently), so originality can be re-measured.

    ArticleSourceWrite:
      type: object
      additionalProperties: false
      required: [url]
      description: |
        Record where an article came from (typically on import). Private: never shown on the public
        blog. With `content` (the source page's text) Writavo measures originality itself and
        re-measures whenever the article body changes through the API; without it,
        `originality_pct` is kept as `reported`. The page is matched to a competitor on the Site by
        `competitor` or the URL's host. Send `source: null` to detach.
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        title: { type: [string, "null"], maxLength: 500 }
        competitor: { type: [string, "null"], maxLength: 253, description: The competitor's domain. }
        content: { type: [string, "null"], maxLength: 80000, description: The source page's text. }
        originality_pct: { type: [number, "null"], minimum: 0, maximum: 100, description: A figure from the old system, kept as reported. }
        target_keywords: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
        metrics:
          type: object
          additionalProperties: false
          properties:
            seo_score: { type: [number, "null"], minimum: 0 }
            organic_traffic: { type: [number, "null"], minimum: 0 }
            backlinks: { type: [number, "null"], minimum: 0 }
            referring_domains: { type: [number, "null"], minimum: 0 }
            ranking_keywords: { type: [number, "null"], minimum: 0 }
            top10_keywords: { type: [number, "null"], minimum: 0 }

    ArticleCreate:
      type: object
      additionalProperties: false
      description: |
        Every field is optional. The article is created at `status: draft` regardless of what you
        send. `status`, `published_at` and `scheduled_publish_at` are not accepted: naming any of
        them is `422 VALIDATION_FAILED`, so a client that assumed it could create published
        content fails loudly rather than leaving a post silently offline.
      properties:
        article_kind:
          type: string
          enum: [article, page]
          description: '`page` makes it a page (About, Contact) rather than a post. Defaults to `article` on create. `news` is set only by a news recipe.'
        title: { type: [string, "null"], maxLength: 300 }
        slug:
          type: [string, "null"]
          maxLength: 200
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Derived from `title` when omitted. Supply it if the URL matters.
        external_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
          pattern: "^[!-~]+$"
          description: Your id for this article in the system it came from. Unique within the Site.
        content: { type: [string, "null"], description: 'Markdown. Embed a YouTube, Vimeo or X post with a line of its own, `::embed{url="https://..."}`.' }
        excerpt: { type: [string, "null"], maxLength: 1000 }
        featured_image_url: { type: [string, "null"], format: uri }
        featured_image_alt:
          type: [string, "null"]
          maxLength: 500
          description: Alt text for `featured_image_url`. Blank is stored as null, and your blog then uses the title.
        seo_title: { type: [string, "null"], maxLength: 200 }
        seo_description: { type: [string, "null"], maxLength: 400 }
        seo_keywords: { type: [array, "null"], items: { type: string } }
        faqs: { type: [array, "null"], items: { type: object } }
        key_takeaways: { type: [array, "null"], items: { type: string } }
        howto_steps:
          type: [object, array, "null"]
          description: '`{ name?, description?, steps: [{ name, text?, image_url? }] }`, or a bare array of steps. Stored as the object.'
        comparison:
          type: [object, "null"]
          description: '`{ title?, headers: [string], rows: [[string]] }`.'
        source:
          description: Private provenance for this article. See `ArticleSourceWrite`.
          oneOf:
            - $ref: '#/components/schemas/ArticleSourceWrite'
            - type: "null"
        category_id:
          type: [string, "null"]
          format: uuid
          description: |
            The PRIMARY category. Sent alone it files the article under that category too; an
            article that was in only its old primary category is moved, one in several keeps them.
        category_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
          description: |
            Every category the article is filed under: a full replacement, not a merge (send `[]` to
            clear). With `category_id` too, the primary is put first if missing; without it the
            current primary stays when listed, otherwise the first becomes primary.
        author_id: { type: [string, "null"], format: uuid }
        format_id: { type: [string, "null"], format: uuid }
        tag_ids: { type: array, items: { type: string, format: uuid } }
        original_published_at:
          type: [string, "null"]
          format: date-time
          description: |
            The date this article was originally published in the system you are importing it
            from. Must be in the past and on or after 1990-01-01. Used as `published_at` on the
            article's first publish from any path (dashboard, API, MCP, schedule or pipeline), so
            you can import as a draft and publish later without the post being dated today. No
            effect on an article that has already been published.
        original_content_updated_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the imported article's content last changed at its source. Must be in the past,
            needs `original_published_at`, and may not be earlier than it. Becomes the article's
            `content_updated_at` (its sitemap `lastmod`) until it is edited in Writavo.
        canonical_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: |
            The canonical URL override, an absolute http(s) URL. Set it when this article's
            primary copy lives at another address (a syndicated post). Blank or `null` means the
            article's own URL. An article whose canonical points anywhere else is left out of
            your sitemap.
        noindex:
          type: boolean
          description: |
            `true` asks search engines not to index the page (`robots: noindex`) and leaves it out
            of your sitemap. The page stays reachable, listed on your blog and in your RSS feed.
        og_title:
          type: [string, "null"]
          maxLength: 200
          description: The social-share title (`og:title`). Null means `seo_title`, then `title`.
        og_description:
          type: [string, "null"]
          maxLength: 400
          description: The social-share description. Null means `seo_description`, then `excerpt`.
        og_image_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: The social-share image, an absolute http(s) URL. Null means `featured_image_url`.
        og_image_alt:
          type: [string, "null"]
          maxLength: 500
          description: Alt text for `og_image_url`. Null means `featured_image_alt`, then the title.
        custom_fields:
          type: [object, "null"]
          additionalProperties: true
          description: |
            The values of the Site's custom article fields, keyed by field API id, sent WHOLE (what you
            send replaces what is stored; null clears them). Each value is checked against
            `GET /content-types/article`; a bad one is `422` with `error.fields` naming it
            (`custom_fields.rating`).

    ArticleUpdate:
      type: object
      additionalProperties: false
      description: |
        A partial update. Omitted fields are left alone; `null` clears a nullable field.
        `status`, `published_at` and `scheduled_publish_at` are rejected with
        `422 VALIDATION_FAILED`.
      properties:
        article_kind:
          type: string
          enum: [article, page]
          description: '`page` makes it a page (About, Contact) rather than a post. Defaults to `article` on create. `news` is set only by a news recipe.'
        title: { type: [string, "null"], maxLength: 300 }
        slug:
          type: [string, "null"]
          maxLength: 200
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: |
            Changing the slug of a published article changes its live URL. The old URL keeps
            working: a 301 redirect to the article is added automatically (`origin:
            slug_change` in `GET /redirects`), and it follows any later slug change too.
        external_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
          pattern: "^[!-~]+$"
          description: Your id for this article in the system it came from. `null` clears it.
        content: { type: [string, "null"], description: 'Markdown. Embed a YouTube, Vimeo or X post with a line of its own, `::embed{url="https://..."}`.' }
        excerpt: { type: [string, "null"], maxLength: 1000 }
        featured_image_url:
          type: [string, "null"]
          format: uri
          description: '`null` removes the featured image, and its `featured_image_alt` with it unless this request also sends one.'
        featured_image_alt:
          type: [string, "null"]
          maxLength: 500
          description: Alt text for `featured_image_url`. Blank or `null` clears it, and your blog then uses the title.
        seo_title: { type: [string, "null"], maxLength: 200 }
        seo_description: { type: [string, "null"], maxLength: 400 }
        seo_keywords: { type: [array, "null"], items: { type: string } }
        faqs: { type: [array, "null"], items: { type: object } }
        key_takeaways: { type: [array, "null"], items: { type: string } }
        howto_steps:
          type: [object, array, "null"]
          description: '`{ name?, description?, steps: [{ name, text?, image_url? }] }`, or a bare array of steps. Stored as the object.'
        comparison:
          type: [object, "null"]
          description: '`{ title?, headers: [string], rows: [[string]] }`.'
        source:
          description: Private provenance for this article. See `ArticleSourceWrite`.
          oneOf:
