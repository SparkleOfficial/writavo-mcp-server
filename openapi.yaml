  /billing/credit-packs/{key}/buy-with-balance:
    parameters:
      - $ref: "#/components/parameters/CreditPackKey"
    post:
      operationId: buyCreditPackWithBalance
      tags: [Billing]
      summary: Buy a credit pack with the account balance
      description: |
        Buys one credit pack at its catalogue price (`usd_price` from `GET /billing/credit-packs`) out of
        the organisation's USD account balance, and adds its credits at once. No card is charged and no
        Stripe page is involved. Read the balance first with `GET /billing` (`credits.usd_balance`).

        Not all of the balance can always buy credits. Money added with `startWalletTopup` can take up
        to 72 hours to clear before it can buy credits, and CMS pay-as-you-go usage already owed is paid
        from the balance first. When what is usable is less than the price, the answer is
        `409 CONFLICT` with the usable figure in the message: add funds, wait for them to clear, pick a
        smaller pack, or buy the pack by card with `startCreditPurchase`. A balance on hold is also
        `409 CONFLICT` (the person contacts Writavo support). An unknown or inactive pack is `404`.

        **When an AI agent asks.** A key from a device or OAuth sign-in, or any request from an MCP
        client, always gets `428 APPROVAL_REQUIRED` on the first try, whatever the organisation's
        approvals switch says, because it spends money or credits. Give the person
        `error.approval.url`; once they approve, repeat the identical request (same `Idempotency-Key`)
        with `Writavo-Approval: <error.approval.id>`. The approval is void if what the request would do
        changes before the retry, for example the pack is repriced. A key made in the dashboard is asked
        only when the request comes from an MCP client.
      x-scope: billing:write
      x-permission: billing.manage
      x-entitlement: none
      x-spends-credits: false
      x-spends-money: true
      x-rate-limit-class: write
      x-publishable: false
      x-writavo-approval: billing.wallet_buy
      x-writavo-approval-kind: money
      x-writavo-approval-always: true
      x-agent-consequence: The pack's price is taken from the organisation's account balance and its credits are added straight away. It cannot be undone from the API.
      x-mcp-surface: action
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "#/components/parameters/WritavoApproval" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyBody" }
      responses:
        "200":
          description: The pack was bought.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/BalancePurchase" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/ApprovalRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /billing/wallet/checkout:
    post:
      operationId: startWalletTopup
      tags: [Billing]
      summary: Start adding funds to the account balance
      description: |
        Returns a Stripe Checkout link that adds `amount_usd` US dollars to the organisation's account
        balance. Nothing is charged by this call and no funds are added by it: the person opens the link
        in their browser and pays by card on Stripe's page, and the money arrives in the balance only
        when that payment completes. That page is where they consent, so no approval is asked. Give
        them `checkout_url` exactly as returned; it is shown once and expires after 30 minutes. Card
        details never pass through the API or an assistant, and the card is not saved.

        Limits: $10 to $2,000 per top-up (to the cent), $2,000 added in any 24 hours, a balance of at
        most $10,000, and $200 in total during a new account's first week. Going past one is
        `409 CONFLICT` saying which, and how much can still be added; an amount outside $10 to $2,000 is
        `422`; too many attempts in an hour is `429`. The person who created the key must have confirmed
        their email address, or it is `403 FORBIDDEN`. A balance on hold is `409 CONFLICT`.

        What the balance is for: it pays CMS pay-as-you-go usage (going past an included CMS allowance)
        first, and once the money has cleared (up to 72 hours after the payment) it can buy credit
        packs with `buyCreditPackWithBalance`. The balance never expires. Unspent balance is refunded
        only through Writavo support, to the original card; the API cannot refund it.
      x-scope: billing:write
      x-permission: billing.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-mcp-surface: action
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletTopupRequest" }
      responses:
        "200":
          description: The checkout link.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WalletCheckout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /billing/activity:
    get:
      operationId: listBillingActivity
      tags: [Billing]
      summary: List balance and credit activity
      description: |
        Every movement of the organisation's two balances, newest first: credits (`unit: credit`) and
        the USD account balance (`unit: usd`). Each row says which way it went (`flow`), where it came
        from (`source`), how it was paid (`method`), a label a person can read, and the balance after
        it. Filter with `unit` and `flow`. Page back with `before` set to the previous page's
        `next_cursor`; `next_cursor` is null on the last page.

        Buying a pack with the balance writes two rows, a USD one out and a credit one in, and each
        carries the other's `id` in `linked_id`. For invoices and card payments use `listInvoices`.
      x-scope: billing:read
      x-permission: billing.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      x-mcp-surface: action
      parameters:
        - name: unit
          in: query
          required: false
          schema: {type: string, enum: [credit, usd]}
          description: Only credit rows, or only USD balance rows. Both when left out.
        - name: flow
          in: query
          required: false
          schema: {type: string, enum: [in, out]}
          description: Only what came in, or only what went out. Both when left out.
        - name: before
          in: query
          required: false
          schema: {type: string, pattern: '^[1-9][0-9]{0,15}$'}
          description: The `next_cursor` from the previous page.
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
          description: Rows per page.
      responses:
        "200":
          description: A page of activity.
