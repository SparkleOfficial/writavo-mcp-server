  # ==========================================================================
  # ARTICLES
  # ==========================================================================
  /articles:
    get:
      operationId: listArticles
      tags: [Articles]
      summary: List and search articles
      description: |
        Cursor paginated, newest updated first.

        **Search with `q`.** `GET /articles?q=meeting notes` matches the words in the title,
        excerpt and body (with stemming, `"exact phrase"` and `-excluded`), or a part of the title.
        It is a filter, so it combines with `status`, `category_id`, `tag_id`, `author_id` and
        pagination, and a headless site can search its blog without downloading every summary.

        The default projection deliberately omits `content`. Article bodies are large, and a
        list endpoint that returns every body is the classic way to make a content API slow and
        expensive. Fetch bodies one at a time with `GET /articles/{id}`, or ask for them
        explicitly with `fields=id,title,content` and a small `limit`.

        There is no way to ask for every field. `fields` is an allow list, not a wildcard.

        A publishable key (`wv_pub_`) sees only articles at `status: published`. A secret key
        sees everything, including drafts.
      x-scope: articles:read
      x-permission: articles.read
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: true
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: fields
          in: query
          description: |
            Comma separated field allow list. Any field of the Article schema may be named.
            Omit for the default projection, which is:
            `id, status, article_kind, title, slug, excerpt, featured_image_url, featured_image_alt,
            category_id, author_id, format_id, published_at, scheduled_publish_at, created_at, updated_at`.
            `id` is always returned whether or not you name it.
          required: false
          schema:
            type: string
            example: id,title,slug,status,published_at
        - name: status
          in: query
          description: |
            Filter by status. Repeat the parameter to match several. A publishable key may only
            ask for `published`, and any other value is rejected with `403 INSUFFICIENT_SCOPE`.
          required: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/ArticleStatus" }
          style: form
          explode: true
        - name: article_kind
          in: query
          required: false
          description: '`page` lists the pages (About, Contact); `article` the posts (news stories included); `news` only news stories.'
          schema: { type: string, enum: [article, news, page] }
        - name: category_id
          in: query
          required: false
          description: Articles filed under this category, as their primary category or one of several.
          schema: { type: string, format: uuid }
        - name: author_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: tag_id
          in: query
          description: |
            Return only articles carrying this tag. Repeat the parameter (or separate ids with
            commas) to match articles carrying ANY of the tags, at most 20. An article carrying
            several of them is still returned once.
          required: false
          schema:
            type: array
            maxItems: 20
            items: { type: string, format: uuid }
          style: form
          explode: true
        - name: q
          in: query
          description: |
            Text search. Matches the words in the title, excerpt and body (English stemming, so
            `transcribing` finds `transcription`; web search syntax, so `"exact phrase"` and
            `-excluded` work), or a substring of the title, for the partial word a stemmer cannot
            match. It is a filter, not a ranking: results keep the `order` sort, so cursor
            pagination stays exact. It combines with every other filter, including `status`, so a
            secret key can search drafts; a publishable key only ever searches published articles.
            For ranked, best match first search of published posts, use the blog's
            `/api/v1/search`.
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
          example: podcast transcription
        - name: slug
          in: query
          description: Exact slug match. Slugs are unique within a Site, so this returns at most one article.
          required: false
          schema: { type: string }
        - name: external_id
          in: query
          description: |
            Exact `external_id` match. Unique within a Site, so this returns at most one article.
            An importer calls this before writing, to update an article it brought in on an
            earlier run rather than create a second copy.
          required: false
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: updated_since
          in: query
          description: |
            Return only articles updated at or after this instant. This is the incremental sync
            parameter: store the greatest `updated_at` you have seen and pass it back next time.
          required: false
          schema: { type: string, format: date-time }
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [updated_at.desc, updated_at.asc, published_at.desc, published_at.asc, created_at.desc]
            default: updated_at.desc
      responses:
        "200":
          description: A page of articles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      operationId: createArticle
      tags: [Articles]
      summary: Create an article
      description: |
        Creates an article at `status: draft`. Always. There is no request field that can make
        it public, and supplying `status` is a validation error rather than a silent ignore, so
        a client written against a different CMS fails loudly instead of quietly leaving content
        unpublished.

        Nothing here is required. An empty body creates an untitled, unslugged draft you can
        fill in later. `title`, `slug` and `content` do become required at publish time, and
        `POST /articles/{id}/publish` returns `422` with a field level breakdown if any is
        missing.

        If you supply a `title` and no `slug`, a slug is derived from the title. Supply `slug`
        explicitly if the URL matters to you, because a derived slug is not guaranteed stable
        across versions.
      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleCreate" }
            examples:
              minimal:
                summary: An empty draft to fill in later
                value: {}
              typical:
                summary: A complete draft, ready to publish
                value:
                  title: How to choose a headless CMS
                  slug: how-to-choose-a-headless-cms
                  content: "## Start with your delivery model\n\nThe first question is not which CMS..."
                  excerpt: A practical framework for picking a headless CMS without regretting it.
                  seo_title: How to choose a headless CMS (2026 guide)
                  seo_description: A practical framework for picking a headless CMS.
                  seo_keywords: [headless cms, content api, jamstack]
                  category_id: 0f5f1f4e-9c2a-4f7b-9a11-3b5c9d8e7a01
                  author_id: 6a1c8b22-0d4e-4a9f-8c33-77e2f1a4b5c6
                  tag_ids: [9d3e2c11-5b6a-4d8e-9f01-2a3b4c5d6e7f]
      responses:
        "201":
          description: The draft was created.
          headers:
            Location:
              description: The canonical URL of the new article.
              schema: { type: string }
            ETag:
              description: The concurrency token. Pass it as `If-Match` on your first PATCH.
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /articles/{id}:
    parameters:
      - $ref: "#/components/parameters/ArticleId"
    get:
      operationId: getArticle
      tags: [Articles]
      summary: Read one article
      description: |
        Returns the full article including `content`. A publishable key may only read an article
        at `status: published`; anything else returns 404, for the same no disclosure reason that
        governs cross Site access.
      x-scope: articles:read
      x-permission: articles.read
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: true
      x-cross-tenant: 404
      parameters:
        - name: fields
          in: query
          description: Comma separated field allow list. Omit to receive every readable field.
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The article.
          headers:
            ETag:
              description: The concurrency token for this version of the row.
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Article" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      operationId: updateArticle
      tags: [Articles]
      summary: Update an article
      description: |
        A partial update. Only the fields you send are touched. Send `null` to clear a nullable
        field; omit it to leave it alone.

        `status` is not updatable here. Use the lifecycle endpoints. Sending `status` returns
        `422 VALIDATION_FAILED`, which is what stops an API client from pushing an article into
        the generation engine.

        You may edit a published article. The edit goes live on your blog as soon as the CDN
        cache for that post is purged, which happens as part of this request.

        **Send `If-Match`.** Pass the `ETag` you received from your last read. If someone else
        changed the article since then you get `412 PRECONDITION_FAILED` instead of silently
        overwriting their work. `If-Match` is optional in v1 for compatibility, and omitting it
        means last write wins, which is almost never what you want on shared content.

        **A PATCH that changes nothing writes nothing.** When every field you send already
        matches what is stored, the article is left exactly as it is: no new revision, no
        `updated_at` change, no `article.updated` webhook and no cache purge. The response is
        the stored article with `Writavo-Unchanged: true`, so a sync or an import re-run can
        send whole articles without turning each one into an edit.
      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleUpdate" }
      responses:
        "200":
          description: The updated article (or, with `Writavo-Unchanged`, the stored one).
          headers:
            ETag:
              description: The new concurrency token.
              schema: { type: string }
            Writavo-Unchanged:
              description: Present, as `true`, when the request matched the stored article and nothing was written.
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      operationId: deleteArticle
      tags: [Articles]
      summary: Delete an article
      description: |
        **Deleting several?** Use `bulkDeleteArticles` (POST .../bulk-delete): up to 100 articles in one
        call, and an AI agent needs ONE approval for the whole list instead of one per item.

        Permanent. The row, its tag assignments and the redirects that point at it are removed,
        and if the article was published its URL starts returning 404 on your blog once the cache
        is purged.

        There is no trash and no undo in v1. If you only want to take a post off the web, use
        `POST /articles/{id}/unpublish`, which keeps everything and is reversible.

        Deleting an article that does not exist returns 404 rather than succeeding, so a
        double delete is visible to you rather than silent.

        **When an AI agent asks.** A key approved for an AI assistant (a device or OAuth sign-in),
        or any request from an MCP client, gets `428 APPROVAL_REQUIRED` on the first try while the
        organisation requires approvals, with `error.approval.url` for a person to approve or deny
        in the dashboard. Retry the same request with `Writavo-Approval: <error.approval.id>` once
        they have. Other callers are unaffected.
      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-writavo-approval: article.delete
      x-writavo-approval-kind: destructive
      x-agent-consequence: Permanently deletes the article; a published one disappears from the live blog.
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/WritavoApproval"
      responses:
        "204":
          description: Deleted. No body.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/ApprovalRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /articles/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/ArticleId"
    post:
      operationId: publishArticle
      tags: [Articles]
      summary: Publish an article
      description: |
        Makes the article public immediately, at `status: published`.

        Requires a non empty `title`, `slug` and `content`. If any is missing you get
        `422 VALIDATION_FAILED` with a `fields` map naming each one, so you can point a user at
        the exact problem rather than showing a generic failure.

        `published_at` is set to now only if it was not already set. It records when the article
        was **first** made public and is the ordering key for your blog, so republishing after an
        unpublish does not move the post to the top of the feed. If the article carries a recorded
        `original_published_at` (set on create or update, typically by an import), its first
        publish uses that date instead of now, and this is true of every way an article goes live.

        **Importing an article that was already public somewhere else?** Send its original
        `published_at` in the body, and optionally `content_updated_at`. Both must be in the past
        (and on or after 1990-01-01), and `content_updated_at` may not be earlier than
        `published_at`. They are honoured on the article's **first** publish only: once an article
        has a `published_at`, sending a different one is `422 VALIDATION_FAILED`, and sending the
        same one is accepted so a retried import stays a no-op. A future date is refused; use
        `/schedule` to go live later. Dates sent here win over the recorded
        `original_published_at` / `original_content_updated_at` and replace them.

        Publishing clears any pending schedule.

        This is free. It makes no external call, so it passes no entitlement check, spends no
        credits and is unaffected by your spend cap. An editor who is not allowed to run the AI
        pipeline can still publish their own writing.

        Safe to repeat: publishing an already published article is a no-op that returns the
        current state.
      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      x-makes-public: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                published_at:
                  type: string
                  format: date-time
                  description: |
                    The date the article was ORIGINALLY published, for an article imported from
                    another system. First publish only; must be in the past. Omit it to publish
                    now.
                content_updated_at:
                  type: string
                  format: date-time
                  description: |
                    When the imported article's content last changed at its source. First publish
                    only; must be in the past and not earlier than `published_at`.
      responses:
        "200":
          description: The article is public.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ArticleLifecycleState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /articles/{id}/revisions:
    parameters:
      - $ref: "#/components/parameters/ArticleId"
    get:
      operationId: listArticleRevisions
      tags: [Articles]
      summary: List an article's revisions
      description: |
        Every saved version of the article, newest first: each change a reader would see, from the
        dashboard, this API, the AI pipeline or an import, with who made it (`actor_user_id`, and
        `actor_api_key_id` for a key) and from where (`source`). The first edit of an article made
        before revisions existed keeps its original as `baseline`. Autosaves are kept 30 days,
        pipeline revisions 180; an article keeps at most 300.
      x-scope: articles:read
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of revisions (without their bodies).
          content:
