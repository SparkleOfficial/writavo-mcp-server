      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-writavo-approval: domain.connect
      x-writavo-approval-kind: live
      x-writavo-approval-always: true
      x-agent-consequence: Points <domain>/blog at this Site; only approve if you control the domain.
      x-mcp-surface: action
      parameters:
