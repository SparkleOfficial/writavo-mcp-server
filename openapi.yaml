  /seo/rank-check:
    post:
      operationId: runRankCheck
      tags: [SEO]
      summary: Check keyword positions now
      description: |
        Check the Google position of every active tracked keyword now, rather than at the weekly (daily
        for priority keywords) check.

        It spends no credits, but it costs Writavo a vendor fee per keyword, so it is treated as spending money. It runs in the background: the response is `202` with `queued: true` and
        `estimated_credits`, and `check` names the operation that shows the result a few minutes later
        (`listTrackedKeywords`). A second request of the same kind within 10 minutes is `409 CONFLICT`. That guard is per
        scan kind ("A rank check scan is already running."), and every page of a detail pull counts.

        While the organisation's plan has no daily spend cap configured, spending is paused and this is
        `409 FEATURE_UNAVAILABLE` ("Spending is paused: this plan has no daily spend cap configured...");
        nothing on the caller's side fixes it, so report it rather than retry.

        Checked in this order, each answered before anything is spent: the plan
        (`402 NOT_ENTITLED`), at least one active tracked keyword (`POST /seo/keywords`) (`409 PREREQUISITE_MISSING`, naming the operation that sets it
        up), credits (`402 INSUFFICIENT_CREDITS`) and the Site's spend cap (`402 SPEND_CAP_REACHED`).

        **When an AI agent asks.** A key from a device or OAuth sign-in, or any request from an MCP
        client, always gets `428 APPROVAL_REQUIRED` on the first try, whatever the organisation's
        approvals switch says, because it spends money or credits. Give the person `error.approval.url`;
        once they approve, repeat the identical request with `Writavo-Approval: <error.approval.id>`.
        The approval is void if what the request would do changes before the retry. A key made in the
        dashboard is asked only when the request comes from an MCP client.
      x-scope: seo:write
      x-permission: seo.manage
      x-entitlement: seo.keyword_tracking
      x-spends-credits: false
      x-spends-money: true
      x-rate-limit-class: pipeline
      x-publishable: false
      x-writavo-approval: seo.scan
      x-writavo-approval-kind: money
      x-writavo-approval-always: true
      x-agent-consequence: Runs a rank check scan that costs Writavo no credits, but it costs Writavo a vendor fee per keyword, so it is treated as spending money.
      x-mcp-surface: action
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "#/components/parameters/WritavoApproval" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyBody" }
      responses:
        "202":
          description: The scan is queued.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ScanQueued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/ApprovalRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /seo/import:
    post:
      operationId: importSeo
      tags: [SEO]
      summary: Import keywords, competitors and ranking history
      description: |
        Bring a Site's SEO data to Writavo when it migrates from another tool: the keywords it
        tracks, its competitors, and each keyword's ranking history. Free: nothing is charged and no
        rank check runs; the history is the data you send.

        **Keywords** are matched on the Site ignoring case, after the same clean-up as
        `POST /seo/keywords` (trimmed, runs of spaces made one). A keyword already tracked is updated:
        each field you send replaces that field, and a paused keyword stays paused. A new keyword is
        tracked, with the Site's locale for location and language unless the row names them.

        **The plan's keyword limit holds.** The organisation tracks at most N keywords across its
        Sites. New keywords past the room left are skipped, in the order sent, each listed in
        `problems` ("over the tracked-keyword limit ..."), and the rest of the call is still written.
        `tracked_keywords` reports the limit and how many were tracked before the call.

        **Competitors** are matched by domain after the same clean-up as `POST /seo/competitors`
        (`https://www.rival.com/blog` is `rival.com`). One already there is updated (`name`,
        `blog_url`). At most 25 active competitors per Site; the Site's own domain is refused.

        **Positions** are keyed by keyword and UTC day and SET: a row replaces what an earlier import
        stored for that keyword and day, so importing the same history twice never duplicates it.
        `position` is required and is null when the keyword did not rank; an average (as Search
        Console exports it) is rounded. A position names a keyword tracked on the Site or added by
        `keywords` in the same call; any finished day from 2000-01-01 to yesterday (UTC). Imported history shows in
        `GET /seo/keywords/{id}/history` and the dashboard's charts with `source: import`, is never
        pruned, and sits beside Writavo's own checks without replacing them. A keyword's latest
        position follows the newest imported day when that is newer than its last check.

        **Dry run first.** `dry_run` defaults to true: every row is checked and matched, `plan`,
        `tracked_keywords` and `problems` are reported, and nothing is written. Send `dry_run: false`
        to write. A row with a problem is skipped and listed; the valid rows are still written. Each
        applied import is recorded in the audit log with its counts.
      x-scope: seo:write
      x-permission: seo.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-mcp-surface: action
      x-agent-consequence: Tracks the keywords and adds the competitors sent, and sets their ranking history for the days sent, replacing what an earlier import stored for those days.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeoImportInput" }
            examples:
              dry_run:
                summary: Check two keywords, a competitor and three days of history, write nothing
                value:
                  keywords:
                    - keyword: best crm for startups
                      target_url: https://example.com/blog/best-crm
                    - keyword: crm pricing
                      is_priority: true
                  competitors:
                    - domain: rival.com
                      name: Rival
                  positions:
                    - { keyword: best crm for startups, day: "2026-05-10", position: 8, url: "https://example.com/blog/best-crm" }
                    - { keyword: best crm for startups, day: "2026-05-17", position: 6 }
                    - { keyword: crm pricing, day: "2026-05-17", position: null }
      responses:
        "200":
          description: The report. With `dry_run` it describes what would be written.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SeoImportResult" }
              examples:
                applied:
                  summary: Written, one keyword over the plan's limit
                  value:
                    ok: true
                    data:
                      dry_run: false
                      written: { keywords_created: 1, keywords_updated: 0, competitors_created: 1, competitors_updated: 0, positions: 2 }
                      plan: { keywords_new: 2, keywords_existing: 0, competitors_new: 1, competitors_existing: 0, positions: 3, keywords_with_positions: 2 }
                      tracked_keywords: { limit: 100, active: 99 }
                      problems:
                        - section: keywords
                          index: 1
                          error: "over the tracked-keyword limit: your plan tracks up to 100 keywords across the organisation, so this one was not added"
                        - section: positions
                          index: 2
                          error: its keyword was not added (see that row under keywords), so there is nothing to attach it to
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

