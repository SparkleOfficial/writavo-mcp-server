  /seo/links:
    get:
      operationId: listArticleLinks
      tags: [SEO]
      summary: List every internal and external link in your articles, with its state and nofollow
      description: |
        Every link in the published articles, one row each: the article it is in, its anchor text,
        where it points, and its state. Internal and external links both. Read from the article
        bodies within minutes of a publish, an edit or an import; nothing is entered.

        `status` for an internal link: `ok` (the target article is published), `unpublished` (it
        exists but is not live now), `missing` (no such article), `page` (another page of the Site
        that is not an article). For an external link: `ok`, `unreachable` (it answered 404 or 410)
        or `unchecked` (external links are checked in batches).

        `follow` is what the link renders as, on the hosted blog and in `content_html` alike:
        `followed`, `nofollow`, `sponsored` or `ugc`. `follow_source` says why: `link` (set on this
        link, see `setArticleLinkRel`), `own_site` (a link to the Site's own pages is followed) or
        `site_default` (the Site's `external_link_rel`, returned here as `external_link_default`).
        A front end that renders the Markdown `content` itself, rather than `content_html`, decides
        for itself.

        Filter with `type`, `state` (`broken` is `unpublished`, `missing` and `unreachable`
        together), `article_id` (links in one article), `target_article_id` (links into one article),
        `domain` (links to one site) or `q` (anchor, URL or title). `counts` is always the whole Site.
        For the problems grouped and explained, use `getInternalLinkReport`.
      x-scope: seo:read
      x-permission: seo.view
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      x-mcp-surface: action
      parameters:
        - name: type
          in: query
          required: false
          schema: {type: string, enum: [internal, external]}
        - name: state
          in: query
          required: false
          description: "`nofollow` is every link that is not followed: nofollow, sponsored and ugc."
          schema: {type: string, enum: [ok, broken, unchecked, nofollow]}
        - name: article_id
          in: query
          required: false
          description: Only the links in this article.
          schema: {type: string, format: uuid}
        - name: target_article_id
          in: query
          required: false
          description: Only the links that point at this article.
          schema: {type: string, format: uuid}
        - name: domain
          in: query
          required: false
          description: Only the links to this site and its subdomains.
          schema: {type: string, maxLength: 253}
        - name: q
          in: query
          required: false
          description: Text to find in the anchor, the URL or an article title.
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: The links, by article.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ArticleLinks" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

