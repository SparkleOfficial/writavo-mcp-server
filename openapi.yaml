        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomDomainConnect" }
      responses:
        "201":
          description: The domain and the DNS record to add.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CustomDomainConnected" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/ApprovalRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      operationId: removeCustomDomain
      tags: [Delivery]
      summary: Remove the custom domain
      description: |
        Stop serving the blog at the custom domain and release it. The blog stays available at every
        other delivery route. `404` when the Site has no custom domain.

        **When an AI agent asks.** A key from a device or OAuth sign-in, or any request from an MCP
        client, always gets `428 APPROVAL_REQUIRED` on the first try, whatever the organisation's
        approvals switch says, because it changes what the public sees on the live site. Give the person
        `error.approval.url`; once they approve, repeat the identical request with `Writavo-Approval:
        <error.approval.id>`. The approval is void if what the request would do changes before the
        retry. A key made in the dashboard is asked only when the request comes from an MCP client.
      x-scope: delivery:write
      x-permission: delivery.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-writavo-approval: domain.remove
      x-writavo-approval-kind: live
      x-writavo-approval-always: true
      x-agent-consequence: The blog stops being served at the custom domain.
