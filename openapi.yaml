      tags: [SEO]
      summary: Record a link exchange
      description: |
        Record a link swap (a backlink exchange) with another site. Say who it is with: `partner_domain`, or just
        `their_page_url` (the page of theirs that links, or will link, to you), from which the domain
        is taken. Everything else is optional narrowing. Free.

        Nothing about either link is entered. If `their_page_url` is given the page is read at once,
        and the answer already says whether their link is there and whether it is followed. Your side
        is found in your published articles: add the link to an article with `updateArticle` and the
        exchange shows it within a few minutes.

        Use `inspectLinkProspect` first to look at a site before agreeing to anything.
