  /export:
    get:
      operationId: exportSite
      tags: [Imports]
      summary: Export the Site
      description: |
        The whole Site as Writavo Import Format, so it can be backed up, restored or moved to
        another Site: articles and pages (with their SEO fields, source records, old URLs and custom
        fields), authors, categories, tags, content types, entries, redirects and engagement history.
        Media travels as URLs; importing copies each into the target Site's library. References
        between entries and articles are written portably (`$ref` by external_id or slug, `$media`
        by URL), so they resolve on the target Site.

        **Volumes.** An import document is at most 10 MB, so the export comes in volumes of about
        8 MB, each a complete document. When there is more, the response carries
        `Writavo-Export-Next` (also `source.export.next` in the document): pass it back as
        `cursor` for the next volume. Import the volumes in order with `POST /imports`; a volume
        whose report lists references it could not resolve yet (they were in a later volume) is
        fixed by importing it again at the end.

        Left out: the AI pipeline's working rows, revisions, Writavo's own costs, and the source
        pages' scraped text unless `source_text=true` (it can be several times the size of the
        articles). The body is the document itself, not the usual `{ ok, data }` envelope.
      x-scope: articles:read
      x-also-scopes: [taxonomy:read, authors:read, entries:read]
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      parameters:
        - name: cursor
          in: query
          required: false
          description: The `Writavo-Export-Next` of the previous volume. Omit for the first.
          schema: { type: string }
        - name: engagement
          in: query
          required: false
          description: Include the engagement history (views, reactions, shares). Default true.
          schema: { type: boolean, default: true }
        - name: source_text
          in: query
          required: false
          description: Include each source page's scraped text (large). Default false.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: One volume of the export, a Writavo Import Format document.
          headers:
            Writavo-Export-Part:
              description: Which volume this is, from 1.
              schema: { type: integer }
            Writavo-Export-Next:
              description: The cursor of the next volume. Absent on the last.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                description: "Writavo Import Format v1 (https://writavo.com/schemas/import-v1.json)."
                additionalProperties: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ==========================================================================
  # SITE SETTINGS (MCP-3)
  # ==========================================================================
  /site/settings:
    get:
      operationId: getSiteSettings
      tags: [Site settings]
      summary: Read the Site settings
      description: |
        The Site's editable settings: name, primary domain, locale, niche and timezone, plus its status
        and the live base URL of its blog. Read this before changing anything, and before a paid SEO scan:
        most scans need `primary_domain`.

        `status` is read only. A `suspended` Site was suspended by Writavo; a `paused` one by the
        organisation. Neither can be changed through the API.
      x-scope: site:read
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      x-mcp-surface: action
      responses:
        "200":
          description: The Site settings.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SiteSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      operationId: updateSiteSettings
      tags: [Site settings]
      summary: Change the Site settings
      description: |
        A partial update of the Site's name, primary domain, locale, niche, timezone, or whether links
        to other sites are dofollow or nofollow by default (`external_link_rel`). Send at least one
        field; omitted fields are left alone, and `null` clears `primary_domain` or `niche`.

        `primary_domain` is a bare hostname such as `example.com` (a scheme, path or port is stripped,
        and anything that is not a valid public hostname is `422` on `primary_domain`). It is the domain
        the SEO suite measures and the default for new tracked keywords; it does not change where the
        blog is served, which is `POST /delivery/proxy` or `POST /delivery/custom-domain`.

        `status`, the organisation and the creator are not settable: naming any of them is `422`.
        Changing the locale or niche affects articles written from now on, not ones already written.
      x-scope: site:write
      x-permission: website.settings
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-mcp-surface: action
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteSettingsUpdate" }
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SiteSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /site/knowledge-profile:
    get:
      operationId: getKnowledgeProfile
      tags: [Site settings]
      summary: Read the knowledge profile
      description: |
        What the AI knows about the business it writes for: the brand voice, the product description and
        the target audience, plus the AI writing profile: the product knowledge the writer may cite, the
        niche keywords that gate which competitor articles get written, and `prompt_vars`, the Site's
        values for the brand phrases in the platform writing prompts. Every generated article is written
        from this, so it is the single most effective thing to get right before turning the pipeline on.

