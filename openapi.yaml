        author_id: { type: [string, "null"], format: uuid }
        format_id: { type: [string, "null"], format: uuid }
        tag_ids:
          type: array
          items: { type: string, format: uuid }
          description: Full replacement, not a merge. Send `[]` to clear.
        original_published_at:
          type: [string, "null"]
          format: date-time
          description: |
