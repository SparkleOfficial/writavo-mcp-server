        "500": { $ref: "#/components/responses/InternalError" }

  /analytics/visitors:
    get:
      operationId: getVisitorAnalytics
      tags: [Analytics]
      summary: Read the visitor report
      description: |
        Visitors, pageviews, bounces and engaged time for a range of UTC days, with the previous range
        of the same length for comparison, one row per day (`daily`, every day of the range, zeros
        included) and the top 50 values of each breakdown: pages, entry pages, sources, referrers, UTM
        source, medium and campaign, country, region, city, device, browser and operating system.

        Default range: the last 30 days (`to` today, `from` 29 days before). At most 400 days. Numbers
        are rolled up from the raw events every 15 minutes, so a visit shows here up to 15 minutes
        after it happens; `GET /analytics/setup` shows raw arrivals at once. A visitor is counted once
        per day per Site from a daily-salted hash; no cookies are used.
      x-scope: insights:read
