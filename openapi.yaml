      x-writavo-approval-kind: destructive
      x-agent-consequence: Permanently deletes every file in the list that the call is allowed to delete; with only_unused false, any article or page that shows one of them shows a broken image.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/WritavoApproval"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaBulkDeleteInput" }
            examples:
              unused:
                summary: Delete duplicates nothing uses
                value:
                  ids:
                    - "4f6b2c1e-8a3d-4e5f-9b7a-1c2d3e4f5a6b"
                    - "9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d"
      responses:
        "200":
          description: What happened to each id. Every id sent appears in exactly one list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MediaBulkDeleteResult" }
              examples:
                report:
                  summary: One deleted, one still in use
                  value:
                    ok: true
                    data:
                      deleted: ["4f6b2c1e-8a3d-4e5f-9b7a-1c2d3e4f5a6b"]
                      in_use: ["9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d"]
                      not_found: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/ApprovalRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

