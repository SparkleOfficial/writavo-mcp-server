    post:
      operationId: inspectLinkProspect
      tags: [SEO]
      summary: Look at a site offering a link
      description: |
        Somebody has offered a backlink, a guest post or a link swap. Give the page they named and get what can
        be said about it for free: whether the page loads, its title, whether it is hidden from search
        engines (`noindex`), how many other sites it links to (a very high number is what a link list
