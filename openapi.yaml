        is_default: { type: boolean }

    MediaAsset:
      type: object
      description: |
        A file in the media library. The storage location is not part of this contract: you get
        a `url` you can use, and the path behind it is ours to change.
      required: [id, bucket, url]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        bucket: { $ref: "#/components/schemas/MediaBucket" }
        url:
          type: string
          format: uri
          readOnly: true
          description: The public URL. Put this in `featured_image_url` or in article markdown.
        file_name: { type: [string, "null"], readOnly: true }
        mime_type:
          type: [string, "null"]
          readOnly: true
          description: The type read from the bytes at registration, not the type you declared.
        size_bytes: { type: [integer, "null"], readOnly: true }
        width: { type: [integer, "null"], readOnly: true }
        height: { type: [integer, "null"], readOnly: true }
        alt_text: { type: [string, "null"], maxLength: 500 }
        created_at: { type: string, format: date-time, readOnly: true }

    MediaBulkDeleteInput:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }
          description: The media ids to delete. A repeated id counts once.
        only_unused:
          type: boolean
          default: true
          description: |
            `true` (the default): delete only the files nothing on this Site uses, and list the
            rest in `in_use`. `false`: delete every named file, even one an article still shows.

    MediaBulkDeleteResult:
      type: object
      required: [deleted, in_use, not_found]
      description: Every id you sent appears in exactly one of the three lists.
      properties:
        deleted:
          type: array
          items: { type: string, format: uuid }
          description: Deleted, with their stored files.
        in_use:
          type: array
          items: { type: string, format: uuid }
          description: Kept, because something on this Site uses them (only with `only_unused` true).
        not_found:
          type: array
          items: { type: string, format: uuid }
          description: No such file on this Site.

    BulkDeleteInput:
      type: object
      required: [ids]
      additionalProperties: false
      description: The body of every `POST /{resource}/bulk-delete` except media's.
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
          description: The ids to delete. A repeated id counts once.
        dry_run:
          type: boolean
          default: false
          description: "`true`: delete nothing, and report what the call would do."

    BulkDeleteResult:
      type: object
      required: [deleted, not_found, failed, dry_run]
      description: Every id you sent appears in exactly one of `deleted`, `not_found` and `failed`.
      properties:
        deleted:
          type: array
          items: { type: string, format: uuid }
          description: Deleted (on a dry run, the ones that would be).
        not_found:
          type: array
          items: { type: string, format: uuid }
          description: No such object on this Site.
        failed:
          type: array
          description: Could not be deleted. The rest of the list was not affected; retry these on their own.
          items:
            type: object
            required: [id, error]
            properties:
              id: { type: string, format: uuid }
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, description: "The error code the single delete would have returned." }
                  message: { type: string }
        dry_run:
          type: boolean
          description: Whether this was a dry run, so nothing was deleted.

    Site:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: |
            The identifier of the Site this key belongs to, for your own logging and support
            requests. It is never a request parameter: the Site is always resolved from the key,
            so sending it anywhere would have no effect.
        name: { type: string }
        domain:
          type: [string, "null"]
          description: The domain the blog is served from, if a delivery route is configured.
        blog_base_url:
          type: [string, "null"]
          format: uri
          description: The base URL published articles appear under.
        locale: { type: [string, "null"], examples: ["en-GB"] }
        timezone:
          type: [string, "null"]
          description: |
            IANA name, `UTC` unless changed with `PATCH /site/settings`. Informational: scheduling
            takes absolute ISO 8601 timestamps and a timestamp without an offset is read as UTC.
          examples: ["Europe/London"]
        pipeline_enabled:
          type: boolean
          description: |
            Whether the AI engine runs on its own cadence for this Site. False means the CMS
            works exactly as before and nothing is generated unless you ask for a run.

    Format:
      type: object
      description: An article format, that is, an SEO blueprint you can set on an article via `format_id`.
      required: [id, key, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        key: { type: string, examples: ["how_to"] }
        name: { type: string, examples: ["How-To"] }
        is_active: { type: boolean }
        is_platform_default:
          type: boolean
          description: True for a format we ship, false for one defined on your Site.

    ContentField:
      type: object
      description: |
        One field of a content type. `api_id` is the key its value has in an entry's `data`.

        | type | value | settings |
        |---|---|---|
        | `text` | one line of text | `validation.min_length`, `max_length` (default 500, at most 5000), `pattern`, `pattern_message` |
        | `long_text` | plain text | `min_length`, `max_length` (default 20000) |
        | `rich_text` | markdown | `min_length`, `max_length` (default 200000) |
        | `number` | a number | `validation.min`, `max`, `integer` |
        | `boolean` | true or false | |
        | `date` | `YYYY-MM-DD` | |
        | `datetime` | ISO 8601 | |
        | `select` | one of `options` | `options` (1 to 200) |
        | `email`, `url`, `color` | text in that format (`#rrggbb` for a colour) | |
        | `json` | any JSON, at most 100 KB | |
        | `media` | a media id from this Site's library | |
        | `reference` | the id of something on this Site | `to`: content type API ids, or `article`, `page`, `category`, `tag`, `author` |
        | `component` | an object with the component's fields | `component`: a component type's API id |
        | `blocks` | a list of objects, each with `_type` (one of `components`) and that component's fields, and an optional `_key` | `components` |

        `list: true` makes the value a list (not for `boolean`, `json`, the long text types or
        `blocks`, which is always one), with `validation.min_items` / `max_items`. `required` is
        enforced when an entry is published or scheduled, not while it is a draft. `unique` (a
        single text, number, email, url, date or select field of a collection) refuses a second
        entry with the same value. `condition` shows a field only when another field has a given
        value, and `required` then applies only when it is shown. `default` fills the field when
        an entry is created without it.
      required: [api_id, name, type]
      properties:
        api_id: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$", examples: ["price"] }
        name: { type: string, minLength: 1, maxLength: 80, examples: ["Price"] }
        type:
          type: string
          enum: [text, long_text, rich_text, number, boolean, date, datetime, select, email, url, color, json, media, reference, component, blocks]
        description: { type: string, maxLength: 500 }
        required: { type: boolean }
        unique: { type: boolean }
        list: { type: boolean }
        default: { description: "A value of the field's type (text, number, boolean, select, date, colour, url or email fields)." }
        validation:
          type: object
          properties:
            min_length: { type: integer, minimum: 0 }
            max_length: { type: integer, minimum: 0 }
            pattern: { type: string, description: A regular expression (POSIX) the text must match. }
            pattern_message: { type: string }
            min: { type: number }
            max: { type: number }
            integer: { type: boolean }
            min_items: { type: integer, minimum: 0 }
            max_items: { type: integer, minimum: 0 }
        options: { type: array, items: { type: string } }
        to: { type: array, items: { type: string }, examples: [["product", "article"]] }
        component: { type: string }
        components: { type: array, items: { type: string } }
        condition:
          type: object
          description: '`{ "field": "tier", "equals": "pro" }`; or `not_equals`, or `in: [...]`.'
          required: [field]
          properties:
            field: { type: string }
            equals: {}
            not_equals: {}
            in: { type: array }
        renamed_from:
          type: string
          writeOnly: true
          description: |
            On a change: the field's previous API id. Its stored values move to the new one. Not
            stored; top-level fields of collections, singletons and article fields only.

    ContentTypeInput:
      type: object
      description: A content type as you send it. `GET /content-types` returns this shape plus read-only fields, so a type read can be sent back.
      required: [api_id, name]
      properties:
        api_id:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
          description: |
            Lower-case letters, digits and `_`. Reserved: `article` (only for kind `article_fields`),
            `articles`, `pages`, `categories`, `tags`, `authors`, `media`, `entries`, `formats`,
            `typescript` and a few more the API uses.
          examples: ["product"]
        kind:
          type: string
          enum: [collection, singleton, component, article_fields]
          default: collection
          description: |
            `collection`: any number of entries. `singleton`: exactly one (a homepage, site footer).
            `component`: no entries of its own; a reusable group of fields for `component` and `blocks`
            fields. `article_fields`: custom fields on every article (API id `article`; values in the
            article's `custom_fields`; cannot be `required`, because the AI pipeline publishes articles
            without them). Never changes once created.
        name: { type: string, minLength: 1, maxLength: 80, examples: ["Product"] }
        description: { type: [string, "null"], maxLength: 500 }
        title_field:
          type: [string, "null"]
          description: A single text field whose value is the entry's `title` in lists.
        fields:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ContentField" }
        expected_version:
          type: integer
          writeOnly: true
          description: On `PATCH /content-types/{api_id}`, the `version` you read; a newer one is `412`.

    ContentTypeUpdate:
      type: object
      description: A change to one content type. A key you leave out keeps its value; `fields` is the whole list. The API id and kind never change.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, "null"], maxLength: 500 }
        title_field: { type: [string, "null"] }
        fields:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ContentField" }
        expected_version:
          type: integer
          description: The `version` you read; a newer one is `412 PRECONDITION_FAILED`.

    ContentType:
      allOf:
        - { $ref: "#/components/schemas/ContentTypeInput" }
        - type: object
          required: [id, kind, fields, version, created_at, updated_at]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            version: { type: integer, readOnly: true, description: Grows with every change. }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }

    ContentSchemaResult:
      type: object
      required: [dry_run, ok, plan, errors]
      properties:
        dry_run: { type: boolean }
        ok: { type: boolean, description: False when the schema has problems (only on a dry run; a real run is 422). }
        plan:
          type: object
          required: [create, update, delete, unchanged]
          properties:
            create: { type: array, items: { type: string } }
            delete: { type: array, items: { type: string } }
            unchanged: { type: array, items: { type: string } }
            update:
              type: array
              items:
                type: object
                properties:
                  api_id: { type: string }
                  added: { type: array, items: { type: string } }
                  removed: { type: array, items: { type: string } }
                  renamed: { type: array, items: { type: object, properties: { from: { type: string }, to: { type: string } } } }
                  retyped: { type: array, items: { type: string } }
                  entries: { type: integer, description: How many entries (or articles with custom fields) the type holds. }
        errors:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path: { type: string, examples: ["product.price.validation.min"] }
              code: { type: string, examples: ["type"] }
              message: { type: string }
        content_types:
          type: array
          description: On a real run, every content type afterwards.
          items: { $ref: "#/components/schemas/ContentType" }

    Entry:
      type: object
      required: [id, type, slug, title, status, data, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: The content type's API id., examples: ["product"] }
        slug: { type: [string, "null"], description: Unique within the type; singletons have none. }
        external_id: { type: [string, "null"], pattern: "^[\\x21-\\x7E]{1,255}$", description: "Your own id for the entry (an import's source id, an integration's key); unique on the Site. Re-running an import updates the entry that carries it." }
        title: { type: [string, "null"], description: "The value of the type's `title_field`." }
        status: { type: string, enum: [draft, scheduled, published] }
        data:
          type: object
          additionalProperties: true
          description: The values, keyed by field API id. Only the type's current fields are returned.
        published_at: { type: [string, "null"], format: date-time }
        first_published_at: { type: [string, "null"], format: date-time }
        scheduled_publish_at: { type: [string, "null"], format: date-time }
        scheduled_unpublish_at: { type: [string, "null"], format: date-time }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EntryCreate:
      type: object
      properties:
        data: { type: object, additionalProperties: true }
        slug: { type: [string, "null"], pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 200 }
        external_id: { type: [string, "null"], pattern: "^[\\x21-\\x7E]{1,255}$", description: "Your own id for the entry (an import's source id, an integration's key); unique on the Site. Re-running an import updates the entry that carries it." }
        status: { type: string, enum: [draft, published], default: draft }

    EntryUpdate:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
          description: Merged key by key; a key set to null clears that field.
        slug: { type: [string, "null"], pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 200 }
        external_id: { type: [string, "null"], pattern: "^[\\x21-\\x7E]{1,255}$", description: "Your own id for the entry (an import's source id, an integration's key); unique on the Site. Re-running an import updates the entry that carries it." }
        replace: { type: boolean, default: false, description: Replace `data` whole instead of merging. }

    EntryRevision:
      type: object
      required: [id, seq, source, created_at]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        source: { type: string, enum: [create, manual, autosave, api, import, restore] }
        actor_user_id: { type: [string, "null"], format: uuid }
        actor_api_key_id: { type: [string, "null"], format: uuid }
        restored_from: { type: [string, "null"], format: uuid }
        status: { type: [string, "null"] }
        slug: { type: [string, "null"] }
        title: { type: [string, "null"] }
        byte_size: { type: integer }
        created_at: { type: string, format: date-time }
        data: { type: object, additionalProperties: true, description: The values at this version (on GET of one revision). }

    Usage:
      type: object
      description: |
        Plan limits, current period usage, credit balance and spend cap in one payload. Read it
        before a pipeline run to fail fast, or after one to see the balance move.
      required: [plan, period, limits, credits]
      properties:
        plan:
          type: object
          required: [key, name]
          properties:
            key: { type: string, examples: ["growth"] }
            name: { type: string, examples: ["Growth"] }
        period:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        limits:
          type: array
          description: One row per metered limit, with what you have used against it.
          items:
            type: object
            required: [key, used]
            properties:
              key: { type: string, examples: ["articles.per_month"] }
              limit:
                type: [integer, "null"]
                description: Null means unlimited on this plan.
              used: { type: integer }
        features:
          type: array
          description: Capability keys your plan grants. A pipeline run needs `ai.article_generation`.
          items: { type: string }
        credits:
          type: object
          required: [balance]
          properties:
            balance:
              type: number
              description: Credits available to the whole organisation, shared across its Sites.
            reserved:
              type: number
              description: Credits committed to work already in flight.
        spend_cap:
          type: object
          description: This Site's own monthly ceiling, independent of the organisation balance.
          properties:
            monthly_credit_cap:
              type: [number, "null"]
              description: Null means uncapped. Zero means this Site may not spend at all.
            period_spent: { type: number }
            reached:
              type: boolean
              description: True when a pipeline run would be refused with `SPEND_CAP_REACHED`.

    PipelineRun:
      type: object
      required: [id, stage, status, started_at]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        stage: { $ref: "#/components/schemas/PipelineStage" }
        status: { $ref: "#/components/schemas/PipelineRunStatus" }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        items_processed: { type: integer }
        items_succeeded: { type: integer }
        items_failed: { type: integer }
        triggered_by:
          type: string
          description: "`cron` for the normal cadence, or `api` for a run you requested."
        error_summary:
          type: [string, "null"]
          description: |
            Why the run ended early, when it did. On a `partial` run this is where you find out
            it was credits, the spend cap, or a vendor failure.

    PipelineSourceStatus:
      type: string
      enum: [discovered, scored, skipped, scraped, rejected, failed, used]
      description: |
        Where a competitor source article is in the queue. `discovered` is found, `scored` passed
        the score threshold, `skipped` fell below it, `scraped` has been read and waits to be
        written, `used` produced an article, `rejected` could not be used (too short, off-niche or
        unreadable) and `failed` hit an error (see `error_message`).

    PipelineSource:
      type: object
      description: |
        A competitor article the engine found and may write an original article from. Scores and
        metadata only: the text read from the page is never exposed.
      required: [id, source_url, status, created_at]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        competitor_id:
          type: [string, "null"]
          format: uuid
          description: The competitor whose blog it was found on. Null if that competitor was removed.
        source_url: { type: string, format: uri }
        status: { $ref: "#/components/schemas/PipelineSourceStatus" }
        seo_score:
          type: [number, "null"]
          description: The weighted 0-100 source score (the Site's `seo_score_weights`). Null until scored.
        organic_traffic: { type: [integer, "null"], description: Estimated monthly organic visits to the page. Null when not measured. }
        ranking_keywords: { type: [integer, "null"], description: Keywords the page ranks for. Null when not measured. }
        top10_keywords: { type: [integer, "null"], description: Keywords the page ranks in the top 10 for. Null when not measured. }
        referring_domains: { type: [integer, "null"], description: Domains linking to the page. Null when not measured. }
        backlinks: { type: [integer, "null"], description: Links to the page. Null when not measured. }
        target_keywords:
          type: array
          items: { type: string }
          description: The keywords the page ranks for, used to brief the writer.
        scored_at: { type: [string, "null"], format: date-time }
        source_title: { type: [string, "null"] }
        featured_image_url: { type: [string, "null"] }
        word_count: { type: [integer, "null"] }
        scrape_attempts: { type: integer }
        scraped_at: { type: [string, "null"], format: date-time }
        write_attempts: { type: integer }
        article_id:
          type: [string, "null"]
          format: uuid
          description: The article written from this source, once `status` is `used`.
        error_message: { type: [string, "null"] }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    QueueItem:
      type: object
      required: [id, topic_or_keyword, source, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        topic_or_keyword: { type: string }
        source: { $ref: "#/components/schemas/PlanItemSource" }
        status: { $ref: "#/components/schemas/PlanItemStatus" }
        signal:
          type: [object, "null"]
          description: |
            Structured research for a competitor sourced item: the angle, hook, data points and
            gaps found. Extracted signal, never copied prose.
        target_publish_date: { type: [string, "null"], format: date }
        priority: { type: integer }
        linked_article_id:
          type: [string, "null"]
          format: uuid
          description: The article this item produced, once it has been written.
        created_at: { type: string, format: date-time, readOnly: true }

    ApiKey:
      type: object
      description: Key metadata. The secret is never included except in the response that created or rotated it.
      required: [id, name, kind, key_prefix, scopes]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        kind: { $ref: "#/components/schemas/KeyKind" }
        key_prefix:
          type: string
          readOnly: true
          description: The only displayable fragment of the secret. Use it to identify a key in your own UI.
          # The first 12 characters of the key. API-2: prefix + the first few random chars.
          examples: ["wv_sk_EXAMPLE"]
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
          description: The scopes actually granted, after intersection with the creator's permissions.
        last_used_at: { type: [string, "null"], format: date-time, readOnly: true }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        origin:
          type: string
          enum: [dashboard, api, device, oauth]
          readOnly: true
          description: |
            How the key came to exist: made in the dashboard, made through this API, or approved
            for a tool through a device sign-in or an AI assistant's OAuth sign-in. `device` and
            `oauth` keys are AI agent keys, subject to the organisation's agent controls.
        client_name:
          type: [string, "null"]
          readOnly: true
          description: The client name a person approved, for a `device` or `oauth` key. Null otherwise.

    Webhook:
      type: object
      required: [id, url, events, enabled]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        url: { type: string, format: uri }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEvent" }
        description: { type: [string, "null"] }
        enabled:
          type: boolean
          description: |
            Set to false automatically after repeated delivery failures. Fix your endpoint, then
            PATCH it back to true. Missed deliveries are not replayed.
        disabled_reason: { type: [string, "null"], readOnly: true }
        last_delivery_at: { type: [string, "null"], format: date-time, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    WebhookDelivery:
      type: object
      description: |
        ONE ATTEMPT. Six attempts of the same event are six of these, all sharing one `event_id`.
      required: [id, event_id, event_type, status, attempt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: This attempt. Sent as the `Writavo-Delivery` header, and what you pass to redeliver.
        event_id:
          type: string
          format: uuid
          description: |
            Stable across retries of the same event, and equal to the payload's `id`. Key your
            idempotency off this, never off the attempt id.
        event_type: { $ref: "#/components/schemas/WebhookEvent" }
        status:
          type: string
          enum: [pending, delivered, failed]
        attempt: { type: integer, minimum: 1, maximum: 6 }
        exhausted:
          type: boolean
          readOnly: true
          description: |
            True when this was the last attempt and we stopped trying. `status: failed` with
            `exhausted: false` means another attempt is scheduled.
        response_status:
          type: [integer, "null"]
          description: The HTTP status your endpoint returned. Null if the request never completed.
        response_body_excerpt:
          type: [string, "null"]
          readOnly: true
          description: The first 512 characters of your response, kept so a failure can be diagnosed.
        duration_ms: { type: [integer, "null"], readOnly: true }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time, readOnly: true }
        delivered_at: { type: [string, "null"], format: date-time }

    # ---- MCP-3: settings, delivery, SEO, outreach, team, billing, insights ----
    EmptyBody:
      type: object
      description: No fields. Send `{}` or no body.
      additionalProperties: false
      properties: {}

    Queued:
      type: object
      description: Accepted and running in the background. Nothing is returned now; read `check` in a few minutes.
      required: [queued, check]
      properties:
        queued: {type: boolean, const: true}
        check:
          type: string
          description: The operation that shows the result once the work is done, named by its operationId or its snake-case name (for example `listCmsPushLog` or `list_cms_push_log`). `run_writavo_action` accepts either.

    ConnectLink:
      type: object
      description: Where a person connects this. The credential is entered only on that page, never through the API.
      required: [provider, connect_url, next_step]
      properties:
        provider: {type: string, enum: [wordpress, ghost, bing_wmt]}
        connect_url:
          type: string
          format: uri
          description: The dashboard page where the person pastes the credential, for example `https://app.writavo.com/delivery?connect=wordpress&site=<site id>`. The `site` parameter opens the dashboard on this Site.
        next_step: {type: string, description: One sentence to tell the person.}

    SiteSettings:
      type: object
      required: [id, name, locale_language, locale_country, locale, timezone, status, created_at]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        name: {type: string, maxLength: 120}
        primary_domain:
          type: [string, "null"]
          description: The Site's own domain, measured by the SEO suite. Not where the blog is served (see `GET /delivery`).
        locale_language: {type: string, pattern: '^[a-z]{2}$', examples: [en]}
        locale_country: {type: string, pattern: '^[A-Z]{2}$', examples: [GB]}
        locale:
          type: string
          description: '`<language>-<country>`.'
          examples: [en-GB]
          readOnly: true
        niche: {type: [string, "null"], maxLength: 200}
        timezone:
          type: string
          description: 'IANA time zone name, `UTC` by default. Informational: schedule times are absolute ISO 8601 timestamps.'
          examples: [Europe/London]
        external_link_rel:
          type: string
          enum: [follow, nofollow]
          description: What a link to another site gets when the article says nothing about that link. Links to the Site's own pages are always followed. One link can be set on its own with `setArticleLinkRel`.
        status:
          type: string
          enum: [active, paused, suspended]
          description: Read only. `suspended` is set by Writavo, `paused` by the organisation.
          readOnly: true
        live_base_url:
          type: [string, "null"]
          format: uri
          description: Where published articles are served, once a delivery route is verified.
          readOnly: true
        created_at: {type: string, format: date-time, readOnly: true}

    SiteSettingsUpdate:
      type: object
      description: Send at least one field. `status` is not settable.
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        primary_domain:
          type: [string, "null"]
          maxLength: 253
          description: A bare hostname such as `example.com`, or null to clear it.
        locale_language: {type: string, pattern: '^[a-z]{2}$'}
        locale_country: {type: string, pattern: '^[A-Z]{2}$'}
        niche: {type: [string, "null"], maxLength: 200}
        timezone:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^(UTC|[A-Z][A-Za-z_]+(/[A-Za-z0-9_+-]+){1,2})$
          description: '`UTC`, or an IANA Area/Location name such as `Europe/London` or `America/Argentina/Buenos_Aires`. Single-segment names such as `GMT` or `EST` are refused; a name that is not a real time zone is `422`.'
        external_link_rel:
          type: string
          enum: [follow, nofollow]
          description: '`follow` (the default) or `nofollow`: what every link to another site gets unless that link says otherwise. It applies on the hosted blog and in `content_html` alike, as pages are next rendered.'

    KnowledgeProfile:
      type: object
      required: [brand_voice, product_description, target_audience, competitors_seed, product_knowledge, prompt_vars, niche_keywords, is_auto_generated]
      properties:
        brand_voice: {type: [string, "null"], maxLength: 4000, description: How the articles should sound.}
        product_description: {type: [string, "null"], maxLength: 4000, description: What the business sells or does.}
        target_audience: {type: [string, "null"], maxLength: 4000, description: Who the articles are for.}
        competitors_seed:
          type: array
          items: {type: string}
          description: The onboarding suggestion list. Read only; tracked competitors are `GET /seo/competitors`.
          readOnly: true
        product_knowledge:
          type: [string, "null"]
          maxLength: 20000
          description: |
            The knowledge base the writer may cite: features, pricing, differentiators. The writer is
            told never to invent a feature that is not in here.
        prompt_vars:
          $ref: "#/components/schemas/PromptVars"
        niche_keywords:
          type: array
          maxItems: 60
          items: {type: string, minLength: 1, maxLength: 60}
          description: |
            The niche gate, lowercase. A competitor article needs at least two of these words in its
            title or text before the pipeline writes it. Empty means no gate.
        is_auto_generated:
          type: boolean
          description: True until a person (or this API) edits the profile.
          readOnly: true
        updated_at: {type: [string, "null"], format: date-time, readOnly: true}
        gaps:
          $ref: "#/components/schemas/KnowledgeProfileGaps"

    KnowledgeProfileGaps:
      type: object
      readOnly: true
      description: |
        What the AI pipeline would fill with a generic placeholder: the prompt variables with no value
        of the Site's own, and whether the product knowledge and the niche keywords are empty. Nothing
        is blocked by a gap; turning the pipeline on while any remain returns a
        `KNOWLEDGE_PROFILE_INCOMPLETE` warning. The same definition drives the dashboard's banner.
      required: [complete, product_knowledge, niche_keywords, prompt_vars]
      properties:
        complete: {type: boolean, description: True when nothing below is missing.}
        product_knowledge: {type: boolean, description: True when the product knowledge is empty.}
        niche_keywords: {type: boolean, description: True when there are no niche keywords.}
        prompt_vars:
          type: array
          items: {type: string}
          description: The `prompt_vars` names that are unset, in the order `PromptVars` lists them.

    PipelineWarning:
      type: object
      description: Advice about a pipeline switch that went through. Never a refusal.
      required: [code, path, message]
      properties:
        code: {type: string, enum: [KNOWLEDGE_PROFILE_INCOMPLETE]}
        path: {type: string, description: What the warning is about, e.g. `knowledge_profile`.}
        message: {type: string}

    KnowledgeProfileUpdate:
      type: object
      description: 'Send at least one field; `null` clears a text field. `prompt_vars` is merged key by key: keys you leave out are unchanged, and `null` or `""` sets one back to its default. `niche_keywords` replaces the whole list.'
      additionalProperties: false
      minProperties: 1
      properties:
        brand_voice: {type: [string, "null"], maxLength: 4000}
        product_description: {type: [string, "null"], maxLength: 4000}
        target_audience: {type: [string, "null"], maxLength: 4000}
        product_knowledge: {type: [string, "null"], maxLength: 20000}
        prompt_vars:
          $ref: "#/components/schemas/PromptVarsUpdate"
        niche_keywords:
          type: array
          maxItems: 60
          items: {type: string, minLength: 1, maxLength: 60}
          description: Stored trimmed, lowercase and without duplicates.

    PromptVars:
      type: object
      description: |
        The Site's values for the brand phrases in the platform writing prompts (the AI writing
        profile). A key that is not set falls back to a generic default built from the Site's name,
        niche, domain, competitors, categories and tags. Only the keys listed here are accepted.
      additionalProperties: false
      properties:
        brand_category: {type: string, maxLength: 600, description: 'What the business is, with an article, e.g. "a project management tool".'}
        brand_focus_areas: {type: string, maxLength: 600, description: The things the product does directly; the writer writes tutorials when a topic is one of these.}
        brand_topic: {type: string, maxLength: 600, description: The broad topic the blog covers.}
        named_competitors: {type: string, maxLength: 600, description: Competitors the writer may name (never link) in honest comparisons.}
        brand_url: {type: string, maxLength: 600, description: The URL brand links point to.}
        blog_path: {type: string, maxLength: 600, description: 'The path internal links are built on, e.g. "/blog/".'}
        example_product_workflow: {type: string, maxLength: 600, description: Example of teaching with the product.}
        example_show_experience: {type: string, maxLength: 600, description: Example of showing the product experience.}
        example_list_features: {type: string, maxLength: 600, description: The feature-list phrasing the writer should avoid.}
        example_definition_good: {type: string, maxLength: 600, description: A good definitional first sentence.}
        example_definition_bad: {type: string, maxLength: 600, description: A vague opener to avoid.}
        example_specific_fact: {type: string, maxLength: 600, description: A specific, checkable fact.}
        example_vague_fact: {type: string, maxLength: 600, description: The same fact said vaguely.}
        example_citation_link_1: {type: string, maxLength: 600, description: A correctly formatted citation link in markdown.}
        example_citation_link_2: {type: string, maxLength: 600, description: A second correctly formatted citation link in markdown.}
        example_citation_anchors: {type: string, maxLength: 600, description: Example anchor texts for source citations.}
        example_competitor_brand: {type: string, maxLength: 600, description: A competitor name used in the anchor text rules.}
        example_internal_link_scenario: {type: string, maxLength: 600, description: When an internal link is worth adding.}
        example_internal_link_right: {type: string, maxLength: 600, description: A well-placed inline internal link.}
        example_internal_link_wrong: {type: string, maxLength: 600, description: A standalone internal link to avoid.}
        example_comparison_row: {type: string, maxLength: 600, description: 'A comparison table row as a JSON array of four strings.'}
        example_comparison_row_short: {type: string, maxLength: 600, description: 'A shorter comparison row as a JSON array of three strings.'}
        example_improve_show: {type: string, maxLength: 600, description: The rewrite stage's example of showing the experience.}
        example_improve_list: {type: string, maxLength: 600, description: The rewrite stage's feature list to avoid.}
        example_categories: {type: string, maxLength: 600, description: Example categories the classifier is shown.}
        example_feature_tag: {type: string, maxLength: 600, description: An example feature tag slug.}
        example_audience_tag: {type: string, maxLength: 600, description: An example audience tag slug.}
        image_objects: {type: string, maxLength: 600, description: Physical objects the illustrations are built from.}
        chat_brand_description: {type: string, maxLength: 600, description: How the SEO assistant describes the business.}
        product_ui_affordances: {type: string, maxLength: 600, description: Real feature and screen names use-case walkthroughs may reference.}
        example_step_name: {type: string, maxLength: 600, description: An example how-to step name.}
        example_use_case_scenarios: {type: string, maxLength: 600, description: Example scenarios for use-case walkthroughs.}
        keyword_fallback_niche: {type: string, maxLength: 600, description: The niche named when no keyword data exists for a topic.}

    PromptVarsUpdate:
      type: object
      description: 'Keys to change. A value of `null` or `""` removes the key, so it falls back to its default. An unknown key is `422` naming `prompt_vars.<key>`.'
      additionalProperties: false
      properties:
        brand_category: {type: [string, "null"], maxLength: 600}
        brand_focus_areas: {type: [string, "null"], maxLength: 600}
        brand_topic: {type: [string, "null"], maxLength: 600}
        named_competitors: {type: [string, "null"], maxLength: 600}
        brand_url: {type: [string, "null"], maxLength: 600}
        blog_path: {type: [string, "null"], maxLength: 600}
        example_product_workflow: {type: [string, "null"], maxLength: 600}
        example_show_experience: {type: [string, "null"], maxLength: 600}
        example_list_features: {type: [string, "null"], maxLength: 600}
        example_definition_good: {type: [string, "null"], maxLength: 600}
        example_definition_bad: {type: [string, "null"], maxLength: 600}
        example_specific_fact: {type: [string, "null"], maxLength: 600}
        example_vague_fact: {type: [string, "null"], maxLength: 600}
        example_citation_link_1: {type: [string, "null"], maxLength: 600}
        example_citation_link_2: {type: [string, "null"], maxLength: 600}
        example_citation_anchors: {type: [string, "null"], maxLength: 600}
        example_competitor_brand: {type: [string, "null"], maxLength: 600}
        example_internal_link_scenario: {type: [string, "null"], maxLength: 600}
        example_internal_link_right: {type: [string, "null"], maxLength: 600}
        example_internal_link_wrong: {type: [string, "null"], maxLength: 600}
        example_comparison_row: {type: [string, "null"], maxLength: 600}
        example_comparison_row_short: {type: [string, "null"], maxLength: 600}
        example_improve_show: {type: [string, "null"], maxLength: 600}
        example_improve_list: {type: [string, "null"], maxLength: 600}
        example_categories: {type: [string, "null"], maxLength: 600}
        example_feature_tag: {type: [string, "null"], maxLength: 600}
        example_audience_tag: {type: [string, "null"], maxLength: 600}
        image_objects: {type: [string, "null"], maxLength: 600}
        chat_brand_description: {type: [string, "null"], maxLength: 600}
        product_ui_affordances: {type: [string, "null"], maxLength: 600}
        example_step_name: {type: [string, "null"], maxLength: 600}
        example_use_case_scenarios: {type: [string, "null"], maxLength: 600}
        keyword_fallback_niche: {type: [string, "null"], maxLength: 600}

    Organisation:
      type: object
      required: [id, name, your_role, agent_access_enabled, agent_approvals_required, created_at]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        name: {type: string, maxLength: 120}
        your_role:
          type: [string, "null"]
          enum: [owner, admin, editor, viewer, null]
          description: The role of the person this key acts for. Null only for a key whose creator is not a member (never an AI agent's key).
          readOnly: true
        agent_access_enabled:
          type: boolean
          description: Read only. A person changes it at https://app.writavo.com/settings/agents.
          readOnly: true
        agent_approvals_required:
          type: boolean
          description: Read only. Money and team actions are asked whatever it says.
          readOnly: true
        created_at: {type: string, format: date-time, readOnly: true}

    OrganisationUpdate:
      type: object
      description: 'The name only. Any other field is `422`: the AI agent and outreach settings change only in the dashboard.'
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}

    PipelineConfig:
      type: object
      required:
        - pipeline_enabled
        - publish_mode
        - articles_per_day
        - batch_size
        - max_auto_improve_attempts
        - quality_score_threshold
        - in_flight
      properties:
        pipeline_enabled: {type: boolean, description: Whether the AI pipeline runs on its own every 10 minutes.}
        publish_mode:
          type: string
          enum: [auto, review]
          description: '`auto` publishes finished articles without review; `review` waits for a person.'
        articles_per_day:
          type: integer
          description: The most articles published per day in `auto` mode. It caps publishing, not generation.
        batch_size: {type: integer, description: The most articles generated per 10-minute tick.}
        max_auto_improve_attempts:
          type: integer
          description: How many AI rewrites an article below the quality threshold gets.
        quality_score_threshold:
          type: number
          minimum: 0
          maximum: 1
          description: The quality score, 0 to 1, an article must reach to move on without a rewrite.
        source_score_threshold:
          type: number
          minimum: 0
          maximum: 100
          description: The pass mark, 0 to 100, a competitor article's SEO score must reach before it is scraped and rewritten. Below it the article is skipped before any money is spent on it.
        seo_score_weights:
          $ref: "#/components/schemas/SeoScoreWeights"
        min_originality_pct:
          type: number
          minimum: 0
          maximum: 100
          description: The hard originality gate. An article must have at least this share of its 5-word phrases not copied from the competitor article, or it goes back for a rewrite instead of publishing.
        next_run_at: {type: [string, "null"], format: date-time, readOnly: true}
        last_dispatched_at: {type: [string, "null"], format: date-time, readOnly: true}
        in_flight:
          type: boolean
          description: True while a pipeline stage is running for this Site.
          readOnly: true
        updated_at: {type: string, format: date-time, readOnly: true}

    PipelineConfigUpdate:
      type: object
      description: Send at least one field.
      additionalProperties: false
      minProperties: 1
      properties:
        pipeline_enabled: {type: boolean}
        publish_mode: {type: string, enum: [auto, review]}
        articles_per_day: {type: integer, minimum: 0, maximum: 100}
        batch_size: {type: integer, minimum: 1, maximum: 50}
        max_auto_improve_attempts: {type: integer, minimum: 0, maximum: 5}
        quality_score_threshold: {type: number, minimum: 0, maximum: 1}
        source_score_threshold: {type: number, minimum: 0, maximum: 100}
        seo_score_weights: { $ref: "#/components/schemas/SeoScoreWeights" }
        min_originality_pct: {type: number, minimum: 60, maximum: 100}

    RecipeEntry:
      type: object
      required: [step]
      additionalProperties: false
      properties:
        step: {type: string, description: A step key from `GET /pipeline/steps`.}
        settings:
          type: object
          additionalProperties: true
          description: The step's settings; a missing one takes the step's default.

    RecipeSpec:
      type: object
      description: |
        An article recipe (spec_version 1): one step for where ideas come from, zero or more to keep,
        zero or more research steps, one writer, the checks, the finishing touches and one publishing
        step. Every entry is `{step, settings}`.
      required: [spec_version, ideas, write, publish]
      additionalProperties: false
      properties:
        spec_version: {type: integer, enum: [1]}
        ideas: { $ref: "#/components/schemas/RecipeEntry" }
        keep: {type: array, maxItems: 8, items: { $ref: "#/components/schemas/RecipeEntry" }}
        research: {type: array, maxItems: 8, items: { $ref: "#/components/schemas/RecipeEntry" }}
        write: { $ref: "#/components/schemas/RecipeEntry" }
        checks: {type: array, maxItems: 8, items: { $ref: "#/components/schemas/RecipeEntry" }}
        finish: {type: array, maxItems: 8, items: { $ref: "#/components/schemas/RecipeEntry" }}
        publish: { $ref: "#/components/schemas/RecipeEntry" }

    RecipeStep:
      type: object
      required: [key, section, section_label, name, description, status, locked, settings, price]
      properties:
        key: {type: string}
        section: {type: string, enum: [ideas, keep, research, write, checks, finish, publish]}
        section_label: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [available, coming_soon]}
        produces: {type: [string, "null"], enum: [url, topic, refresh, null]}
        accepts:
          type: [array, "null"]
          items: {type: string, enum: [url, topic, refresh]}
        only_with_ideas: {type: [array, "null"], items: {type: string}}
        only_with_writers: {type: [array, "null"], items: {type: string}}
        locked: {type: boolean}
        settings:
          type: array
          items:
            type: object
            required: [key, label, type, default]
            properties:
              key: {type: string}
              label: {type: string}
              type: {type: string, enum: [int, bool, enum, text, url_list, weights]}
              min: {type: number}
              max: {type: number}
              options:
                type: array
                items: {type: object, properties: {value: {type: string}, label: {type: string}}}
              maxLength: {type: integer}
              maxItems: {type: integer}
              keys: {type: array, items: {type: string}}
              default: {}
              help: {type: string}
              unit: {type: string}
        price:
          type: array
          items:
            type: object
            required: [action, per, qty, credits]
            properties:
              action: {type: string}
              per: {type: string, enum: [article, candidate, image, rewrite, topic]}
              qty: {type: number}
              credits: {type: [number, "null"]}

    RecipeSentence:
      type: object
      required: [section, step, text, locked]
      properties:
        section: {type: string, enum: [ideas, keep, research, write, checks, finish, publish]}
        step: {type: [string, "null"]}
        text: {type: string}
        locked: {type: boolean}

    RecipeEstimate:
      type: object
      required: [credits_per_article, credits_per_month, articles_per_month, lines, basis, basis_days, unpriced]
      properties:
        credits_per_article: {type: number}
        credits_per_month: {type: number}
        articles_per_month: {type: number}
        lines:
          type: array
          items:
            type: object
            required: [step, label, credits_per_article]
            properties:
              step: {type: string}
              label: {type: string}
              credits_per_article: {type: number}
        basis: {type: string, enum: [default, history], description: '`history` = the Site''s own last 14 days.'}
        basis_days: {type: [integer, "null"]}
        unpriced: {type: array, items: {type: string}}

    RecipeVersion:
      type: object
      required: [id, version, status, spec, sentences, warnings, estimate, created_via, created_at]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer}
        status: {type: string, enum: [draft, live, retired]}
        template_key: {type: [string, "null"]}
        created_via: {type: string, enum: [migration, system, signup, dashboard, api, mcp, undo]}
        note: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        activated_at: {type: [string, "null"], format: date-time}
        spec: { $ref: "#/components/schemas/RecipeSpec" }
        sentences:
          type: array
          items: { $ref: "#/components/schemas/RecipeSentence" }
        warnings:
          type: array
          items: {type: object, properties: {path: {type: string}, message: {type: string}}}
        estimate: { $ref: "#/components/schemas/RecipeEstimate" }

    Recipe:
      type: object
      required: [live, draft, history]
      properties:
        live:
          oneOf:
            - { $ref: "#/components/schemas/RecipeVersion" }
            - {type: "null"}
        draft:
          oneOf:
            - { $ref: "#/components/schemas/RecipeVersion" }
            - {type: "null"}
        history:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              version: {type: integer}
              status: {type: string, enum: [draft, live, retired]}
              template_key: {type: [string, "null"]}
              created_via: {type: string}
              note: {type: [string, "null"]}
              created_at: {type: string, format: date-time}
              activated_at: {type: [string, "null"], format: date-time}
              retired_at: {type: [string, "null"], format: date-time}

    RecipeTemplate:
      type: object
      required: [key, goal, description, available, spec, sentences, estimate, needs]
      properties:
        key: {type: string}
        goal: {type: string}
        description: {type: string}
        available: {type: boolean}
        spec: { $ref: "#/components/schemas/RecipeSpec" }
        sentences:
          type: array
          items: { $ref: "#/components/schemas/RecipeSentence" }
        estimate: { $ref: "#/components/schemas/RecipeEstimate" }
        needs:
          type: array
          items: {type: object, properties: {path: {type: string}, message: {type: string}}}

    RecipeActivityItem:
      type: object
      required: [key, title, is_test, credits, steps]
      properties:
        key: {type: string, format: uuid}
        article_id: {type: [string, "null"], format: uuid}
        title: {type: string}
        status: {type: [string, "null"]}
        is_test: {type: boolean}
        started_at: {type: [string, "null"], format: date-time}
        updated_at: {type: [string, "null"], format: date-time}
        credits: {type: number}
        steps:
          type: array
          items:
            type: object
            required: [step, label, outcome, credits, at]
            properties:
              step: {type: string}
              label: {type: string}
              outcome: {type: string, enum: [done, kept, dropped, held, failed, retry]}
              detail: {type: [string, "null"]}
              credits: {type: number}
              at: {type: string, format: date-time}

    SeoScoreWeights:
      type: object
      description: How much each metric counts toward a competitor article's SEO score. The weights are relative (the score is normalised over the metrics that were measured), so they need not add up to 1. Send all five; at least one must be above 0.
      required: [organic_traffic, ranking_keywords, top10_keywords, referring_domains, backlinks]
      additionalProperties: false
      properties:
        organic_traffic: {type: number, minimum: 0, maximum: 1, examples: [0.3]}
        ranking_keywords: {type: number, minimum: 0, maximum: 1, examples: [0.2]}
        top10_keywords: {type: number, minimum: 0, maximum: 1, examples: [0.2]}
        referring_domains: {type: number, minimum: 0, maximum: 1, examples: [0.2]}
        backlinks: {type: number, minimum: 0, maximum: 1, examples: [0.1]}

    PlanItem:
      description: 'A content plan item: a queue item plus the format it will be written in.'
      allOf:
        - { $ref: "#/components/schemas/QueueItem" }
        - type: object
          properties:
            format_key:
              type: [string, "null"]
              description: The format this topic will be written in, or null for the default.

    PlanItemCreate:
      type: object
      required: [topic_or_keyword]
      additionalProperties: false
      properties:
        topic_or_keyword: {type: string, minLength: 1, maxLength: 300}
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
          default: 0
          description: Higher is written first.
        target_publish_date: {type: [string, "null"], format: date}
        format_key:
          type: [string, "null"]
          pattern: ^[a-z][a-z0-9_]{1,39}$
          description: The `key` of an active format this Site can use (`GET /formats`).

    PlanItemUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        topic_or_keyword: {type: string, minLength: 1, maxLength: 300}
        priority: {type: integer, minimum: -1000, maximum: 1000}
        target_publish_date: {type: [string, "null"], format: date}
        format_key:
          type: [string, "null"]
          pattern: ^[a-z][a-z0-9_]{1,39}$
          description: The `key` of an active format this Site can use (`GET /formats`).
        status:
          type: string
          enum: [planned, skipped]
          description: '`skipped` parks the topic; the pipeline only takes `planned` ones.'

    PlanItemReorder:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          items: {type: string, format: uuid}
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Plan item ids, highest priority first.

    RequeueRequest:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to:
          type: string
          enum: [improve, images, publish]
          description: '`improve` and `images` spend credits; `publish` is free.'

    PromptStage:
      type: string
      enum:
        - plan
        - paraphrase.system
        - paraphrase.user
        - paraphrase.quality_system
        - paraphrase.quality_user
        - improve.system
        - improve.user
        - improve.quality_system
        - improve.quality_user
        - classify.system
        - classify.user
        - image.art_director
        - image.base_style
        - extract.system
        - extract.user
        - chat.system
        - news.system
        - news.user
        - news.quality_system
        - news.quality_user
        - news.attribution
        - news.rewrite
        - refresh.system
        - refresh.user
      description: |
        The prompts the pipeline reads. The `news.*` prompts drive a recipe's news writers ("Short news
        story", "Story from several sources") and their checks; `refresh.*` the "Refresh an old
        article" writer. `plan` is the topic planner; the rest are the article
        pipeline's prompt library (writer, quality audit, improver, classifier, image art director
        and base style, structured-data extractor, SEO assistant). Placeholders such as
        `{{brand_name}}` or `{{named_competitors}}` are filled per Site from its writing profile.

    Prompt:
      type: object
      required: [stage, default_template, override, effective, placeholders]
      properties:
        stage: { $ref: "#/components/schemas/PromptStage" }
        default_template: {type: [string, "null"], description: "The platform default prompt. Null when the caller may not manage prompts (listPrompts without prompts:write)."}
        override:
          type: [object, "null"]
          description: This Site's override, or null.
          required: [template, version, created_at]
          properties:
            template: {type: [string, "null"], description: Null when the caller may not manage prompts.}
            version: {type: integer}
            created_at: {type: string, format: date-time}
        effective: {type: string, enum: [default, override], description: Which of the two the stage uses.}
        placeholders:
          type: array
          items: {type: string}
          description: The `{{name}}` tokens in the default, which an override should keep.

    PromptSaved:
      description: The stage's prompt after an override, with any placeholders the override left out.
      allOf:
        - { $ref: "#/components/schemas/Prompt" }
        - type: object
          required: [missing_placeholders]
          properties:
            missing_placeholders:
              type: array
              items: {type: string}
              description: 'Default placeholders absent from the override. A warning: the save happened.'

    PromptOverride:
      type: object
      required: [template]
      additionalProperties: false
      properties:
        template: {type: string, minLength: 1, maxLength: 20000}

    Blueprint:
      type: object
      description: 'What a format tells the generator: the outline to follow and the structured blocks to fill.'
      required: [requires, sections]
      additionalProperties: false
      properties:
        requires:
          type: array
          items: {type: string, enum: [howto_steps, key_takeaways, comparison, faqs]}
          maxItems: 4
          uniqueItems: true
          description: Structured blocks the generator must fill.
        sections:
          type: array
          items: {type: string, minLength: 1, maxLength: 60}
          minItems: 1
          maxItems: 20
          description: The outline, in order.

    FormatDetail:
      description: An article format with its blueprint and the instructions the writer receives for it.
      allOf:
        - { $ref: "#/components/schemas/Format" }
        - type: object
          required: [blueprint, description, prompt_addendum]
          properties:
            blueprint: { $ref: "#/components/schemas/BlueprintView" }
            description: {type: [string, "null"], maxLength: 1000, description: What the format is for. The classifier reads it when it picks a format.}
            prompt_addendum: {type: [string, "null"], maxLength: 4000, description: 'The writing instructions added to the writer prompt for this format. May use the AI writing profile placeholders, e.g. `{{brand_name}}`.'}

    BlueprintView:
      type: object
      description: 'A format''s blueprint as stored. A platform format may set only `requires`, so `sections` can be empty here; a blueprint you send must follow `Blueprint`.'
      required: [requires, sections]
      properties:
        requires:
          type: array
          items: {type: string, enum: [howto_steps, key_takeaways, comparison, faqs]}
          uniqueItems: true
        sections:
          type: array
          items: {type: string}

    FormatCreate:
      type: object
      required: [name, blueprint]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,39}$
          description: Derived from `name` when omitted. A platform default's key overrides that default for this Site.
        blueprint: { $ref: "#/components/schemas/Blueprint" }
        is_active: {type: boolean, default: true}
        description: {type: [string, "null"], maxLength: 1000}
        prompt_addendum: {type: [string, "null"], maxLength: 4000, description: Writing instructions for this format. May use the AI writing profile placeholders.}

    FormatUpdate:
      type: object
      description: The key cannot change.
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        blueprint: { $ref: "#/components/schemas/Blueprint" }
        is_active: {type: boolean}
        description: {type: [string, "null"], maxLength: 1000, description: '`null` or `""` clears it.'}
        prompt_addendum: {type: [string, "null"], maxLength: 4000, description: '`null` or `""` clears it.'}

    DeliveryConnection:
      type: object
      required: [method, status]
      properties:
        method:
          type: string
          enum: [subdirectory_proxy, subdomain, headless_api, hosted]
          description: '`subdirectory_proxy` is the reverse proxy, `subdomain` a custom domain, `headless_api` the read API, `hosted` the writavo.com hosted site. More may be added.'
        target_domain: {type: [string, "null"]}
        status: {type: string, enum: [pending, verified, failed, disabled]}
        health_check_status: {type: [string, "null"]}
        health_check_last_run_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}

    CustomDomain:
      type: object
      required: [hostname, verification_status, cname_target, last_error]
      properties:
        hostname: {type: string}
        verification_status:
          type: string
          enum: [pending, verified, failed]
          description: '`pending` until the DNS record resolves and Writavo verifies it (checked every 10 minutes), then `verified`; `failed` if it could not be verified. Pending or failed for 14 days means it is deleted and released.'
        ssl_status: {type: [string, "null"]}
        cname_target: {type: string, description: 'The routing record''s value: where the CNAME points, or the IPv4 address for an apex domain.'}
        dns_records:
          type: array
          description: Every DNS record still to add, routing record first. Empty once DNS is right.
          items: {$ref: "#/components/schemas/DnsRecord"}
        last_error:
          type: [string, "null"]
          description: 'Why verification has not succeeded: the hosting provider''s reason. Cleared once it verifies. A domain still pending or failed 14 days after it was connected is deleted and released, and then no longer appears here.'
        created_at: {type: string, format: date-time}

    DeliveryStatus:
      type: object
      required: [live_base_url, connections, custom_domain, hosted_site, recommended_next_step]
      properties:
        live_base_url: {type: [string, "null"], format: uri}
        connections:
          type: array
          items: { $ref: "#/components/schemas/DeliveryConnection" }
        custom_domain:
          oneOf:
            - { $ref: "#/components/schemas/CustomDomain" }
            - {type: "null"}
        hosted_site:
          type: [object, "null"]
          properties:
            slug: {type: string}
            url: {type: string, format: uri}
            published_at: {type: [string, "null"], format: date-time}
        recommended_next_step: {type: string, description: One sentence naming the next operation to run.}

    Installers:
      type: object
      description: Ready-to-paste reverse proxy snippets. The customer installs one of them.
      required: [cloudflare_worker, next_rewrite, nginx]
      properties:
        cloudflare_worker: {type: string, description: A Cloudflare Worker script.}
        next_rewrite: {type: string, description: A `next.config.js` rewrite.}
        nginx: {type: string, description: An Nginx `location` block.}

    ProxySetup:
      type: object
      required: [domain]
      additionalProperties: false
      properties:
        domain:
          type: string
          maxLength: 253
          description: A bare hostname such as `example.com`. A scheme, path or port is stripped.

    ProxySetupResult:
      type: object
      required: [connection, installers, next_step]
      properties:
        connection: { $ref: "#/components/schemas/DeliveryConnection" }
        installers: { $ref: "#/components/schemas/Installers" }
        next_step: {type: string}

    HeadlessSetupResult:
      type: object
      required: [connection, sdk_base, has_publishable_key, next_step]
      properties:
        connection: { $ref: "#/components/schemas/DeliveryConnection" }
        sdk_base:
          type: string
          format: uri
          description: The public read API base, for example `https://blog.writavo.com/api/v1`.
        has_publishable_key: {type: boolean}
        next_step: {type: string}

    CustomDomainConnect:
      type: object
      required: [hostname]
      additionalProperties: false
      properties:
        hostname:
          type: string
          maxLength: 253
          description: The hostname to serve the blog at, such as `blog.example.com`.

    CustomDomainConnected:
      type: object
      required: [hostname, verification_status, cname_target, dns_records, instructions]
      properties:
        hostname: {type: string}
        verification_status: {type: string, enum: [pending, verified, failed]}
        ssl_status: {type: [string, "null"]}
        cname_target: {type: string, description: 'The routing record''s value (a CNAME target, or an IPv4 address for an apex domain).'}
        dns_records:
          type: array
          description: Every DNS record still to add, routing record first. Empty once DNS is right.
          items: {$ref: "#/components/schemas/DnsRecord"}
        instructions: {type: string, description: What the person adds at their DNS provider.}

    DnsRecord:
      type: object
      required: [type, name, value, purpose]
      properties:
        type: {type: string, enum: [CNAME, A, TXT]}
        name: {type: string, description: The full hostname the record is for.}
        value: {type: string}
        purpose:
          type: string
          enum: [routing, ownership]
          description: '`routing` points the domain at Writavo; `ownership` proves the domain may be used here.'

    CustomDomainRemoved:
      type: object
      required: [removed, hostname]
      properties:
        removed: {type: boolean, const: true}
        hostname: {type: string}

    HealthCheckRequest:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method: {type: string, enum: [subdirectory_proxy, subdomain]}

    HealthCheck:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [passed, failed]}
        checks:
          type: object
          required: [render, assets, sitemap, host]
          properties:
            render: {type: boolean}
            assets: {type: boolean}
            sitemap: {type: boolean}
            host: {type: boolean}
        fix: {type: [string, "null"], description: What to fix when a check failed.}

    Branding:
      type: object
      description: How the hosted blog looks.
      properties:
        site_title: {type: [string, "null"], maxLength: 120}
        tagline: {type: [string, "null"], maxLength: 200}
        theme_key: {type: string, enum: [editorial, minimal, magazine]}
        theme_mode: {type: string, enum: [light, dark, system]}
        brand_color: {type: [string, "null"], pattern: '^#[0-9a-fA-F]{6}$'}
        radius: {type: string, enum: [0rem, 0.375rem, 0.625rem, 1rem]}
        font_key: {type: string, enum: [inter, serif, mono]}
        logo_url: {type: [string, "null"], format: uri}
        favicon_url: {type: [string, "null"], format: uri}
        updated_at: {type: [string, "null"], format: date-time, readOnly: true}

    BrandingUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        site_title: {type: [string, "null"], maxLength: 120}
        tagline: {type: [string, "null"], maxLength: 200}
        theme_key: {type: string, enum: [editorial, minimal, magazine]}
        theme_mode: {type: string, enum: [light, dark, system]}
        brand_color: {type: [string, "null"], pattern: '^#[0-9a-fA-F]{6}$'}
        radius: {type: string, enum: [0rem, 0.375rem, 0.625rem, 1rem]}
        font_key: {type: string, enum: [inter, serif, mono]}
        logo_url: {type: [string, "null"], format: uri, maxLength: 2048, description: An https URL.}
        favicon_url: {type: [string, "null"], format: uri, maxLength: 2048, description: An https URL.}

    HostedSite:
      type: object
      required: [slug, url, published_at, branding]
      properties:
        slug: {type: [string, "null"]}
        url: {type: [string, "null"], format: uri}
        published_at: {type: [string, "null"], format: date-time}
        branding:
          oneOf:
            - { $ref: "#/components/schemas/Branding" }
            - {type: "null"}
          description: Null until the branding is first changed; the defaults apply.

    HostedSitePublish:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{1,38}[a-z0-9])?$
          description: Derived from the Site name when omitted.

    HostedSitePublished:
      type: object
      required: [hostname, url, slug, published]
      properties:
        hostname: {type: string}
        url: {type: string, format: uri}
        slug: {type: string}
        published: {type: boolean, const: true}

    CmsConnection:
      type: object
      description: A connected external CMS. The credential is never returned.
      required: [provider, status]
      properties:
        provider: {type: string, enum: [wordpress, ghost]}
        status: {type: string, enum: [pending, connected, failed, disabled]}
        external_site_url: {type: [string, "null"], format: uri}
        external_account_id: {type: [string, "null"]}
        last_verified_at: {type: [string, "null"], format: date-time}
        last_error: {type: [string, "null"]}
        created_at: {type: string, format: date-time}

    CmsConnectRequest:
      type: object
      description: 'Which CMS. No credential field exists: the person enters it in the dashboard.'
      required: [provider]
      additionalProperties: false
      properties:
        provider: {type: string, enum: [wordpress, ghost]}

    CmsDisconnected:
      type: object
      required: [provider, status]
      properties:
        provider: {type: string, enum: [wordpress, ghost]}
        status: {type: string, const: disabled}

    CmsPushLogEntry:
      type: object
      required: [id, article_id, provider, status, created_at]
      properties:
        id: {type: string, format: uuid}
        article_id: {type: string, format: uuid}
        article_title: {type: [string, "null"]}
        provider: {type: string, enum: [wordpress, ghost]}
        status: {type: string, enum: [pending, pushed, failed]}
        external_url: {type: [string, "null"], format: uri}
        error: {type: [string, "null"]}
        pushed_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}

    ScanQueued:
      type: object
      description: A paid scan accepted and running in the background.
      required: [scan, queued, estimated_credits, check]
      properties:
        scan:
          type: string
          enum:
            - site_metrics
            - rank_check
            - content_gaps
            - llm_mentions
            - backlink_profile
            - backlink_detail
            - link_intersect
        queued: {type: boolean, const: true}
        estimated_credits:
          type: number
          description: An upper-bound estimate. Charged per unit of work actually done. Zero for a rank check, which costs no credits.
        check:
          type: string
          description: The operation that shows the result, named by its operationId or its snake-case name (for example `getSeoOverview` or `get_seo_overview`). `run_writavo_action` accepts either.

    SeoSnapshot:
      type: object
      description: One measurement of a domain. A null number was not measured, which is not the same as zero.
      required: [domain, captured_at]
      properties:
        domain: {type: string}
        captured_at: {type: string, format: date-time}
        domain_rank: {type: [integer, "null"]}
        organic_traffic_estimate: {type: [integer, "null"]}
        organic_keywords: {type: [integer, "null"]}
        backlinks: {type: [integer, "null"]}
        referring_domains: {type: [integer, "null"]}
        keywords_top3: {type: [integer, "null"]}
        keywords_top10: {type: [integer, "null"]}
        keywords_top100: {type: [integer, "null"]}
        traffic_value_usd:
          type: [number, "null"]
          description: What the estimated organic traffic would cost as paid clicks, in US dollars per month.
        keywords_pos_1: {type: [integer, "null"], description: Keywords ranking at position 1.}
        keywords_pos_2_3: {type: [integer, "null"], description: Keywords ranking at positions 2-3.}
        keywords_pos_4_10: {type: [integer, "null"], description: Keywords ranking at positions 4-10.}
        keywords_pos_11_20: {type: [integer, "null"], description: Keywords ranking at positions 11-20.}
        keywords_pos_21_50: {type: [integer, "null"], description: Keywords ranking at positions 21-50.}
        keywords_pos_51_100: {type: [integer, "null"], description: Keywords ranking at positions 51-100.}
        keywords_new:
          type: [integer, "null"]
          description: Keywords the domain newly ranks for since the data provider's previous update.
        keywords_up: {type: [integer, "null"], description: Keywords whose position improved since the provider's previous update.}
        keywords_down: {type: [integer, "null"], description: Keywords whose position dropped since the provider's previous update.}
        keywords_lost: {type: [integer, "null"], description: Keywords the domain no longer ranks for since the provider's previous update.}
        backlinks_dofollow: {type: [integer, "null"]}
        backlinks_nofollow: {type: [integer, "null"]}
        backlinks_gov: {type: [integer, "null"], description: Backlinks from .gov domains.}
        backlinks_edu: {type: [integer, "null"], description: Backlinks from .edu domains.}
        backlink_spam_score: {type: [integer, "null"], minimum: 0, maximum: 100}
        broken_backlinks: {type: [integer, "null"], description: Inbound links that point at a page on this domain that errors.}
        broken_pages: {type: [integer, "null"]}
        referring_ips: {type: [integer, "null"]}

    SeoOwnSnapshot:
      description: |
        The own site's latest measurement: every SeoSnapshot field plus its top pages and backlink
        breakdown. Domain rank, spam score, gov/edu counts and the platform and country breakdowns
        need paid backlink data and are null without it.
      allOf:
        - { $ref: "#/components/schemas/SeoSnapshot" }
        - type: object
          properties:
            top_pages:
              type: [array, "null"]
              maxItems: 50
              description: Up to 20 pages by estimated organic traffic, highest first.
              items:
                type: object
                required: [url]
                properties:
                  url: {type: string}
                  etv: {type: [number, "null"], description: Estimated monthly organic traffic to the page.}
                  keywords: {type: [integer, "null"]}
                  top_position:
                    type: [integer, "null"]
                    description: The lower bound of the best position band the page ranks in (1, 2, 4, 11, ...), not an exact rank.
                  top_bucket: {type: [string, "null"], description: 'That band, for example "1", "2-3" or "4-10".'}
            backlink_breakdown:
              type: [object, "null"]
              description: Where the backlink data came from, and its top lists. A list is absent when it was not measured.
              properties:
                source:
                  type: string
                  description: '`dataforseo` for paid data, otherwise the free import source (`gsc_csv`, `bing_wmt`, `manual` or `derived`).'
                platform_types:
                  type: array
                  items: { $ref: "#/components/schemas/SeoKeyCount" }
                countries:
                  type: array
                  items: { $ref: "#/components/schemas/SeoKeyCount" }
                tlds:
                  type: array
                  items: { $ref: "#/components/schemas/SeoKeyCount" }
                anchors:
                  type: array
                  items:
                    type: object
                    required: [anchor]
                    properties:
                      anchor: {type: string}
                      backlinks: {type: [integer, "null"]}
                      referring_domains: {type: [integer, "null"]}

    SeoKeyCount:
      type: object
      required: [key, count]
      properties:
        key: {type: string}
        count: {type: integer}

    SeoOverview:
      type: object
      required: [own_site, competitors, trend]
      properties:
        own_site:
          oneOf:
            - { $ref: "#/components/schemas/SeoOwnSnapshot" }
            - {type: "null"}
        competitors:
          type: array
          items:
            type: object
            required: [competitor_id, domain, latest]
            properties:
              competitor_id: {type: string, format: uuid}
              domain: {type: string}
              name: {type: [string, "null"]}
              latest:
                oneOf:
                  - { $ref: "#/components/schemas/SeoSnapshot" }
                  - {type: "null"}
        trend:
          type: array
          items: { $ref: "#/components/schemas/SeoSnapshot" }
          description: The own site, last 90 days, oldest first.

    Competitor:
      type: object
      required: [id, domain, is_own_site, is_active, max_articles_per_run]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        domain: {type: string}
        name: {type: [string, "null"], maxLength: 120}
        is_own_site: {type: boolean, readOnly: true}
        is_active: {type: boolean}
        blog_url: { $ref: "#/components/schemas/CompetitorBlogUrl" }
        listing_selector: { $ref: "#/components/schemas/CompetitorListingSelector" }
        content_selector: { $ref: "#/components/schemas/CompetitorContentSelector" }
        max_articles_per_run: { $ref: "#/components/schemas/CompetitorMaxArticlesPerRun" }
        notes: { $ref: "#/components/schemas/CompetitorNotes" }
        added_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}

    CompetitorBlogUrl:
      type: [string, "null"]
      format: uri
      maxLength: 2048
      description: |
        The competitor's blog listing page, the page that links to its articles, such as
        `https://example.com/blog`. `http` or `https` on a public hostname; no user name, password,
        port or IP address (`422` on `blog_url`). `null` or an empty string clears it. When set, the
        competitor is a content source: its articles are read for signal (never republished).

    CompetitorListingSelector:
      type: [string, "null"]
      maxLength: 500
      description: |
        A CSS selector for the article links on the listing page, such as `article h2 a`. `null` or
        an empty string means auto-detect, which is right for most blogs.

    CompetitorContentSelector:
      type: [string, "null"]
      maxLength: 500
      description: |
        A CSS selector for the article body on an article page, such as `.post-content`. `null` or
        an empty string means auto-detect.

    CompetitorMaxArticlesPerRun:
      type: integer
      minimum: 1
      maximum: 50
      default: 5
      description: The most articles one pipeline run reads from this competitor.

    CompetitorNotes:
      type: [string, "null"]
      maxLength: 2000
      description: Free-text notes for the people curating this competitor. Never sent to the AI.

    CompetitorCreate:
      type: object
      required: [domain]
      additionalProperties: false
      properties:
        domain:
          type: string
          maxLength: 253
          description: A bare hostname such as `example.com`. A scheme, path or port is stripped.
        name: {type: [string, "null"], maxLength: 120}
        blog_url: { $ref: "#/components/schemas/CompetitorBlogUrl" }
        listing_selector: { $ref: "#/components/schemas/CompetitorListingSelector" }
        content_selector: { $ref: "#/components/schemas/CompetitorContentSelector" }
        max_articles_per_run: { $ref: "#/components/schemas/CompetitorMaxArticlesPerRun" }
        notes: { $ref: "#/components/schemas/CompetitorNotes" }

    CompetitorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: [string, "null"], maxLength: 120}
        is_active: {type: boolean}
        blog_url: { $ref: "#/components/schemas/CompetitorBlogUrl" }
        listing_selector: { $ref: "#/components/schemas/CompetitorListingSelector" }
        content_selector: { $ref: "#/components/schemas/CompetitorContentSelector" }
        max_articles_per_run: { $ref: "#/components/schemas/CompetitorMaxArticlesPerRun" }
        notes: { $ref: "#/components/schemas/CompetitorNotes" }

    TrackedKeyword:
      type: object
      required: [id, keyword, is_priority, is_active, latest_position]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        keyword: {type: string}
        is_priority: {type: boolean, description: Checked daily rather than weekly.}
        target_url: {type: [string, "null"], format: uri, description: The page that should rank for it.}
        location_code: {type: integer}
        language_code: {type: string}
        is_active: {type: boolean}
        latest_position:
          type: [integer, "null"]
          description: Null when not in the top 100, or not checked yet.
        latest_checked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time, readOnly: true}

    TrackedKeywordCreate:
      type: object
      required: [keyword]
      additionalProperties: false
      properties:
        keyword: {type: string, minLength: 1, maxLength: 200}
        target_url: {type: [string, "null"], format: uri, description: An https URL on the Site.}
        is_priority: {type: boolean, default: false}
        location_code: {type: integer, description: A search location code. Defaults from the Site locale.}
        language_code: {type: string, pattern: '^[a-z]{2}$', description: Defaults from the Site locale.}

    TrackedKeywordUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        is_priority: {type: boolean}
        target_url: {type: [string, "null"], format: uri}
        is_active: {type: boolean}

    SeoImportInput:
      type: object
      additionalProperties: false
      description: |
        At most 2,000 `keywords`, 100 `competitors` and 10,000 `positions` rows per call; split a
        larger history into several calls (positions SET, so the order of calls does not matter,
        but send a keyword before or with its positions). A body that is not this shape, or is over
        a cap, is refused whole with 422; a bad ROW is only skipped and reported in `problems`.
      properties:
        dry_run:
          type: boolean
          default: true
          description: Check and report without writing. Defaults to true; send false to write.
        keywords:
          type: array
          maxItems: 2000
          description: Keywords to track. One already tracked (ignoring case) is updated.
          items: { $ref: "#/components/schemas/SeoImportKeyword" }
        competitors:
          type: array
          maxItems: 100
          description: Competitors to add. One already there (same domain) is updated.
          items: { $ref: "#/components/schemas/SeoImportCompetitor" }
        positions:
          type: array
          maxItems: 10000
          description: Ranking history, one row per keyword per UTC day.
          items: { $ref: "#/components/schemas/SeoImportPosition" }

    SeoImportKeyword:
      type: object
      additionalProperties: false
      required: [keyword]
      properties:
        keyword: {type: string, minLength: 1, maxLength: 200}
        target_url: {type: [string, "null"], format: uri, description: An https URL on the Site. Null clears it.}
        is_priority: {type: boolean, description: Checked daily rather than weekly. Default false on a new keyword.}
        location_code: {type: integer, minimum: 1, maximum: 99999999, description: A search location code. Defaults from the Site locale.}
        language_code: {type: string, pattern: '^[a-z]{2}$', description: Defaults from the Site locale.}

    SeoImportCompetitor:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: {type: string, maxLength: 300, description: "A public hostname; a pasted URL is reduced to it (https://www.rival.com/blog is rival.com). A non-ASCII name in its xn-- form."}
        name: {type: [string, "null"], maxLength: 120}
        blog_url: {type: [string, "null"], maxLength: 2048, description: The competitor's blog listing page (http or https, public hostname, no port). Null clears it.}

    SeoImportPosition:
      type: object
      additionalProperties: false
      required: [keyword, day, position]
      properties:
        keyword: {type: string, minLength: 1, maxLength: 200, description: A keyword tracked on the Site or in this call's keywords (ignoring case).}
        day: {type: string, format: date, description: "The UTC day, from 2000-01-01 to yesterday (a finished day)."}
        position:
          type: [number, "null"]
          minimum: 1
          maximum: 1000
          description: The Google position that day, or null when the keyword did not rank. Decimals (an average) are rounded.
        url: {type: [string, "null"], maxLength: 2048, description: The page that ranked (http or https).}
        search_volume: {type: [integer, "null"], minimum: 0, maximum: 2000000000}
        impressions: {type: [integer, "null"], minimum: 0, maximum: 2000000000}
        clicks: {type: [integer, "null"], minimum: 0, maximum: 2000000000}

    SeoImportResult:
      type: object
      required: [dry_run, written, plan, tracked_keywords, problems]
      properties:
        dry_run: {type: boolean}
        written:
          type: object
          description: What this call wrote. All zeros on a dry run.
          required: [keywords_created, keywords_updated, competitors_created, competitors_updated, positions]
          properties:
            keywords_created: {type: integer}
            keywords_updated: {type: integer, description: Keywords a sent field changed. An identical row is not rewritten, so a repeat reports 0.}
            competitors_created: {type: integer}
            competitors_updated: {type: integer, description: Competitors a sent field changed.}
            positions: {type: integer, description: Days of history set (one per valid positions row; a repeat sets them again).}
        plan:
          type: object
          description: What the valid rows carry (the same on a dry run).
          required: [keywords_new, keywords_existing, competitors_new, competitors_existing, positions, keywords_with_positions]
          properties:
            keywords_new: {type: integer}
            keywords_existing: {type: integer}
            competitors_new: {type: integer}
            competitors_existing: {type: integer}
            positions: {type: integer}
            keywords_with_positions: {type: integer}
        tracked_keywords:
          type: object
          required: [limit, active]
          description: The organisation's keyword limit and how many it tracked across its Sites before this call.
          properties:
            limit: {type: [integer, "null"], description: Null when the plan sets no limit.}
            active: {type: integer}
        problems:
          type: array
          description: The rows that were skipped, and why.
          items:
            type: object
            required: [section, index, error]
            properties:
              section: {type: string, enum: [keywords, competitors, positions]}
              index: {type: integer, description: The row's position in its array, from 0.}
              error: {type: string}

    KeywordPosition:
      type: object
      required: [checked_at, position]
      properties:
        checked_at: {type: string, format: date-time}
        position: {type: [integer, "null"]}
        url: {type: [string, "null"]}
        search_volume: {type: [integer, "null"]}
        impressions: {type: [integer, "null"]}
        clicks: {type: [integer, "null"]}
        source: {type: string, description: "dataforseo (a rank check), gsc (Search Console) or import (POST /seo/import)."}

    KeywordAlert:
      type: object
      required: [id, tracked_keyword_id, keyword, type, created_at]
      properties:
        id: {type: string, format: uuid}
        tracked_keyword_id: {type: string, format: uuid}
        keyword: {type: string}
        type: {type: string}
        old_position: {type: [integer, "null"]}
        new_position: {type: [integer, "null"]}
        created_at: {type: string, format: date-time}
        acknowledged_at: {type: [string, "null"], format: date-time}

    AlertAcknowledge:
      type: object
      description: Exactly one of `ids` or `all`.
      additionalProperties: false
      properties:
        ids:
          type: array
          items: {type: string, format: uuid}
          minItems: 1
          maxItems: 100
          uniqueItems: true
        all: {type: boolean, const: true}

    AlertsAcknowledged:
      type: object
      required: [acknowledged]
      properties:
        acknowledged: {type: integer}

    ContentGap:
      type: object
      required: [id, keyword, status]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        competitor_id: {type: [string, "null"], format: uuid}
        keyword: {type: string}
        search_volume: {type: [integer, "null"]}
        keyword_difficulty: {type: [number, "null"]}
        competitor_position: {type: [integer, "null"]}
        our_position: {type: [integer, "null"]}
        opportunity_score: {type: [number, "null"]}
        status: {type: string, enum: [open, planned, targeted, covered, dismissed]}
        linked_plan_item_id: {type: [string, "null"], format: uuid}
        captured_at: {type: string, format: date-time}
        last_offered_at:
          type: [string, "null"]
          format: date-time
          description: When a targeted gap was last offered to the writer.
        offer_count:
          type: integer
          description: How many article briefs a targeted gap has been offered to. A high count with no coverage means it does not fit what is being written.
        covered_article_id:
          type: [string, "null"]
          format: uuid
          description: The article that covered the keyword, when `status` is `covered`.

    ContentGapUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, enum: [open, targeted, dismissed]}

    PlanFromSource:
      type: object
      description: Optional. The priority and format for the new plan item.
      additionalProperties: false
      properties:
        priority: {type: integer, minimum: -1000, maximum: 1000}
        format_key:
          type: [string, "null"]
          pattern: ^[a-z][a-z0-9_]{1,39}$
          description: The `key` of an active format this Site can use (`GET /formats`).

    GapPlanned:
      type: object
      required: [plan_item, gap]
      properties:
        plan_item: { $ref: "#/components/schemas/PlanItem" }
        gap: { $ref: "#/components/schemas/ContentGap" }

    InternalLinkHealth:
      type: object
      required: [total, broken, orphans, broken_links, orphan_articles, top_anchors]
      properties:
        total: {type: integer}
        broken: {type: integer}
        orphans: {type: integer}
        broken_links:
          type: array
          items:
            type: object
            properties:
              source_article_id: {type: string, format: uuid}
              source_title: {type: [string, "null"]}
              target_url: {type: string}
              anchor_text: {type: [string, "null"]}
          maxItems: 200
        orphan_articles:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              title: {type: [string, "null"]}
              slug: {type: [string, "null"]}
          maxItems: 200
        top_anchors:
          type: array
          items:
            type: object
            properties:
              anchor_text: {type: string}
              count: {type: integer}
          maxItems: 50

    InternalLinkReportArticle:
      type: object
      required: [article_id, title, slug, inbound, outbound, published_at]
      properties:
        article_id: {type: string, format: uuid}
        title: {type: [string, "null"]}
        slug: {type: [string, "null"]}
        inbound: {type: integer, description: Distinct published articles linking to this one.}
        outbound: {type: integer, description: Distinct published articles this one links to.}
        published_at: {type: [string, "null"], format: date-time}

    InternalLinkReport:
      type: object
      required: [under_linked_threshold, list_limit, summary, orphans, under_linked, no_outbound,
                 pillars, broken, anchors, anchor_concentration]
      properties:
        under_linked_threshold: {type: integer}
        list_limit: {type: integer, description: The most rows any list holds.}
        summary:
          type: object
          required: [published_articles, internal_links, external_links, avg_inbound, orphans, under_linked,
                     no_outbound, broken_internal, broken_external, external_checked, generic_anchor_links,
                     last_checked_at]
          properties:
            published_articles: {type: integer}
            internal_links: {type: integer, description: Links from one published article to another, self-links excluded.}
            external_links: {type: integer}
            avg_inbound: {type: number}
            orphans: {type: integer}
            under_linked: {type: integer}
            no_outbound: {type: integer}
            broken_internal: {type: integer}
            broken_external: {type: integer}
            external_checked: {type: integer, description: External links with an HTTP check result so far.}
            generic_anchor_links: {type: integer}
            last_checked_at: {type: [string, "null"], format: date-time, description: Null until the first scan.}
        orphans:
          type: array
          items: { $ref: "#/components/schemas/InternalLinkReportArticle" }
          maxItems: 200
        under_linked:
          type: array
          items: { $ref: "#/components/schemas/InternalLinkReportArticle" }
          maxItems: 200
        no_outbound:
          type: array
          items: { $ref: "#/components/schemas/InternalLinkReportArticle" }
          maxItems: 200
        pillars:
          type: array
          items: { $ref: "#/components/schemas/InternalLinkReportArticle" }
          maxItems: 25
        broken:
          type: array
          maxItems: 200
          items:
            type: object
            required: [source_article_id, target_url, link_type, reason]
            properties:
              source_article_id: {type: string, format: uuid}
              source_title: {type: [string, "null"]}
              source_slug: {type: [string, "null"]}
              target_url: {type: [string, "null"]}
              anchor_text: {type: [string, "null"]}
              link_type: {type: string, enum: [internal, external]}
              reason: {type: string, enum: [missing, unpublished, unreachable]}
              http_status: {type: [integer, "null"]}
              checked_at: {type: string, format: date-time}
        anchors:
          type: array
          maxItems: 200
          items:
            type: object
            required: [anchor_text, uses, targets, generic, ambiguous]
            properties:
              anchor_text: {type: string, description: Normalised (lower case, collapsed whitespace, outer punctuation trimmed).}
              uses: {type: integer}
              targets: {type: integer, description: Distinct articles this anchor links to.}
              generic: {type: boolean, description: A phrase like "click here" or "read more".}
              ambiguous: {type: boolean, description: The same anchor links to more than one article.}
              share_pct: {type: [number, "null"], description: Percent of all anchored internal links.}
        anchor_concentration:
          type: array
          maxItems: 100
          description: Articles with at least 3 anchored inbound links where one exact anchor carries 60% or more.
          items:
            type: object
            required: [target_article_id, anchor_text, uses, target_links, share]
            properties:
              target_article_id: {type: string, format: uuid}
              target_title: {type: [string, "null"]}
              target_slug: {type: [string, "null"]}
              anchor_text: {type: string}
              uses: {type: integer}
              target_links: {type: integer}
              share: {type: number, description: 0 to 1.}

    LlmMention:
      type: object
      required: [id, topic, engine, is_mentioned, is_cited, checked_at]
      properties:
        id: {type: string, format: uuid}
        topic: {type: string}
        engine: {type: string}
        is_mentioned: {type: boolean}
        is_cited: {type: boolean}
        citation_url: {type: [string, "null"]}
        position: {type: [integer, "null"]}
        checked_at: {type: string, format: date-time}

    AiVisibilityEngine:
      type: object
      required: [engine, captured_at, keywords_checked, answers_checked, mentions, citations]
      properties:
        engine: {type: string, description: "google_ai_overview, google_ai_mode, chatgpt, claude, gemini or perplexity. Treat as open."}
        captured_at: {type: string, format: date-time}
        keywords_checked: {type: integer}
        answers_checked: {type: integer}
        mentions: {type: integer, description: Answers that mention or cite the Site.}
        citations: {type: integer, description: Answers that cite a page on the Site.}
        share_of_voice: {type: [number, "null"], description: Percent of citations to the top domains that went to the Site.}
        brand_mentions_total: {type: [integer, "null"], description: "The engine's own count of the domain across its answer index; null when the engine has none."}
        ai_search_volume: {type: [integer, "null"]}
        previous:
          type: [object, "null"]
          properties:
            captured_at: {type: string, format: date-time}
            mentions: {type: integer}
            citations: {type: integer}
            share_of_voice: {type: [number, "null"]}
            answers_checked: {type: integer}

    AiVisibility:
      type: object
      required: [website_id, days, engines, trend, top_domains, samples, keywords]
      properties:
        website_id: {type: string, format: uuid}
        days: {type: integer}
        own_domain: {type: [string, "null"]}
        competitors: {type: array, items: {type: string}}
        last_run_at: {type: [string, "null"], format: date-time}
        engines:
          type: array
          items: { $ref: "#/components/schemas/AiVisibilityEngine" }
        trend:
          type: array
          items:
            type: object
            properties:
              captured_at: {type: string, format: date-time}
              engine: {type: string}
              mentions: {type: integer}
              citations: {type: integer}
              share_of_voice: {type: [number, "null"]}
              answers_checked: {type: integer}
        top_domains:
          type: array
          items:
            type: object
            properties:
              domain: {type: string}
              mentions: {type: integer}
              engines: {type: array, items: {type: string}}
              is_own: {type: boolean}
              is_competitor: {type: boolean}
        samples:
          type: array
          items:
            type: object
            properties:
              keyword: {type: string}
              question: {type: string}
              engine: {type: string}
              snippet: {type: string}
              cited_urls: {type: array, items: {type: string}}
              mentioned: {type: boolean}
              cited: {type: boolean}
        keywords:
          type: array
          items:
            type: object
            properties:
              topic: {type: string}
              engine: {type: string}
              is_mentioned: {type: boolean}
              is_cited: {type: boolean}
              citation_url: {type: [string, "null"]}
              position: {type: [integer, "null"]}
              answered: {type: [boolean, "null"], description: "false when the engine gave no answer for the keyword; null for older checks that did not record it."}
              checked_at: {type: string, format: date-time}

    Engagement:
      type: object
      required: [from, to, totals, by_day, top_posts]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        totals:
          type: object
          required: [views, reactions, shares]
          properties:
            views: {type: integer}
            reactions: {type: integer}
            shares: {type: integer}
        by_day:
          type: array
          items:
            type: object
            properties:
              day: {type: string, format: date}
              views: {type: integer}
              reactions: {type: integer}
              shares: {type: integer}
        top_posts:
          type: array
          items:
            type: object
            properties:
              post_slug: {type: string}
              article_id: {type: [string, "null"], format: uuid}
              views: {type: integer}
              reactions: {type: integer}
              shares: {type: integer}
          maxItems: 50
        reactions_by_type:
          type: object
          description: |
            Readers' current reactions, by type, counted on the day each was last set (the same
            rule as the reactions in totals and by_day).
          properties:
            useful: {type: integer}
            mind_blown: {type: integer}
            insightful: {type: integer}
            skeptical: {type: integer}
            loved: {type: integer}
            hot_take: {type: integer}
        shares_by_platform:
          type: object
          description: Share clicks in the range, by where they went (`other` is a copied link or the system share sheet).
          properties:
            x: {type: integer}
            linkedin: {type: integer}
            facebook: {type: integer}
            other: {type: integer}

    BacklinkOverview:
      type: object
      required:
        - own_site
        - trend
        - competitors
        - top_anchors
        - detail
        - sources
        - paid_data_available
        - disavow_count
      properties:
        own_site:
          type: [object, "null"]
          description: The latest profile summary for the Site's own domain.
        trend:
          type: array
          items: {type: object}
          description: The own site's profile, last 180 days.
        competitors:
          type: array
          items: {type: object}
        top_anchors:
          type: array
          items:
            type: object
            properties:
              anchor: {type: string}
              count: {type: integer}
          maxItems: 25
        detail:
          type: object
          description: Counts over the individual links. `pulled_at` null means detail was never pulled, not that none exist.
          properties:
            live: {type: integer}
            lost: {type: integer}
            broken: {type: [integer, "null"], description: 'Null means never checked, not zero.'}
            toxic: {type: [integer, "null"], description: 'Null means never checked, not zero.'}
            nofollow: {type: [integer, "null"], description: 'Null means never checked, not zero.'}
            verified: {type: integer}
            pulled_at: {type: [string, "null"], format: date-time}
            verified_at: {type: [string, "null"], format: date-time}
        sources:
          type: array
          items: {type: string}
          description: Where the data came from, for example `import`, `bing_wmt` or the paid provider.
        last_import: {type: [object, "null"]}
        paid_data_available:
          type: boolean
          description: Whether Writavo's paid backlink data is switched on. While it is false the three paid backlink scans answer `409 FEATURE_UNAVAILABLE`.
        disavow_count: {type: integer}

    Backlink:
      type: object
      required: [id, source_url, source_domain, target_url, is_dofollow, is_broken]
      properties:
        id: {type: string, format: uuid}
        source_url: {type: string}
        source_domain: {type: string}
        source_title: {type: [string, "null"]}
        anchor: {type: [string, "null"]}
        target_url: {type: string}
        link_type: {type: [string, "null"]}
        is_dofollow: {type: [boolean, "null"], description: Null means not verified yet.}
        is_broken: {type: boolean}
        source_authority: {type: [integer, "null"]}
        spam_score: {type: [integer, "null"]}
        first_seen: {type: [string, "null"], format: date-time}
        last_seen: {type: [string, "null"], format: date-time}
        lost_at: {type: [string, "null"], format: date-time}
        verified_at: {type: [string, "null"], format: date-time}
        source: {type: string}

    BacklinkDetailPull:
      type: object
      required: [target_domain]
      additionalProperties: false
      properties:
        target_domain:
          type: string
          maxLength: 253
          description: The Site's own domain or a tracked competitor's.
        offset: {type: integer, minimum: 0, maximum: 50000, multipleOf: 1000, default: 0}
        mode:
          type: string
          enum: [one_per_domain, as_is, one_per_anchor]
          default: as_is
          description: '`as_is` (the default) returns every link; `one_per_domain` one link per linking domain; `one_per_anchor` one per anchor text.'

    DisavowEntry:
      type: object
      required: [id, kind, value]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        kind: {type: string, enum: [domain, url]}
        value: {type: string}
        reason: {type: [string, "null"]}
        created_at: {type: string, format: date-time, readOnly: true}

    DisavowEntryCreate:
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [domain, url]}
        value:
          type: string
          maxLength: 2048
          description: A bare domain for `domain`, an http or https URL for `url`.
        reason: {type: [string, "null"], maxLength: 500}

    DisavowFile:
      type: object
      required: [content, lines]
      properties:
        content: {type: string, description: 'The file, in Google''s disavow format.'}
        lines: {type: integer}

    BacklinkImport:
      type: object
      required: [csv]
      additionalProperties: false
      properties:
        csv:
          type: string
          maxLength: 900000
          description: The CSV text of a Search Console links export.
        file_name: {type: [string, "null"], maxLength: 200}

    BacklinkImportResult:
      type: object
      required: [rows_seen, rows_imported, rows_skipped]
      properties:
        rows_seen: {type: integer}
        rows_imported: {type: integer}
        rows_skipped: {type: integer}
        note: {type: [string, "null"]}

    LinkOpportunity:
      type: object
      required: [id, source_domain, status]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        source_domain: {type: string}
        source_url: {type: [string, "null"]}
        source_authority: {type: [integer, "null"]}
        spam_score: {type: [integer, "null"]}
        intersect_count: {type: [integer, "null"]}
        competitor_ids:
          type: array
          items: {type: string, format: uuid}
        opportunity_score: {type: [number, "null"]}
        discovered_via: {type: string}
        status: {type: string, enum: [open, planned, contacted, won, dismissed]}
        linked_plan_item_id: {type: [string, "null"], format: uuid}
        linked_article_id: {type: [string, "null"], format: uuid}
        note: {type: [string, "null"]}
        discovered_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    LinkOpportunityCreate:
      type: object
      required: [source_domain]
      additionalProperties: false
      properties:
        source_domain:
          type: string
          maxLength: 253
          description: A bare hostname such as `example.com`. A scheme, path or port is stripped.
        source_url: {type: [string, "null"], format: uri}
        note: {type: [string, "null"], maxLength: 1000}

    LinkOpportunityUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: {type: string, enum: [open, contacted, won, dismissed]}
        note: {type: [string, "null"], maxLength: 1000}

    OpportunityPlanned:
      type: object
      required: [plan_item, opportunity]
      properties:
        plan_item: { $ref: "#/components/schemas/PlanItem" }
        opportunity: { $ref: "#/components/schemas/LinkOpportunity" }

    LinkExchange:
      type: object
      required: [id, partner_domain, status, health, needs_attention, their_link, our_link]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        partner_domain: {type: string}
        status:
          type: string
          enum: [proposed, agreed, declined, ended]
          description: The decision a person recorded. Whether the links are actually there is `health`.
        health:
          type: string
          enum: [balanced, their_link_nofollow, their_link_removed, waiting_on_them, waiting_on_us, not_started, could_not_check, closed]
        needs_attention:
          type: boolean
          description: True when you gave a link and are not getting a followed one back.
        note: {type: [string, "null"]}
        kind: {type: string, enum: [swap, guest_post, paid, other], description: What was agreed. For the record; it does not change how the links are checked.}
        contact: {type: [string, "null"], description: Who offered it, as the person wrote it.}
        agreed_at: {type: [string, "null"], format: date-time, description: When the status first became `agreed`. Set by Writavo.}
        history:
          type: [array, "null"]
          description: On a single exchange only, newest first. When it was recorded, each change of decision, and each change in what their page showed (first seen, turned nofollow, removed).
          items:
            type: object
            required: [event, to, at]
            properties:
              event: {type: string, enum: [recorded, decision, their_link]}
              from: {type: [string, "null"]}
              to: {type: string}
              detail: {type: [object, "null"]}
              at: {type: string, format: date-time}
        their_page_url: {type: [string, "null"], description: The page of theirs the exchange names.}
        our_target_url: {type: [string, "null"], description: The page of yours their link should point at.}
        their_target_url: {type: [string, "null"], description: The page of theirs your link should point at.}
        our_article_id: {type: [string, "null"], format: uuid, description: The article expected to carry your link.}
        their_link:
          type: object
          required: [state, source]
          properties:
            state:
              type: string
              enum: [unchecked, live, nofollow, missing, unreachable]
              description: "`nofollow` covers nofollow, sponsored and ugc. `unreachable` means the page could not be read; nothing else is concluded from it."
            source:
              type: string
              enum: [page_check, backlink_profile]
              description: "`page_check` when the exchange names a page and it was read; `backlink_profile` when it names none."
            page_url: {type: [string, "null"]}
            link_url: {type: [string, "null"], description: Where their link points.}
            anchor: {type: [string, "null"]}
            rel: {type: [string, "null"]}
            followed: {type: [boolean, "null"], description: Null when not established.}
            first_seen_at: {type: [string, "null"], format: date-time}
            lost_at: {type: [string, "null"], format: date-time}
            checked_at: {type: [string, "null"], format: date-time}
            page:
              type: [object, "null"]
              description: What their page is, from the last read. Null when the exchange names no page.
              properties:
                http_status: {type: [integer, "null"]}
                title: {type: [string, "null"]}
                noindex: {type: [boolean, "null"], description: True when the page is hidden from search engines, so its link counts for nothing.}
                outbound_domains: {type: [integer, "null"], description: Distinct other sites the page links to.}
        our_link:
          type: object
          required: [state, links, articles, sample]
          properties:
            state: {type: string, enum: [live, missing]}
            links: {type: integer}
            articles: {type: integer, description: Published articles that link to the partner.}
            followed: {type: [boolean, "null"], description: True when at least one of your links to the partner is followed. Null when you have none.}
            points_at_their_target: {type: [boolean, "null"], description: Null when the exchange names no `their_target_url`.}
            expected_article_has_link: {type: [boolean, "null"], description: Null when the exchange names no `our_article_id`.}
            sample:
              type: array
              description: Up to 10 of the links.
              items:
                type: object
                properties:
                  article_id: {type: string, format: uuid}
                  title: {type: [string, "null"]}
                  slug: {type: [string, "null"]}
                  anchor: {type: [string, "null"]}
                  target_url: {type: [string, "null"]}
                  is_broken: {type: boolean}
        own_domain: {type: [string, "null"], description: On a single exchange only.}
        external_link_default: {type: string, enum: [follow, nofollow], description: On a single exchange only. See `LinkExchangeList`.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    LinkExchangeChecked:
      allOf:
        - { $ref: "#/components/schemas/LinkExchange" }
        - type: object
          required: [page_checked]
          properties:
            page_checked: {type: boolean, description: False when the exchange names no page to read.}

    LinkExchangeList:
      type: object
      required: [attention, items]
      properties:
        own_domain: {type: [string, "null"]}
        external_link_default:
          type: string
          enum: [follow, nofollow]
          description: What a link of yours to another site gets unless the link says otherwise (`external_link_rel` in the Site settings).
        attention: {type: integer, description: How many exchanges need attention, before any filter.}
        items:
          type: array
          items: { $ref: "#/components/schemas/LinkExchange" }

    LinkExchangeCreate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        partner_domain:
          type: string
          maxLength: 253
          description: A bare hostname such as `example.com`. Optional when `their_page_url` is given.
        their_page_url:
          type: [string, "null"]
          format: uri
          maxLength: 2000
          description: The page of theirs that links, or will link, to you. Read at once, and every week after.
        our_target_url: {type: [string, "null"], format: uri, maxLength: 2000, description: The page of yours their link should point at.}
        their_target_url: {type: [string, "null"], format: uri, maxLength: 2000, description: The page of theirs you link to.}
        our_article_id: {type: [string, "null"], format: uuid, description: The article expected to carry your link.}
        status: {type: string, enum: [proposed, agreed, declined, ended], default: proposed}
        kind: {type: string, enum: [swap, guest_post, paid, other], default: swap}
        contact: {type: [string, "null"], maxLength: 200, description: Who offered it (a name, an address, a handle).}
        note: {type: [string, "null"], maxLength: 2000}

    LinkExchangeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        partner_domain: {type: string, maxLength: 253}
        their_page_url: {type: [string, "null"], format: uri, maxLength: 2000}
        our_target_url: {type: [string, "null"], format: uri, maxLength: 2000}
        their_target_url: {type: [string, "null"], format: uri, maxLength: 2000}
        our_article_id: {type: [string, "null"], format: uuid}
        status: {type: string, enum: [proposed, agreed, declined, ended]}
        kind: {type: string, enum: [swap, guest_post, paid, other]}
        contact: {type: [string, "null"], maxLength: 200}
        note: {type: [string, "null"], maxLength: 2000}

    LinkProspectInspect:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: {type: string, format: uri, maxLength: 2000, description: The page they offered, as a full URL.}

    LinkProspectReport:
      type: object
      required: [url, domain, reachable, links_to_you, you_link_to_them, on_disavow_list, flags, not_measured]
      properties:
        url: {type: string}
        domain: {type: string}
        reachable: {type: boolean, description: False when the page could not be read; the page facts are then null.}
        http_status: {type: [integer, "null"]}
        title: {type: [string, "null"]}
        noindex: {type: [boolean, "null"]}
        outbound_links: {type: [integer, "null"]}
        outbound_domains: {type: [integer, "null"], description: Distinct other sites the page links to.}
        links_to_you:
          type: array
          items:
            type: object
            properties:
              url: {type: string}
              anchor: {type: [string, "null"]}
              followed: {type: boolean}
              rel: {type: string}
        you_link_to_them:
          type: object
          properties:
            links: {type: integer}
            articles: {type: integer}
        known_backlinks: {type: [integer, "null"], description: Live links from this site in the backlink profile. Null when the Site has no backlink data.}
        on_disavow_list: {type: boolean}
        exchange_id: {type: [string, "null"], format: uuid, description: An exchange already recorded with this site.}
        opportunity_id: {type: [string, "null"], format: uuid, description: This site on the link opportunities board.}
        flags:
          type: array
          description: "Any of `page_unreadable`, `page_noindex`, `many_outbound_sites`, `already_links_to_you`, `links_to_you_nofollow`, `you_already_link_to_them`, `on_disavow_list`."
          items: {type: string}
        not_measured:
          type: array
          description: What this does not tell you, because it needs a paid link index.
          items: {type: string}

    ArticleLinks:
      type: object
      required: [external_link_default, limit, offset, total, counts, links]
      properties:
        external_link_default:
          type: string
          enum: [follow, nofollow]
          description: The Site's setting for links to other sites.
        limit: {type: integer}
        offset: {type: integer}
        total: {type: integer, description: How many links match the filters.}
        counts:
          type: object
          description: The whole Site, whatever the filters.
          properties:
            links: {type: integer}
            internal: {type: integer}
            external: {type: integer}
            broken: {type: integer}
            unchecked: {type: integer}
            nofollow: {type: integer, description: Links that are not followed (nofollow, sponsored or ugc).}
            internal_nofollow: {type: integer, description: Links between the Site's own pages that somebody set to not followed.}
        links:
          type: array
          items:
            type: object
            required: [id, type, status, follow, source]
            properties:
              id: {type: string, format: uuid}
              type: {type: string, enum: [internal, external]}
              status: {type: string, enum: [ok, unpublished, missing, page, unreachable, unchecked]}
              follow: {type: string, enum: [followed, nofollow, sponsored, ugc]}
              follow_source: {type: string, enum: [link, own_site, site_default]}
              anchor: {type: [string, "null"]}
              target_url: {type: [string, "null"]}
              target_domain: {type: [string, "null"], description: External links only.}
              source:
                type: object
                properties:
                  article_id: {type: string, format: uuid}
                  title: {type: [string, "null"]}
                  slug: {type: [string, "null"]}
              target:
                type: [object, "null"]
                description: The article an internal link resolves to.
                properties:
                  article_id: {type: string, format: uuid}
                  title: {type: [string, "null"]}
                  slug: {type: [string, "null"]}
                  status: {type: string}
              http_status: {type: [integer, "null"], description: External links only. Null when not checked yet.}
              http_checked_at: {type: [string, "null"], format: date-time}
              checked_at: {type: string, format: date-time, description: When the article's links were last read.}

    OutboundLinkDomains:
      type: object
      required: [backlink_data, total_domains, total_links, domains]
      properties:
        own_domain: {type: [string, "null"]}
        backlink_data: {type: boolean, description: False when the Site has no backlink data, so `links_back` cannot be answered.}
        total_domains: {type: integer}
        total_links: {type: integer}
        reciprocal_domains: {type: [integer, "null"]}
        domains:
          type: array
          items:
            type: object
            required: [domain, links, articles, broken_links]
            properties:
              domain: {type: string}
              links: {type: integer}
              articles: {type: integer}
              broken_links: {type: integer}
              links_back: {type: [integer, "null"], description: Null when not measured.}
              exchange_id: {type: [string, "null"], format: uuid}

    OutboundLinks:
      type: object
      required: [domain, links]
      properties:
        domain: {type: string}
        links:
          type: array
          items:
            type: object
            properties:
              article_id: {type: string, format: uuid}
              title: {type: [string, "null"]}
              slug: {type: [string, "null"]}
              anchor: {type: [string, "null"]}
              target_url: {type: [string, "null"]}
              is_broken: {type: boolean}
              http_status: {type: [integer, "null"]}
              http_checked_at: {type: [string, "null"], format: date-time}

    Mailbox:
      type: object
      description: The customer's own outreach mailbox. Server names and credentials are never returned.
      required: [id, email_address, status, daily_cap, reply_detection]
      properties:
        id: {type: string, format: uuid}
        email_address: {type: string}
        provider: {type: string}
        status: {type: string, enum: [pending, connected, failed, disabled]}
        from_name: {type: [string, "null"]}
        daily_cap: {type: integer}
        sent_today: {type: integer}
        sent_today_date: {type: [string, "null"], format: date}
        send_window_start:
          type: [string, "null"]
          pattern: ^[0-2][0-9]:00$
          description: The hour sending starts, as `HH:00`, in the mailbox's timezone.
        send_window_end:
          type: [string, "null"]
          pattern: ^[0-2][0-9]:00$
          description: The hour sending stops, as `HH:00`.
        timezone: {type: [string, "null"]}
        last_verified_at: {type: [string, "null"], format: date-time}
        last_error: {type: [string, "null"]}
        last_poll_ok_at: {type: [string, "null"], format: date-time}
        reply_detection:
          type: boolean
          description: False means replies cannot be read, so only the first step of a campaign is sent.
        created_at: {type: string, format: date-time}

    OutreachReadiness:
      type: object
      required: [aup_accepted_at, kyc_passed_at, suspended_at, entitled, mailbox, counts, next_steps]
      properties:
        aup_accepted_at: {type: [string, "null"], format: date-time}
        kyc_passed_at: {type: [string, "null"], format: date-time}
        suspended_at: {type: [string, "null"], format: date-time}
        entitled: {type: boolean}
        monthly_allowance: {type: [integer, "null"]}
        sent_this_month: {type: integer}
        mailbox:
          oneOf:
            - { $ref: "#/components/schemas/Mailbox" }
            - {type: "null"}
        counts:
          type: object
          properties:
            contacts: {type: integer}
            campaigns: {type: integer}
            active_campaigns: {type: integer}
            threads: {type: integer}
            replied: {type: integer}
            won: {type: integer}
            suppressed: {type: integer}
        next_steps:
          type: array
          items: {type: string}
          description: What a person does next, as sentences with the dashboard link.

    OutreachContact:
      type: object
      description: A person found for outreach. Personal data.
      required: [id, source_domain, email, provenance]
      properties:
        id: {type: string, format: uuid}
        source_domain: {type: string}
        email: {type: string}
        name: {type: [string, "null"]}
        role: {type: [string, "null"]}
        provenance: {type: string, description: How the address was found.}
        provenance_detail: {type: [string, "null"], description: The exact page it was found on.}
        confidence: {type: [number, "null"]}
        unsubscribed_at: {type: [string, "null"], format: date-time}
        bounced_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}

    OutreachCampaign:
      type: object
      required: [id, name, status, steps]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [draft, active, paused, done]}
        mailbox_id: {type: [string, "null"], format: uuid}
        daily_cap: {type: integer}
        unsubscribe_enabled: {type: boolean}
        has_physical_address:
          type: boolean
          description: Whether the postal address the law requires is set. The address itself is not returned.
        created_at: {type: string, format: date-time}
        steps:
          type: array
          items:
            type: object
            properties:
              step_no: {type: integer}
              delay_days: {type: integer}
              subject_template: {type: string}

    OutreachThread:
      type: object
      description: One contact in one campaign. Personal data.
      required: [id, campaign_id, contact_id, status, current_step]
      properties:
        id: {type: string, format: uuid}
        campaign_id: {type: string, format: uuid}
        contact_id: {type: string, format: uuid}
        contact_email: {type: string}
        status: {type: string, enum: [queued, sent, replied, bounced, unsubscribed, won, failed]}
        current_step: {type: integer}
        next_send_at:
          type: [string, "null"]
          format: date-time
          description: Null once nothing more will be sent, for example after a reply.
        replied_at: {type: [string, "null"], format: date-time}
        link_verified_at: {type: [string, "null"], format: date-time}
        link_url: {type: [string, "null"]}
        last_error: {type: [string, "null"]}
        created_at: {type: string, format: date-time}

    TeamMember:
      type: object
      required: [user_id, email, role, is_you]
      properties:
        user_id: {type: string, format: uuid}
        email: {type: string}
        full_name: {type: [string, "null"]}
        role: {type: string, enum: [owner, admin, editor, viewer]}
        created_at: {type: string, format: date-time}
        is_you: {type: boolean, description: True for the person this key acts for.}

    TeamMemberDetail:
      description: A member, with the live API keys that would block removing them.
      allOf:
        - { $ref: "#/components/schemas/TeamMember" }
        - type: object
          required: [live_api_keys]
          properties:
            live_api_keys:
              type: array
              items:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string}
                  key_prefix: {type: string}
                  kind: { $ref: "#/components/schemas/KeyKind" }
                  website_name: {type: [string, "null"]}

    MemberRoleUpdate:
      type: object
      description: '`owner` is not a value: ownership changes hands only in the dashboard.'
      required: [role]
      additionalProperties: false
      properties:
        role: {type: string, enum: [admin, editor, viewer]}

    MemberAccess:
      type: object
      required: [user_id, role, permissions]
      properties:
        user_id: {type: string, format: uuid}
        role: {type: string, enum: [owner, admin, editor, viewer]}
        permissions:
          type: array
          items:
            type: object
            required: [permission_key, granted, source]
            properties:
              permission_key: {type: string}
              label: {type: string}
              category: {type: string}
              protected: {type: boolean}
              granted: {type: boolean}
              source: {type: string, enum: [override, role_override, platform_default]}

    MemberPermissionChanges:
      type: object
      description: Up to 20 changes, one per permission, applied all or nothing.
      required: [changes]
      additionalProperties: false
      properties:
        changes:
          type: array
          items:
            type: object
            required: [permission_key, effect]
            additionalProperties: false
            properties:
              permission_key: {type: string}
              effect:
                type: [string, "null"]
                enum: [grant, revoke, null]
                description: '`grant` or `revoke` sets an override; null clears it.'
          minItems: 1
          maxItems: 20

    Invite:
      type: object
      required: [id, email, role, expires_at, status]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        role: {type: string, enum: [admin, editor, viewer]}
        invited_by: {type: [string, "null"], format: uuid}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        status: {type: string, enum: [pending, expired]}

    InviteCreate:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
        role: {type: string, enum: [admin, editor, viewer]}

    InviteCreated:
      type: object
      required: [invite]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        accept_url:
          type: string
          format: uri
          description: The single-use link the invitee opens, scoped to this Site (`site=<id>`). Shown once; not included in an idempotent replay.

    RoleEntry:
      type: object
      required: [role, permissions]
      properties:
        role: {type: string, enum: [admin, editor, viewer]}
        permissions:
          type: array
          items:
            type: object
            required: [permission_key, granted, source]
            properties:
              permission_key: {type: string}
              label: {type: string}
              category: {type: string}
              protected: {type: boolean}
              min_assignable_role: {type: string}
              granted: {type: boolean}
              source: {type: string, enum: [role_override, platform_default]}

    RoleMatrix:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleEntry" }

    RolePermissionChanges:
      type: object
      required: [changes]
      additionalProperties: false
      properties:
        changes:
          type: array
          items:
            type: object
            required: [permission_key, granted]
            additionalProperties: false
            properties:
              permission_key: {type: string}
              granted:
                type: [boolean, "null"]
                description: true grants, false revokes, null resets to the platform default.
          minItems: 1
          maxItems: 20

    PermissionCatalogEntry:
      type: object
      required: [key, label, category, protected]
      properties:
        key: {type: string}
        label: {type: string}
        description: {type: [string, "null"]}
        category: {type: string}
        min_assignable_role: {type: string}
        protected: {type: boolean}

    Autorefill:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
        threshold_credits: {type: [number, "null"]}
        pack_key: {type: [string, "null"]}
        monthly_ceiling_usd: {type: [number, "null"]}
        period_spent_usd: {type: [number, "null"]}

    AutorefillUpdate:
      type: object
      description: Turning it on needs `pack_key` and `monthly_ceiling_usd`.
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        threshold_credits: {type: number, minimum: 0}
        pack_key: {type: string, description: From `GET /billing/credit-packs`.}
        monthly_ceiling_usd: {type: number, minimum: 1, maximum: 10000}

    SiteCreditCap:
      type: object
      required: [monthly_credit_cap, period_spent]
      properties:
        monthly_credit_cap:
          type: [number, "null"]
          description: Null means uncapped. Zero means this Site may not spend.
        period_spent: {type: number}
        period_start: {type: [string, "null"], format: date}

    SiteCreditCapUpdate:
      type: object
      required: [monthly_credit_cap]
      additionalProperties: false
      properties:
        monthly_credit_cap: {type: [number, "null"], minimum: 0, description: Null removes the cap.}

    BillingSummary:
      type: object
      required:
        - plan
        - organisation_status
        - has_payment_method
        - credits
        - scheduled_change
        - cms_overage
        - autorefill
        - site_credit_cap
        - allowances
      properties:
        plan:
          type: object
          required: [key, name]
          properties:
            key: {type: string}
            name: {type: string}
        organisation_status: {type: string}
        has_payment_method: {type: boolean}
        credits:
          type: object
          required: [balance]
          properties:
            balance: {type: number}
            monthly: {type: [number, "null"]}
            usd_balance: {type: [number, "null"]}
        scheduled_change:
          type: [object, "null"]
          properties:
            plan_key: {type: string}
            effective_at: {type: string, format: date-time}
        cms_overage:
          type: object
          description: Pay-as-you-go CMS usage past the included allowance this period, estimated so far.
          properties:
            period_start: {type: string, format: date}
            period_end: {type: string, format: date}
            total_usd: {type: number}
            lines:
              type: array
              items:
                type: object
                properties:
                  resource_key: {type: string}
                  billable_units: {type: number}
                  unit_price_usd: {type: number}
                  amount_usd: {type: number}
        autorefill:
          oneOf:
            - { $ref: "#/components/schemas/Autorefill" }
            - {type: "null"}
        site_credit_cap: { $ref: "#/components/schemas/SiteCreditCap" }
        allowances:
          type: array
          items:
            type: object
            required: [key, product, is_payg]
            properties:
              key: {type: string}
              product: {type: string, enum: [cms, pipeline]}
              label: {type: string}
              value: {type: [number, "null"], description: Null means unlimited.}
              used:
                type: [number, "null"]
                description: Null means it cannot be measured yet, which is not zero.
              unit: {type: [string, "null"]}
              is_payg:
                type: boolean
                description: 'True for a CMS allowance: going past it bills, it never blocks.'

    Invoice:
      type: object
      required: [id, date, kind, amount_cents, currency, status]
      properties:
        id: {type: string}
        date: {type: string, format: date-time}
        kind: {type: string}
        plan_key: {type: [string, "null"]}
        description: {type: [string, "null"]}
        number: {type: [string, "null"]}
        amount_cents: {type: integer}
        currency: {type: string}
        status: {type: string}
        period_start: {type: [string, "null"], format: date-time}
        period_end: {type: [string, "null"], format: date-time}
        hosted_invoice_url:
          type: [string, "null"]
          format: uri
          description: A private link to the invoice. Show it only to the person.
        invoice_pdf:
          type: [string, "null"]
          format: uri
          description: A private link to the PDF. Show it only to the person.
        reversal: {type: [object, "null"]}

    InvoicePage:
      type: object
      required: [rows, has_more, next_cursor, stale]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }
        has_more: {type: boolean}
        next_cursor: {type: [string, "null"]}
        stale:
          type: boolean
          description: True when Writavo's copy of the billing history has not been refreshed recently.

    CreditPack:
      type: object
      required: [key, label, credits, usd_price, is_active]
      properties:
        key: {type: string}
        label: {type: string}
        credits: {type: number}
        usd_price: {type: number}
        is_active: {type: boolean}

    CreditCheckout:
      type: object
      required: [checkout_url, pack, next_step]
      properties:
        checkout_url:
          type: string
          format: uri
          description: Stripe's hosted page. The person pays there; shown once.
        pack: { $ref: "#/components/schemas/CreditPack" }
        next_step: {type: string}

    BalancePurchase:
      type: object
      required: [pack, credits, usd_spent, usd_balance, credit_balance]
      properties:
        pack: { $ref: "#/components/schemas/CreditPack" }
        credits: {type: number, description: Credits added.}
        usd_spent: {type: number, description: US dollars taken from the account balance.}
        usd_balance: {type: number, description: The account balance in US dollars after the purchase.}
        credit_balance: {type: number, description: The credit balance after the purchase.}

    WalletTopupRequest:
      type: object
      required: [amount_usd]
      additionalProperties: false
      properties:
        amount_usd:
          type: number
          minimum: 10
          maximum: 2000
          description: US dollars to add, 10 to 2000, to the cent.

    WalletCheckout:
      type: object
      required: [checkout_url, amount_usd, next_step]
      properties:
        checkout_url:
          type: string
          format: uri
          description: Stripe's hosted page. The person pays there within 30 minutes; shown once.
        amount_usd: {type: number, description: What will be added to the balance once the person pays.}
        next_step: {type: string}

    BillingActivityItem:
      type: object
      required: [id, created_at, unit, amount, flow, source, label]
      properties:
        id: {type: integer, description: Increases over time; the paging cursor.}
        created_at: {type: string, format: date-time}
        unit:
          type: string
          enum: [credit, usd]
          description: Which balance moved, credits or US dollars.
        amount:
          type: number
          description: Signed. Positive came in, negative went out.
        balance_after: {type: [number, "null"], description: That balance after this row.}
        flow: {type: string, enum: [in, out]}
        source:
          type: string
          enum: [plan, welcome, card_purchase, auto_refill, balance_purchase, top_up, company_grant, usage, cms_usage, expiry, refund, reversal, company_adjustment, other]
          description: |
            Where the movement came from. `plan` monthly plan credits; `welcome` welcome credits;
            `card_purchase` a credit pack bought by card; `auto_refill` a pack bought by auto-refill;
            `balance_purchase` a pack bought with the account balance (both of its rows); `top_up` funds
            added by card; `company_grant` credits or funds given by Writavo; `usage` credits spent;
            `cms_usage` CMS pay-as-you-go usage paid from the balance; `expiry` unused plan credits
            expired; `refund` a refund; `reversal` removed after a refund or card dispute;
            `company_adjustment` a correction by Writavo.
        method:
          type: [string, "null"]
          enum: [card, balance, writavo, automatic, null]
          description: How it was paid, when that applies.
        label: {type: string, description: A short description a person can read.}
        quantity: {type: [number, "null"], description: Units of the action, for credit usage.}
        customer_note: {type: [string, "null"], description: A note Writavo left for the customer, if any.}
        website_id: {type: [string, "null"], format: uuid, description: The Site the movement belongs to, when it belongs to one.}
        linked_id:
          type: [integer, "null"]
          description: For a pack bought with the balance, the `id` of the other half (the USD row for the credit row, and back).

    BillingActivityPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BillingActivityItem" }
        next_cursor:
          type: [string, "null"]
          description: Pass as `before` for the next page. Null on the last page.

    BillingLinks:
      type: object
      description: Dashboard pages a person opens, each carrying `site=<site id>` so the dashboard opens on this Site. No payment session is ever created here.
      required: [plan_change, payment_method, invoices_portal]
      properties:
        plan_change: {type: string, format: uri}
        payment_method: {type: string, format: uri}
        invoices_portal: {type: string, format: uri}

    ScheduledChangeReleased:
      type: object
      required: [released]
      properties:
        released: {type: boolean, description: False when nothing was scheduled.}

    SiteOverview:
      type: object
      required: [rollup_30d, article_status_counts, today, recent_runs]
      properties:
        rollup_30d:
          type: object
          properties:
            articles_generated: {type: number}
            articles_published: {type: number}
            images_generated: {type: number}
            reads_cached: {type: number}
            reads_direct: {type: number}
            api_cost_usd: {type: number}
            api_calls_count: {type: number}
            api_errors_count: {type: number}
        article_status_counts:
          type: object
          additionalProperties: {type: integer}
          description: Articles per status.
        today:
          type: object
          properties:
            articles_published: {type: integer}
        recent_runs:
          type: array
          items: { $ref: "#/components/schemas/PipelineRun" }
          maxItems: 5

    SiteCosts:
      type: object
      required: [from, to, total_usd, by_stage, by_provider]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        total_usd: {type: number}
        by_stage:
          type: array
          items:
            type: object
            properties:
              stage: {type: string}
              cost_usd: {type: number}
              calls: {type: integer}
              errors: {type: integer}
        by_provider:
          type: array
          items:
            type: object
            properties:
              provider: {type: string}
              cost_usd: {type: number}
              calls: {type: integer}

    ArticleCosts:
      type: object
      required: [article_id, total_usd, by_stage, by_provider, imported_total_usd, imported]
      properties:
        article_id: {type: string, format: uuid}
        total_usd: {type: number, description: "Writavo's own measured cost for this article."}
        by_stage:
          type: array
          items:
            type: object
            properties:
              stage: {type: string}
              cost_usd: {type: number}
              calls: {type: integer}
              errors: {type: integer}
              tokens: {type: [integer, "null"]}
        by_provider:
          type: array
          items:
            type: object
            properties:
              provider: {type: string}
              cost_usd: {type: number}
              calls: {type: integer}
        imported_total_usd:
          type: number
          description: |
            The sum of `imported`: what the article cost in the system it was imported from. Display
            only; never part of `total_usd`. 0 when there is none.
        imported:
          type: array
          description: The imported production cost entries, in the order they were recorded.
          items: { $ref: "#/components/schemas/ArticleCostEntry" }

    ArticleCostEntry:
      type: object
      required: [stage, provider, cost_usd, calls, tokens, occurred_on, description]
      properties:
        stage: {type: [string, "null"], description: "A free label, e.g. research, generate, images."}
        provider: {type: [string, "null"]}
        cost_usd: {type: number}
        calls: {type: [integer, "null"]}
        tokens: {type: [integer, "null"]}
        occurred_on: {type: [string, "null"], format: date}
        description: {type: [string, "null"]}

    TaxonomyCounts:
      type: object
      required: [categories, tags, authors]
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              slug: {type: string}
              article_count: {type: integer}
        tags:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              slug: {type: string}
              article_count: {type: integer}
        authors:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              article_count: {type: integer}

    FunctionLogEntry:
      type: object
      required: [id, function_name, level, message, created_at]
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: A numeric id, returned as a string of digits.
        function_name: {type: string}
        level: {type: string, enum: [info, warn, error]}
        message: {type: string, description: The log line. An empty string when the line had no message.}
        created_at: {type: string, format: date-time}

    AuditLogEntry:
      type: object
      required: [id, action, created_at]
      properties:
        id: {type: string, format: uuid}
        action: {type: string}
        target_type: {type: [string, "null"]}
        target_id: {type: [string, "null"]}
        actor_user_id: {type: [string, "null"], format: uuid}
        actor_email:
          type: [string, "null"]
          description: Filled only while the actor is a member of the organisation; null otherwise.
        actor_api_key_id: {type: [string, "null"], format: uuid}
        before: {type: [object, "null"]}
        after: {type: [object, "null"]}
        created_at: {type: string, format: date-time}

    AgentCall:
      type: object
      required: [id, api_key_id, method, status, created_at]
      properties:
        id: {type: string, format: uuid}
        api_key_id: {type: [string, "null"], format: uuid, description: Null once the key has been deleted.}
        client_name: {type: [string, "null"]}
        tool: {type: [string, "null"]}
        operation_id: {type: [string, "null"]}
        method: {type: string}
        status: {type: integer, description: The HTTP status the call got.}
        duration_ms: {type: [integer, "null"]}
        approval_id: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}

  responses:
    BadRequest:
      description: |
        `INVALID_REQUEST`. The request could not be parsed, or a parameter is not usable: bad
        JSON, an unknown query parameter value, or a missing required header.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    Unauthorized:
      description: |
        `INVALID_API_KEY`, `API_KEY_REVOKED` or `API_KEY_EXPIRED`. There is no key, or it is not
        usable. This response never distinguishes "no such key" from "wrong key", so a caller
        cannot probe for valid keys.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    PaymentRequired:
      description: |
        `NOT_ENTITLED`, `INSUFFICIENT_CREDITS` or `SPEND_CAP_REACHED`. The request was
        understood and you were permitted to make it, but it cannot be paid for. Three distinct
        codes because the fixes differ: upgrade the plan, top up credits, or raise the Site's
        cap.

        These are 402 rather than 403 on purpose. A 403 says "you may not"; these all say "not
        yet, and here is how to change that".
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    InsufficientScope:
      description: |
        `INSUFFICIENT_SCOPE`. The key is valid but does not carry the scope this operation
        requires, or its creator's permissions no longer cover it.

        It is never returned for an object belonging to another Site: that case is always 404, so
        this response never reveals that something exists.

        For a key an AI agent holds, a 403 may also be `AGENT_ACCESS_DISABLED` (the organisation
        turned agent access off) or `APPROVAL_DENIED` (a person denied this action). Neither is
        about scope, and neither reveals anything about another Site.

        On the organisation, team and settings operations a 403 may also be `FORBIDDEN`: a change
        no scope allows, such as an AI agent changing the access of the person it acts for,
        anything to do with ownership, or a setting only a person may change. The message says
        what to do instead.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    Forbidden:
      description: |
        `FORBIDDEN`, or `INSUFFICIENT_SCOPE` for a publishable key. Refused for a reason that no
        scope would change; the message says which and what to do instead.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    ApprovalRequired:
      description: |
        `APPROVAL_REQUIRED` or `APPROVAL_PENDING`. Only ever returned to an AI agent: a key from a
        device or OAuth sign-in, or any request an MCP client makes (it carries `Writavo-Mcp-Tool`)
        whatever key it holds. For an operation marked `x-writavo-approval-always` it is returned
        whatever the organisation's approvals switch says, and for the six content actions while
        approvals are on. Nothing has happened
        yet. Show `error.approval.url` to a person; once they approve, repeat the identical request with
        `Writavo-Approval: <error.approval.id>`. Do not change the body or the path: the approval
        is bound to the exact request, and a different one is `409 APPROVAL_INVALID`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    NotFound:
      description: |
        `NOT_FOUND`. Either no such object exists, or it exists and belongs to a different Site.

        **These two cases are deliberately indistinguishable, and neither ever returns 403.** A
        403 would confirm the object exists, which would let anyone with a valid key enumerate
        other customers' content by id. If you are certain the id is right, check you are using
        the key for the correct Site.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    Conflict:
      description: |
        `SLUG_CONFLICT`, `IDEMPOTENCY_KEY_CONFLICT`, `IDEMPOTENCY_KEY_IN_FLIGHT` or `CONFLICT`.
        The request is valid but collides with the current state: a slug is taken, an
        idempotency key was reused with a different body or is still in flight, or the object
        moved while you were working on it. Read `code` to tell which, then re-read and retry.

        On an approval-gated operation it may also be `APPROVAL_INVALID`: the `Writavo-Approval`
        you sent is expired, used, for a different request, unknown, or what the request would do
        has changed since it was approved. Retry without it to ask for a new approval.

        On a settings, delivery or SEO operation it may be `PREREQUISITE_MISSING` (something the
        operation needs is not set up; the message names the operation that sets it up) or
        `FEATURE_UNAVAILABLE` (Writavo has the capability switched off; the message names the
        free alternative). Neither did anything or charged anything.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    PreconditionFailed:
      description: |
        `PRECONDITION_FAILED`. Your `If-Match` did not match the current version, meaning
        somebody edited the object since you read it. Nothing was written. Re-read, merge, and
        retry with the new `ETag`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    ValidationFailed:
      description: |
        `VALIDATION_FAILED`. The request parsed but the values are not acceptable. `error.fields`
        maps each offending field to a message you can put next to the input.

        Common causes: publishing without a title, slug or content; scheduling in the past; and
        sending `status` on a create or update, which is how the API refuses to let a client
        push content into the AI pipeline.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    RateLimited:
      description: |
        `RATE_LIMIT_EXCEEDED`. Back off and honour `Retry-After`.

        Limits are per key, per minute, by endpoint class. Writes are limited harder than reads
        because they cost more to serve, and pipeline runs hardest of all because they cost real
        money, as do the paid SEO scans and the other operations that do expensive work. The two
        device sign-in endpoints take no key, so they are limited per IP address instead.

        | Class | Endpoints | Limit |
        |---|---|---|
        | read | every GET | 600 per minute |
        | write | POST, PATCH and DELETE on content, taxonomy, keys, webhooks, the content plan, formats and prompts, settings, delivery, SEO curation, the team and billing | 120 per minute |
        | upload | `POST /media/upload-url` and `POST /seo/backlinks/import` | 60 per minute |
        | pipeline | `POST /pipeline/runs`, `POST /pipeline/articles/{id}/requeue`, `POST /delivery/cms/push` and the seven paid SEO scans | 10 per minute |
        | auth | `POST /auth/device` and `POST /auth/device/token`, per IP address | 60 per minute |

        Every response carries `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`,
        so you can slow down before you are refused rather than after.
      headers:
        RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    Maintenance:
      description: |
        `MAINTENANCE`. Writes are paused, either platform wide or for your Site. Reads usually
        keep working, and your published blog is served from cache and stays up. Retry after the
        window given in `Retry-After`.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    InternalError:
      description: |
        `INTERNAL_ERROR`. Something failed on our side. The message is deliberately generic; the
        detail is in our logs against the `request_id` in the body, so quote it if you contact
        support.

        Safe to retry, and safer still with the same `Idempotency-Key`, which guarantees you do
        not create a second object if the first request actually succeeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
