    post:
      operationId: submitComment
      tags: [Comments]
      summary: Submit a reader's comment
      description: |
        For a site that renders its articles itself: post a reader's comment from your own server
        (never from the browser: this needs a secret key). Send the reader's IP as `reader_ip` so the
        per-reader limit applies to the reader and not to your server; it is stored only as a hash
        under a salt that changes daily. Plain text only; one level of replies (a reply to a reply
        joins the same thread).

        Whether it is published at once depends on the Site's `moderation` setting (`status` in the
        answer: `approved` or `pending`). The same comment sent twice within a day returns the first
        one with `duplicate: true` instead of a second copy. Fires the `comment.created` webhook.

        `404` when comments are off on the Site, the slug is not a published article, or `parent_id`
