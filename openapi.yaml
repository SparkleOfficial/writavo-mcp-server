  # ==========================================================================
  # ANALYTICS (0159)
  # ==========================================================================
  /analytics/setup:
    get:
      operationId: getAnalyticsSetup
      tags: [Analytics]
      summary: Read the analytics setup and install status
      description: |
        Everything needed to install visitor analytics and confirm it works: the Site's public
        `site_id`, the ready-made `snippet` to paste inside `<head>` on every page that shows your
        articles, whether collecting is on, the domains whose visits count (`allowed_domains`: the
        primary domain and its subdomains, verified custom domains, reverse-proxy targets and your
        `extra_domains`), and `install`: when the last event arrived and from which page, how many
        arrived in the last 24 hours, and the hosts whose visits were turned away because they are
        not on the list.

        The snippet always points at the public collector (`collector_origin`,
        `https://blog.writavo.com` in production), never at a development address. Hosted Writavo
        blogs carry it automatically. To check a page, use `POST /analytics/install-check`.
      x-scope: insights:read
      x-permission: analytics.view
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      responses:
        "200":
          description: The setup.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnalyticsSetup" }
              examples:
                installed:
                  summary: Installed and receiving visits
                  value:
                    ok: true
                    data:
                      site_id: wa_0123456789abcdef01234567
                      enabled: true
                      collector_origin: https://blog.writavo.com
                      script_url: https://blog.writavo.com/api/a/s
                      snippet: '<script defer src="https://blog.writavo.com/api/a/s" data-site="wa_0123456789abcdef01234567"></script>'
                      extra_domains: [docs.example.com]
                      allowed_domains:
                        - { domain: example.com, source: primary_domain, subdomains: true }
                        - { domain: docs.example.com, source: extra_domain, subdomains: true }
                      install:
                        last_event_at: "2026-10-04T09:12:44.512+00:00"
                        last_event_host: example.com
                        last_event_path: /blog/how-to-choose-a-headless-cms
                        events_24h: 318
                        rejected_hosts:
                          - { hostname: staging.example.net, hits: 12, last_seen_at: "2026-10-04T08:55:02+00:00" }
                      docs_url: https://writavo.com/docs/analytics
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /analytics/settings:
    patch:
      operationId: updateAnalyticsSettings
      tags: [Analytics]
      summary: Turn analytics on or off, or change the extra domains
      description: |
        Send `enabled`, `extra_domains`, or both. `extra_domains` replaces the whole list (up to 20)
        and each one also counts its subdomains: add every domain the script runs on that is not
        already the Site's primary domain, a verified custom domain or a reverse-proxy target (an app
        on another domain, a staging host you want counted). A pasted URL is reduced to its host.
        While `enabled` is false every visit is dropped. Returns the same shape as
        `GET /analytics/setup`. Recorded in the audit log.
      x-scope: site:write
      x-permission: website.settings
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-agent-consequence: Changes whether the Site counts visits, and from which domains.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsSettingsUpdate" }
            examples:
              add_domain:
                summary: Count visits from a second domain too
                value: { extra_domains: [docs.example.com] }
      responses:
        "200":
          description: The setup after the change.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnalyticsSetup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
