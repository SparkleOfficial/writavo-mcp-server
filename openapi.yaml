      summary: Create a content type
      description: |
        Define one content type. An API id that already exists is `409 CONFLICT`; change it with
        `PATCH /content-types/{api_id}`. A definition with problems is `422 VALIDATION_FAILED`, with
        `error.fields` keyed by the path of each problem (for example `product.price.validation.min`).
