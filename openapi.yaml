  /media/bulk-delete:
    post:
      operationId: bulkDeleteMedia
      tags: [Media]
      summary: Delete many media assets
      description: |
        Deletes up to 500 files in one call: the catalog rows and the stored bytes, exactly as
        `DELETE /media/{id}` does for each (an audit entry and a `media.deleted` webhook per file).

        **Only unused files by default.** With `only_unused` left `true`, a file that anything on
        this Site still uses (an article in any status or one of its saved revisions, an author,
        the branding, an entry) is not deleted and is listed in `in_use`. `GET /media?unused=true`
        lists the candidates. Send `only_unused: false` to delete named files even though they are
        in use; articles are not rewritten, so each of those becomes a broken image.

        An id that names no file on this Site, whether it never existed or belongs to another Site,
        is listed in `not_found`. A repeated id counts once.

        **When an AI agent asks.** A key approved for an AI assistant (a device or OAuth sign-in),
        or any request from an MCP client, gets `428 APPROVAL_REQUIRED` on the first try while the
        organisation requires approvals, with `error.approval.url` for a person to approve or deny
        in the dashboard. ONE approval covers the whole list: the person sees how many files and
        their total size. Retry the same request with `Writavo-Approval: <error.approval.id>` once
        they have. The approval is for the exact files the call would delete when it was asked: if
        one of them has since come into use or been deleted, the retry is `409 APPROVAL_INVALID`
        and you ask again. When none of the ids is a file on this Site, no approval is asked for
        and the report comes back directly. Other callers are unaffected.
