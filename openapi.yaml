    post:
      operationId: createPlanItem
      tags: [Pipeline]
      summary: Add a topic to the content plan
      description: |
        Add a topic or keyword to the content plan, at `status: planned` and `source: manual`. The plan
        is what the pipeline writes from, highest `priority` first.

        While the pipeline is on, a planned topic is written (and spends credits) at the next tick,
        within the batch size and caps the person already approved when they turned the pipeline on.
        While it is off, nothing happens until it is turned on or a run is requested. To keep a topic
        without it being written, add it and then set it to `skipped`.

        `format_key` must be the key of an active format this Site can use (`GET /content-types`), or it
        is `422`.
      x-scope: plan:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-mcp-surface: action
