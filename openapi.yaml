        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /engagement/import:
    post:
      operationId: importEngagement
      tags: [Engagement]
      summary: Import engagement history
      description: |
        Bring a blog's engagement history to Writavo when it migrates: views, reactions and share
        clicks per article per day, and each reader's current reaction. Articles are matched by
        `external_id` or `slug` on this Site, in any status. Call it from a server with a secret key.

        **SET, never add.** A `daily` row replaces that article's counts for that day: each field
        you send (`views`, `reactions`, `shares`) replaces that field, a field you leave out keeps
        its stored value (0 on a new day), and `shares` replaces all four platforms (a platform you
        do not name becomes 0). A `reactions` row replaces that reader's current reaction on that
        article. Sending the same payload twice changes nothing, so a retried or repeated import can
        never double-count.

        **Which days.** Any UTC day from 1990-01-01 up to today, including days that already have
        live counts: the import replaces them. Today is for the day you cut over: the import sets
        the day's counts as they stood on the old system, and views and shares Writavo records
        after the import add to them. Sending today's row again sets it again, so send it once.
        `set_at` on a reaction may be any past instant.

        **Reactions.** Writavo keeps a per-day reaction TOTAL and, separately, one current reaction
        per reader (which is what the per-type counts are made of). A `daily` row's `reactions` may
        be a number or per-type counts, which are summed. An imported reader's reaction replaces a
        live one and moves the day totals like a live change does (one off the day the old reaction
        was made, one onto the day of `set_at`). Daily rows are applied after reactions, so a day
        whose total you send explicitly ends at exactly that number.

        **Dry run first.** `dry_run` defaults to true: every row is checked and matched, `posts`
        and `problems` are reported, and nothing is written. Send `dry_run: false` to write. A row
        with a problem is skipped and listed in `problems`; the valid rows are still written.

        Imported rows are marked as imported internally and count everywhere exactly like live
        engagement: the public counters, the dashboard and `GET /seo/engagement`. `visitor_id` is
        hashed with the Site's id before it is stored, the same way `POST /engagement/events` does,
        so a reader keeps their imported reaction when they come back. Each applied import is
        recorded in the audit log with its counts.
      x-scope: engagement:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-agent-consequence: Sets the imported articles' view, reaction and share counts for the days sent, replacing what was stored for those days.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngagementImportInput" }
            examples:
              dry_run:
                summary: Check two days and two readers' reactions, write nothing
                value:
                  daily:
                    - external_id: "blog:1"
                      day: "2026-05-10"
                      views: 120
                      reactions: { useful: 2, insightful: 1 }
                      shares: { x: 1, linkedin: 3 }
                    - slug: how-to-choose-a-headless-cms
                      day: "2026-05-11"
                      views: 87
                  reactions:
                    - external_id: "blog:1"
                      visitor_id: anon_7f3a9c
                      reaction: useful
                      set_at: "2026-05-10T14:03:00Z"
              apply:
                summary: Write the same rows
                value:
                  dry_run: false
                  daily:
                    - external_id: "blog:1"
                      day: "2026-05-10"
                      views: 120
                      reactions: 3
                      shares: { x: 1, linkedin: 3 }
      responses:
        "200":
          description: The report. With `dry_run` it describes what would be written.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/EngagementImportResult" }
              examples:
                applied:
                  summary: One article imported, one row skipped
                  value:
                    ok: true
                    data:
                      dry_run: false
                      written: { daily: 1, share_rows: 2, picks: 1 }
                      posts:
                        - slug: how-to-choose-a-headless-cms
                          external_id: "blog:1"
                          days: 1
                          views: 120
                          reactions: 3
                          shares: 4
                          picks: 1
                      problems:
                        - section: daily
                          index: 1
                          error: no article with this slug on this Site
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

