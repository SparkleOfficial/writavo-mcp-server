  /pipeline/articles/{id}/requeue:
    parameters:
      - $ref: "#/components/parameters/ArticleId"
    post:
      operationId: requeueArticle
      tags: [Pipeline]
      summary: Send an article back through the pipeline
      description: |
        Send a pipeline article back to a stage: `improve` (an AI rewrite, spends credits), `images` (new
        images, spends credits) or `publish` (queue it for its publishing slot, free). This is how a
        rejected, failed or reviewed article is moved on without the dashboard.

        | `to` | Allowed from | Becomes | Spends |
        |---|---|---|---|
        | `improve` | `generated`, `needs_improvement`, `rejected`, `failed` | `needs_improvement`, rewrite attempts reset | credits |
        | `images` | `generated`, `needs_improvement`, `needs_images`, `rejected`, `failed` (with content) | `needs_images` | credits |
        | `publish` | `generated`, `needs_improvement`, `needs_images`, `rejected` | `queued` | nothing |

        Any other status is `409 CONFLICT` naming it; a hand-written `draft` is published with
        `POST /articles/{id}/publish` instead. A `queued` article goes live at the next publishing slot
        while the pipeline is in `auto` mode, and waits for a person in `review` mode.

        `improve` needs the plan's AI generation and `images` its image generation (`402 NOT_ENTITLED`
        otherwise), and both check the organisation's status and the Site's daily spend cap
        (`402 SPEND_CAP_REACHED`) first. Credits are charged by the stage as it does the work.

        **When an AI agent asks.** A key from a device or OAuth sign-in, or any request from an MCP
        client, always gets `428 APPROVAL_REQUIRED` on the first try, whatever the organisation's
        approvals switch says, because it spends money or credits. Asked only for `to: improve` and `to:
        images`; `to: publish` is never asked. Give the person `error.approval.url`; once they approve,
        repeat the identical request with `Writavo-Approval: <error.approval.id>`. The approval is void
        if what the request would do changes before the retry. A key made in the dashboard is asked only
        when the request comes from an MCP client.
      x-scope: pipeline:run
      x-permission: pipeline.run
      x-entitlement: ai.article_generation
      x-spends-credits: true
      x-rate-limit-class: pipeline
      x-publishable: false
      x-writavo-approval: article.requeue
      x-writavo-approval-kind: money
      x-writavo-approval-always: true
      x-writavo-approval-when: 'Asked only for `to: improve` and `to: images`; `to: publish` is never asked.'
      x-agent-consequence: The AI rewrites the article or makes new images for it, spending the organisation's credits.
      x-cross-tenant: 404
      x-mcp-surface: action
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "#/components/parameters/WritavoApproval" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequeueRequest" }
      responses:
        "200":
          description: The article's new state.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ArticleLifecycleState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/ApprovalRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

