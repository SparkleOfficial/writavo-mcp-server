      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      responses:
        "200":
          description: The schedule was cancelled.
