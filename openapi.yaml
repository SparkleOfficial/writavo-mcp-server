        gave you its id): `pending`, `approved`, `denied`, `used` or `expired`. Only the key that
        asked can read it; any other id is `404`. Cheap and meant to be polled every few seconds
        while you wait, and it is not written to the Site's agent call log.

        When it reads `approved`, send the original request again, unchanged, with the
        `Writavo-Approval` header set to the id. The MCP server's `wait_for_approval` tool does
        the waiting for you.
      x-scope: meta:read
