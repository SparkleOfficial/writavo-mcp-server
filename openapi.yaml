openapi: 3.1.0

info:
  title: Writavo Content API
  version: "1.7.0"
  summary: The CMS control plane for a Writavo Site.
  description: |
    The Writavo Content API is the programmable half of the CMS. It lets you create, edit,
    organise, publish and schedule content without opening the dashboard, and it is the same
    surface the dashboard itself is built on.

    ## The Site is resolved from your key, never from your request

    Every key belongs to exactly one Site. The API resolves the owning Site from the key on
    every request, so there is no site or tenant parameter anywhere in this specification.
    An object belonging to a different Site is not visible to you at all: it returns 404,
    never 403, so the API never discloses that it exists.

    ## Draft by default: what happens if you create an article and never publish it

    `POST /articles` always creates the article at `status: draft`. A draft is private. It is
    not readable on your public blog, it is not in your sitemap, it is not in any feed, and no
    part of the AI pipeline will ever pick it up, rewrite it or publish it. It simply sits
    there, editable, until you call `POST /articles/{id}/publish` or delete it.

    There is no way to create an article that is public in one call. Publishing is always a
    separate, explicit request. That is the safety property this whole API rests on: nothing
    you send us becomes public by accident.

    ## Statuses you may set, and statuses you may only read

    Three statuses are yours: `draft`, `scheduled` and `published`. You move between them with
    the lifecycle endpoints (`/publish`, `/unpublish`, `/schedule`, `/cancel-schedule`), not by
    PATCHing `status`.

    The remaining ten statuses belong to the AI pipeline. You can read them, so you can see
    what the engine is doing, but you cannot set them. A `PATCH` that tries to move an article
    into a pipeline status is rejected with `422 VALIDATION_FAILED`. This prevents an API
    client from injecting work into the generation engine, and therefore into your bill.

    ## What costs money, and what happens if you run out of credits

    Most of this API is free: content, taxonomy, media, publishing, settings, the team, reads of
    every kind. A short, fixed list of operations spends the organisation's credits or money, and
    every one of them is marked in this specification, so a client never has to guess:

    - **Spends credits** (`x-spends-credits: true`): `POST /pipeline/runs`, turning the pipeline
      on or up with `PATCH /pipeline/config`, sending an article back for an AI rewrite or new
      images with `POST /pipeline/articles/{id}/requeue`, and six paid SEO scans
      (`POST /seo/site-metrics/refresh`, `/seo/content-gaps/scan`, `/seo/llm-mentions/check`,
      `/seo/backlinks/scan`, `/seo/backlinks/detail-pull`, `/seo/link-opportunities/intersect-scan`).
    - **Spends money without credits** (`x-spends-money: true`): connecting a custom domain
      (5 US dollars a month once it verifies), a keyword rank check (vendor cost), turning on
      auto-refill (charges the saved card) and keeping the current plan instead of a scheduled
      downgrade.

    A paid operation is gated by independent checks, in this order:

    1. **Scope.** Your key must carry the operation's scope, or you get `403 INSUFFICIENT_SCOPE`.
    2. **Entitlement.** Your plan must include the capability, or you get `402 NOT_ENTITLED`.
       Note this applies to the AI pipeline only. The CMS half of this API - content, media,
       taxonomy, webhooks, reads and writes - is included on every plan, and is billed by usage
       rather than gated by tier.
    3. **Availability.** A capability Writavo has switched off platform wide answers
       `409 FEATURE_UNAVAILABLE`, and something the operation needs that is not set up yet
       answers `409 PREREQUISITE_MISSING` naming the operation that sets it up.
    4. **Credits.** Your organisation must be able to afford the next unit of work, or you get
       `402 INSUFFICIENT_CREDITS`.
    5. **Spend cap.** Your Site's own monthly cap must not be reached, or you get
       `402 SPEND_CAP_REACHED`.

    These are distinct error codes on purpose, because the fix differs: buy credits, raise
    your cap, upgrade your plan, or set up the missing piece.

    A run is a request to the engine, not a transaction. If credits run out part way through a
    run that has already started, the engine stops cleanly at the next stage boundary. Work
    already completed is kept and already charged. Nothing is rolled back, no article is left
    half written, and every article stays at whatever status it legitimately reached. The run
    finishes with `status: partial` and a reason you can read from `GET /pipeline/runs/{id}`.
    Top up and request another run and the engine resumes from where it stopped.

    ## Versioning promise

    `/v1` is additive only. We may add new endpoints, new optional request fields and new
    response fields, and you must tolerate unknown response fields. We will not, within `/v1`,
    remove a field, remove or narrow an enum value, rename anything, make an optional request
    field required, or change the HTTP status code of an existing outcome. Any of those would
    ship as `/v2`, with `/v1` supported alongside it.

    New values may be added to read-only enums (for example `article.status`, if the pipeline
    grows a stage). Treat every read-only enum as open and fall through gracefully on a value
    you do not recognise.

    ## Moving an existing blog in

    Content you bring from another system keeps its identity. Send your old system's id for each
    article as `external_id` and look it up with `GET /articles?external_id=` before writing, so
    a second run updates instead of duplicating. Keep the old `slug` so the URL does not change,
    and send the article's old URLs to `POST /redirects/bulk` (or as `old_urls` in the Writavo
    Import Format): WordPress's `/2021/03/my-post/` and `/?p=123` then answer with a 301 to the
    article instead of a 404.
    Record each article's original dates when you create or update it, as
    `original_published_at` (and optionally `original_content_updated_at`): whenever the article
    is first published, from the dashboard, the API, an MCP client, a schedule or the pipeline, it
    goes live with that date instead of today's, so you can import everything as drafts and
    publish later without losing its history. You can also pass `published_at` (and optionally
    `content_updated_at`) in the body of `POST /articles/{id}/publish`, which wins over the
    recorded dates. Either way your feed order, structured data and sitemap dates stay what they
    were. The migration guide walks through the whole import.

    ## Signing in from a terminal

    Command line tools and MCP clients do not need a key pasted into them. `POST /auth/device`
    starts a sign-in that a person approves in the dashboard, and the key the client generated
    becomes an ordinary secret key for the Site they choose. These two endpoints are the only
    ones that take no API key. A key obtained this way can extend itself while it is in use
    (`POST /auth/key/extend`) and revoke itself on sign-out (`POST /auth/key/revoke`).

    AI assistants that support remote MCP servers can skip the terminal entirely: the hosted
    server at `https://mcp.writavo.com/mcp` signs a person in with OAuth 2.1 and one browser
    consent, and underneath runs this same device sign-in on their behalf. OAuth exists on that
    host only. This API accepts API keys and nothing else.

    ## Everything the dashboard does, not just content

    Beyond content, a key can read and change the Site's settings and knowledge profile, the AI
    pipeline's configuration, the content plan, article formats and prompts, how the blog is
    delivered (reverse proxy, custom domain, hosted site, CMS push), the SEO suite, outreach
    status (read only), the team and its permissions, billing, and the Site's reports and logs.
    Each area has its own scope, so a key only reaches what it was given. A few things are never
    possible through the API at all; they are listed at the end of this section with the page a
    person uses instead.

    ## AI agents: the switch, approvals and the call log

    A key approved through a device or OAuth sign-in is an AI agent's key, and three controls
    apply to it that apply to no other key:

    - **The switch.** An owner or admin can turn AI agent access off for the whole organisation.
      Every agent key then gets `403 AGENT_ACCESS_DISABLED` until it is turned back on; nobody
      has to sign in again. Keys made in the dashboard are unaffected.
    - **Approvals.** Operations marked `x-writavo-approval` answer an agent's first attempt with
      `428 APPROVAL_REQUIRED` and a link. A person approves or denies it in the dashboard, and
      the agent retries the identical request with the `Writavo-Approval` header. An approval is
      single use, lasts 24 hours, and is bound to that key, that exact request (the same method,
      path and body) and what the request would do: if the effect changed between the approval
      and the retry (the article's status moved, the price of the pack changed, the member's
      role is different), the retry is `409 APPROVAL_INVALID` ("What this request would do has
      changed...") and a new approval is needed. Requests an MCP client makes (they carry
      `Writavo-Mcp-Tool`, or arrive through the hosted MCP server) are gated and logged the same
      way even when the client holds a key made in the dashboard; the AI agent switch still
      follows only the key's origin. A team change can only be approved by the person whose assistant asked for it,
      never by the member it affects. Every gated operation is marked `x-writavo-approval-always: true`
      and is asked for every agent key, except six: deleting an article, category, tag, author
      or media file, and unpublishing an article, which the organisation's approvals switch may
      turn off. An operation with `x-writavo-approval-when` is gated only in the case that
      sentence names.
    - **The call log.** Every request an agent key makes is recorded (operation, outcome,
      duration, and the MCP tool named in `Writavo-Mcp-Tool` when one is sent) and shown under
      Settings > AI agents.

    The approval actions, by family:

    - **Spends money or credits (always asked):** requesting a pipeline run, turning the
      pipeline on or up, sending an article back through the AI, the seven paid SEO scans,
      turning on or raising auto-refill, raising or removing the Site's credit cap, and keeping
      the current plan.
    - **Changes the team (always asked):** inviting someone, changing a member's role, removing a
      member, changing a member's permissions, and changing what a role can do.
    - **Changes the live site (always asked):** setting up the reverse proxy, connecting a custom
      domain (which also costs 5 US dollars a month), removing the custom domain, publishing the
      hosted blog, disconnecting the external CMS, and pushing articles to it.
    - **Cannot be undone (always asked):** deleting an article format.
    - **Content (asked while the organisation requires approvals, the default):** deleting an
      article, category, tag, author or media file, and unpublishing an article.

    ## What an AI agent can never do

    These are refused by the server whatever scopes a key carries, and none of them has an API
    route. Each has one next step: a person does it in the dashboard.

    | Never through an agent | What to tell the person |
    |---|---|
    | Change the AI agent switch, the approvals switch or the default permissions | A person changes this at https://app.writavo.com/settings/agents. |
    | Approve its own requests, or widen its own access | The person approves at the link, or reconnects the assistant to choose more permissions. |
    | Change the access of the person it acts for (their role, their permissions, their role's permissions) | That person, or another owner or admin, does it at https://app.writavo.com/team. |
    | Delete a Site or the organisation | Not available to AI agents. The person contacts https://writavo.com/support. |
    | Enter or change payment details | Add or change a card at https://app.writavo.com/billing?action=add-card. |
    | Change the plan | Get the plan link (the MCP tool `start_plan_purchase`, or https://app.writavo.com/billing) and give it to the person. |
    | Transfer ownership or make anyone an owner | The owner does it at https://app.writavo.com/team. |
    | Accept the outreach policy, pass identity checks, or connect an outreach mailbox | An owner or a person with integrations access does it at https://app.writavo.com/outreach. |
    | Enter a CMS or Bing Webmaster Tools credential | `POST /delivery/cms` and `POST /seo/backlinks/bing` return the dashboard page where the person pastes it. |
    | Create, rotate or revoke API keys; manage webhooks | A person does this at https://app.writavo.com/settings/api-keys or https://app.writavo.com/settings/webhooks. |
    | Anything that needs Writavo platform staff | Not something an organisation can change. The person contacts https://writavo.com/support. |
  contact:
    name: Writavo Support
    url: https://writavo.com/support
  license:
    name: Proprietary
    url: https://writavo.com/terms

servers:
  - url: https://api.writavo.com/v1
    description: Production

externalDocs:
  description: Guides, quickstarts and the rendered reference
  url: https://writavo.com/docs

tags:
  - name: Meta
    description: Connectivity, Site information, article formats, limits and usage.
  - name: Articles
    description: The content spine. Create, edit, organise, publish and schedule.
  - name: Categories
    description: The closed taxonomy. Exactly one category per article.
  - name: Tags
    description: The cross cutting taxonomy. Many tags per article.
  - name: Authors
    description: The byline roster for a Site.
  - name: Media
    description: The media library. Two step upload, then registration.
  - name: Imports
    description: |
      Bring a whole blog in, or keep pushing articles from another system, in the Writavo Import
      Format (https://writavo.com/schemas/import-v1.json). Send the document once, check the dry
      run, then start it: Writavo runs the import on its own servers until every article is done,
      at the pace the rate limits allow, with nobody connected. Articles are matched by
      `external_id`, so pushing the same article again updates it rather than duplicating it.
      The same imports back the MCP server's `import_content` tool.
  - name: Pipeline
    description: |
      The AI generation engine: runs, the content plan, the pipeline's configuration and sending
      an article back through it. Requesting a run, turning the pipeline on or up, and an AI
      rewrite spend credits; each is marked `x-spends-credits`.
  - name: Formats and prompts
    x-mcp-surface: action
    description: |
      Article formats (the SEO blueprints the generator follows) and the AI prompt used at each
      pipeline stage: read the defaults, override one for this Site, reset it.
  - name: Content types
    description: |
      Your Site's own content models: a Product, a Testimonial, a Homepage. A content type is a list
      of fields (text, numbers, dates, choices, media, references to other entries and articles,
      reusable components and flexible blocks) with validation rules. Define them in the dashboard,
      one at a time here, or all at once from a file with `POST /content-types/apply`. A type of kind
      `article_fields` (API id `article`) adds custom fields to your articles instead.
  - name: Entries
    description: |
      The content of your content types. Entries are drafts until published, can be scheduled to
      publish and to unpublish, keep every saved version, and count as documents on the CMS meter
      like articles do. A publishable key reads published entries only.
  - name: Site settings
    x-mcp-surface: action
    description: |
      The Site's name, primary domain, locale, niche and timezone, and its knowledge profile: the
      brand voice, product description and audience the AI writes for.
  - name: Organisation
    x-mcp-surface: action
    description: |
      The organisation that owns the Site: its name and the caller's role. The AI agent controls
      are readable here and changeable only by a person in the dashboard.
  - name: Delivery
    x-mcp-surface: action
    description: |
      How the blog reaches readers: the reverse proxy on the customer's domain, a custom domain,
      the Writavo hosted site and its branding, the headless read API, and pushing to an
      external CMS. Connecting a custom domain costs money; publishing the hosted site and
      pushing to a CMS put content live.
  - name: SEO
    x-mcp-surface: action
    description: |
      The SEO suite: site metrics, competitors, tracked keywords and alerts, content gaps,
      internal links, LLM mentions, engagement, backlinks, the disavow list and link
      opportunities. Reads and curation are free; the seven scans marked `x-spends-credits` or
      `x-spends-money` cost money and always need a person's approval when an AI agent asks.
  - name: Engagement
    x-mcp-surface: action
    description: |
      Bringing a migrated blog's engagement history with it: per post per day views, reactions and
      share clicks, and each reader's current reaction. Recording live engagement and reading an
      article's counters are under SEO.
  - name: Redirects
    x-mcp-surface: action
    description: |
      Old URLs and where they send readers now. Your blog answers each with a 301 wherever the
      URL would otherwise be a 404, on the hosted site, a custom domain and the reverse proxy.
      Changing a published article's slug, or a category's or tag's, adds one automatically.
      Import a migrated blog's old URLs here, and export the ones your own server has to answer.
  - name: Analytics
    x-mcp-surface: action
    description: |
      Visitor analytics for the pages that show your articles, wherever they are served: the setup
      (site id and snippet), turning it on or off, the domains that count, the visitor report, and a
      check that the script is installed on a page. Cookieless: a visitor is counted once a day from a
      hash under a salt that changes daily, and no cookie or browser storage id is set. Hosted Writavo
      blogs carry the script automatically; anywhere else, paste the `snippet` from
      `GET /analytics/setup` inside `<head>`. Guide: https://writavo.com/docs/analytics.

      The script tag's attributes:

      - `data-site` (required): the Site's public id, `wa_` followed by 24 hex characters.
      - `data-include` (optional): a regular expression; only pages whose path matches it are counted,
        for a blog inside a bigger app (`data-include="^/blog(/|$)"`). An invalid pattern is ignored
        and every page counts.
      - `data-api` (optional): the full URL to send events to instead of the collector's own
        `/api/a/e`, for a setup that forwards them itself.

      It counts one pageview on load and on every client-side navigation, and the time the page was
      visible when the reader leaves. It stays silent on localhost, 127.x, 0.0.0.0 and file: pages, in
      automated browsers (`navigator.webdriver`, Cypress, PhantomJS, Nightmare), and for a visitor who
      sets `localStorage.writavo_ignore = "true"` (to exclude your own visits). A Content Security
      Policy must allow the collector origin in both `script-src` and `connect-src`. The collector
      answers 202 to every event, accepted or not, so it cannot tell you whether an install works: use
      `POST /analytics/install-check`, or `install` in `GET /analytics/setup`, which shows the last
      event that arrived and any hosts that were turned away.
  - name: Comments
    x-mcp-surface: action
    description: |
      Reader comments on articles. Off until someone turns them on (`PATCH /comments/settings`). The
      hosted blog shows a comment form by itself; a site that renders its own pages reads
      `GET /comments/posts/{slug}` (publishable key) and posts readers' comments with
      `POST /comments` from its own server. Moderators approve, hold, mark as spam, reply and delete,
      here or in the dashboard. Plain text only, one level of replies, the email address is never
      shown publicly, and a reader's IP is kept only as a hash under a salt that changes daily, for
      rate limits. `comments:read` and `comments:write` need the comments.moderate permission,
      because the moderation queue carries email addresses.
  - name: Outreach
    x-mcp-surface: action
    description: |
      Link outreach, read only: readiness, the connected mailbox, contacts, campaigns and
      threads. Contains personal data of people outside the organisation. Accepting the outreach
      policy and connecting a mailbox are done by a person in the dashboard.
  - name: Team
    x-mcp-surface: action
    description: |
      Members, invites, roles and permissions. Every change needs a person's approval when an AI
      agent asks, and an agent can never change the access of the person it acts for, nor
      anything to do with ownership.
  - name: Billing
    x-mcp-surface: action
    description: |
      The plan, credit balance, USD account balance and its activity, allowances, overage
      estimate, invoices, credit packs, auto-refill and the Site's credit cap. Payment details and
      plan changes are never taken here: they are links a person opens.
  - name: Insights
    x-mcp-surface: action
    description: |
      Reports and logs: the Site overview, costs per Site and per article, taxonomy counts,
      function logs, the audit log and the AI agent call log.
  - name: API keys
    description: Key management. Specified here, implemented in API-2.
  - name: Webhooks
    description: |
      Outbound event delivery. Register an HTTPS endpoint, subscribe it to events, and receive a
      signed POST whenever your content changes, from this API or from the dashboard.
  - name: Device sign-in
    description: |
      Device sign-in for command line tools and MCP clients: a person approves access in the
      dashboard instead of copying a key. The only endpoints that take no API key.

security:
  - apiKey: []

paths:
  # ==========================================================================
  # META
  # ==========================================================================
  /ping:
    get:
      operationId: ping
      tags: [Meta]
      summary: Verify a key
      description: |
        The cheapest possible authenticated call. Returns the kind of key you presented and the
        scopes it carries. Use it to confirm credentials during setup, and as a liveness probe.
        It touches no content, so it is exempt from the write rate limit.
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: true
      responses:
        "200":
          description: The key is valid.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [pong, key_kind, scopes]
                        properties:
                          pong:
                            type: boolean
                            const: true
                          key_kind:
                            $ref: "#/components/schemas/KeyKind"
                          scopes:
                            type: array
                            items: { $ref: "#/components/schemas/Scope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /site:
    get:
      operationId: getSite
      tags: [Meta]
      summary: Read Site information
      description: |
        Public facing information about the Site your key belongs to: its display name, the
        domain its blog is served from, its locale and its timezone. The timezone is
        informational: scheduling takes absolute ISO 8601 timestamps. The full, editable
        settings are `GET /site/settings`.
      x-scope: meta:read
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: true
      responses:
        "200":
          description: Site information.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /formats:
    get:
      operationId: listFormats
      tags: [Meta]
      summary: List article formats
      description: |
        The article formats available to this Site. A format is an SEO blueprint (How-To,
        Listicle, Versus and so on) that shapes how the generator structures an article, and
        that you may set on any article via `format_id`.

        The list merges the platform defaults with any formats defined for your Site. A Site
        format with the same `key` as a platform default overrides it, and only the override is
        returned. Define, change or remove a Site format with `POST /formats`,
        `PATCH /formats/{id}` and `DELETE /formats/{id}`; read one format's blueprint
        with `GET /formats/{id}`.

        Until API version 1.5.0 this was `GET /content-types`. That path now lists the Site's
        custom content types (the models of its entries), which are a different thing.
      x-scope: meta:read
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: true
      responses:
        "200":
          description: The available article formats.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Format" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      operationId: createFormat
      tags: [Formats and prompts]
      summary: Define an article format
      description: |
        Define a format for this Site: a name, a key, and a blueprint of the sections the generator
        writes and the structured blocks it must include. A key equal to a platform default's overrides
        that default for this Site (only the override is listed afterwards); a key another Site format
        already uses is `409 CONFLICT`.

        `blueprint.requires` names the structured blocks the generator must fill: `howto_steps`,
        `key_takeaways`, `comparison`, `faqs`. `blueprint.sections` is the outline, in order.
      x-scope: prompts:write
      x-permission: prompts.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-mcp-surface: action
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormatCreate" }
      responses:
        "201":
          description: The new format.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FormatDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /usage:
    get:
      operationId: getUsage
      tags: [Meta]
      summary: Read plan limits, usage and balances
      description: |
        What your plan allows, what you have used in the current period, and what you can still
        spend. Read this before a pipeline run if you want to fail fast rather than handle a
        402, and read it after a run to see the balance move.

        `credits.balance` is the organisation wide credit balance shared by every Site under the
        account. `spend_cap` is this Site's own monthly ceiling and is independent of it: a Site
        can be capped while the organisation still has credits, which is the point of a cap.
      x-scope: meta:read
      x-permission: none
