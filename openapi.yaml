  # ==========================================================================
  # REDIRECTS (0127)
  # ==========================================================================
  /redirects:
    get:
      operationId: listRedirects
      tags: [Redirects]
      summary: List redirects
      description: |
        The Site's redirects, newest first. Each one says where it points now (`target_path`,
        `null` while its target is not published) and whether Writavo answers its old URL itself
        (`served_by_writavo`); the rest are in `GET /redirects/export`.

        **Headless sites.** If you render the blog yourself, apply these in your own front end:
        read them with your publishable key (`wv_pub_`), which sees only redirects whose target is
        live and never the notes, cache the list, and answer a request that would 404 with a 301
        (or 302) to `target_path` under your blog's base URL.
      x-scope: articles:read
      x-permission: articles.read
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: true
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 200. Default 50.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: q
          in: query
          required: false
          description: Search the old URL and a literal target (`to`). Up to 200 characters.
          schema: { type: string, maxLength: 200 }
        - name: origin
          in: query
          required: false
          description: Only redirects made this way.
          schema: { type: string, enum: [manual, import, slug_change] }
        - name: article_id
          in: query
          required: false
          description: Only the redirects that point at this article (its old URLs).
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A page of redirects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/Redirect" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createRedirect
      tags: [Redirects]
      summary: Create a redirect
      description: |
        Send an old URL (`from`) and where it should go now. The old URL is a path under your
        blog (`/2021/03/my-post/`) or a full URL (`https://example.com/?p=123`); a full URL is kept
        with its host, so a redirect for a URL your blog is not served on yet starts working the
        moment it is. It is normalised: case, a trailing slash and repeated slashes do not
        matter, and a query string matches a request that carries at least those parameters.

        Point it at an article, a category or a tag by id (`to_article_id`, `to_external_id`,
        `to_category_id`, `to_tag_id`) whenever you can: the redirect then follows the content
        through later slug changes and never becomes a chain. `to` takes a path under the blog
        root or any `https://` URL.

        If the old URL already has a redirect, it is replaced and the answer is `200` instead of
        `201`. Your blog answers a redirect only where the URL would otherwise be a 404, so a
        live page always wins.
      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-agent-consequence: Makes the old URL redirect readers and search engines to the target on the live blog.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedirectWrite" }
            examples:
              wordpress_permalink:
                summary: A WordPress date permalink to the imported article
                value: { from: "https://example.com/2021/03/how-to-test-soil/", to_external_id: "wp:1001" }
              old_query_url:
                summary: WordPress's ?p= link
                value: { from: "https://example.com/?p=1001", to_external_id: "wp:1001" }
      responses:
        "201":
          description: The redirect was created.
          headers:
            Location: { schema: { type: string }, description: The URL of the new redirect. }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Redirect" }
        "200":
          description: The old URL already had a redirect; it now points here.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Redirect" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /redirects/bulk:
    post:
      operationId: bulkRedirects
      tags: [Redirects]
      summary: Create or replace many redirects
      description: |
        Up to 5,000 redirects in one call, the same fields as `POST /redirects`: the door for a
        migration's whole URL map. **Dry run by default**: every row is checked and nothing is
        written until you send `dry_run: false`. A row with a problem is skipped and listed in
        `problems`; the valid rows are written. SET semantics on the old URL, so sending the same
        list twice changes nothing. A Site holds up to 50,000 redirects.
      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-agent-consequence: Makes every old URL in the list redirect to its target on the live blog.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedirectBulkInput" }
            examples:
              dry_run:
                summary: Check a WordPress URL map, write nothing
                value:
                  redirects:
                    - { from: "https://example.com/2021/03/how-to-test-soil/", to_external_id: "wp:1001" }
                    - { from: "https://example.com/?p=1001", to_external_id: "wp:1001" }
                    - { from: "https://example.com/category/guides/", to: "/category/guides" }
      responses:
        "200":
          description: The report. With `dry_run` it describes what would be written.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RedirectBulkResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /redirects/export:
    get:
      operationId: exportRedirects
      tags: [Redirects]
      summary: Export redirects for your own server
      description: |
        Some old URLs never reach Writavo: your blog moved from `example.com/` to
        `example.com/blog/`, or from another host. Your own server has to redirect those. This
        returns them as a file to install: `csv`, `nginx`, `apache` (.htaccess), `cloudflare`
        (a Bulk Redirects list) or `vercel` (vercel.json, also valid in next.config.js). Use
        `only=unserved` for just the ones Writavo cannot answer. Targets are full URLs on your
        blog. A redirect a format cannot express, or whose target is not published, is listed in
        `skipped` with the reason rather than dropped.
      x-scope: articles:read
      x-permission: articles.read
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [csv, nginx, apache, cloudflare, vercel], default: csv }
        - name: only
          in: query
          required: false
          description: "`unserved`: only the redirects Writavo does not answer itself."
          schema: { type: string, enum: [all, unserved], default: all }
      responses:
        "200":
          description: The file, in `content`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RedirectExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /redirects/{id}:
    parameters:
      - $ref: "#/components/parameters/RedirectId"
    get:
      operationId: getRedirect
      tags: [Redirects]
      summary: Read one redirect
      x-scope: articles:read
      x-permission: articles.read
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      x-cross-tenant: 404
      responses:
        "200":
          description: The redirect.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Redirect" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: updateRedirect
      tags: [Redirects]
      summary: Update a redirect
      description: |
        Change where it points, its status or its note. The old URL cannot change: delete the
        redirect and create a new one.
      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
