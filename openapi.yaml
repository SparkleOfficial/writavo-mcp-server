  # ==========================================================================
  # API KEYS  (specified here; implemented in API-2)
  # ==========================================================================
  /keys:
    get:
      operationId: listApiKeys
      tags: [API keys]
      summary: List API keys
      description: |
        Metadata only. The secret itself is shown once, at creation, and is never retrievable
        afterwards because only a hash is stored. `key_prefix` is the displayable fragment you
        use to tell keys apart.

        Requires a secret key carrying `keys:read`. A publishable key can never read this.
      x-scope: keys:read
      x-permission: api_keys.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      responses:
        "200":
          description: A page of keys.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
    post:
      operationId: createApiKey
      tags: [API keys]
      summary: Create an API key
      description: |
        Returns the secret exactly once, in `data.secret`. Store it immediately. There is no way
        to recover it later, and support cannot retrieve it for you.

        A key can never be created with more authority than its creator has. The scopes you
        request are intersected with the creator's own permissions, and the granted set comes
        back in `data.scopes`. If you asked for something you do not hold, the key is still
        created, without it. Compare what you asked for against what you got.

        A secret key's authority is also re-evaluated on every request against its creator's
        live permissions, so revoking a person's access immediately narrows every key they made.

        **A retry does not give you the secret again.** `Idempotency-Key` guarantees you created
        one key rather than two, and a replayed response returns the key's `id`, `kind`,
        `key_prefix` and `scopes` with `secret: null` and `secret_replayable: false`. The secret
        is never stored anywhere, including in the idempotency record, because storing it would
        put a live credential in a database backup. If you lost it, rotate the key.
      x-scope: keys:write
      x-permission: api_keys.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, scopes]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: A label for humans. Say where the key lives, so you know what breaks if you revoke it.
                kind: { $ref: "#/components/schemas/KeyKind" }
                scopes:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Scope" }
                expires_at:
                  type: [string, "null"]
                  format: date-time
                  description: Optional expiry. After it passes the key returns `401 API_KEY_EXPIRED`.
      responses:
        "201":
          description: The key was created. This is the only time the secret is returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/ApiKey"
                          - type: object
                            required: [secret]
                            properties:
                              secret:
                                type: string
                                description: The full key. Shown once. Never retrievable again.
                                # API-2: the issued shape is prefix + 32 base64url chars from 24
                                # random bytes. No `live_` segment: environment is a column, not
                                # part of the string (there is no test mode in v1).
                                examples: ["wv_sk_EXAMPLE0000000000000000000000000000"]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /keys/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    post:
      operationId: rotateApiKey
      tags: [API keys]
      summary: Rotate an API key
      description: |
        Issues a new secret for the same key record, keeping its name, and returns it once.

        Only the person who created the key, an organisation owner or a platform admin may rotate
        it: a rotation hands over a live credential that keeps acting with its creator's
        permissions. Anyone else with `api_keys.manage` gets `403 INSUFFICIENT_SCOPE`. The new
        secret's scopes are the old key's scopes limited to what the caller could grant today, and
        a rotation that would leave no scopes is refused with `403 INSUFFICIENT_SCOPE`.

        As with creation, a replayed retry returns `secret: null` and `secret_replayable: false`
        rather than handing out the credential a second time. Rotate again if you lost it.

        Set `grace_seconds` to keep the old secret working while you deploy the new one. During
        the grace window both work. After it, the old one returns `401 API_KEY_REVOKED`. A grace
        of `0` cuts the old secret off immediately, which is the right choice if you are rotating
        because it leaked.
      x-scope: keys:write
      x-permission: api_keys.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                grace_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
                  default: 0
      responses:
        "200":
          description: Rotated. The new secret is returned once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/ApiKey"
                          - type: object
                            required: [secret]
                            properties:
                              secret: { type: string, description: The new key. Shown once. }
                              previous_valid_until:
                                type: [string, "null"]
                                format: date-time
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /keys/{id}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    delete:
      operationId: revokeApiKey
      tags: [API keys]
      summary: Revoke an API key
      description: |
        Immediate and permanent. The key record is kept, marked revoked, so the audit trail
        survives, but the secret stops working at once and returns `401 API_KEY_REVOKED`.

        Revoking the key you are calling with is allowed. It is the last request that key makes.
      x-scope: keys:write
      x-permission: api_keys.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      responses:
        "204":
          description: Revoked. No body.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ==========================================================================
  # WEBHOOKS
  #
  # VERIFYING A DELIVERY. Do this before you parse the body; an unverified webhook endpoint is
  # an unauthenticated write path into your system.
  #
  #   1. read the raw request body as BYTES, before any JSON parse
  #   2. signed   = `${Writavo-Timestamp}.${rawBody}`
  #   3. expected = hex(HMAC_SHA256(your_signing_secret, signed))
  #   4. compare the `Writavo-Signature` header, which is `v1=<hex>`, to `v1=<expected>`,
  #      using a constant-time comparison
  #   5. reject if |now - Writavo-Timestamp| > 300 seconds
  #
  # The timestamp is inside the signed material, which is the whole reason it is sent: a captured
  # payload cannot be replayed later, because its signature only validates against the timestamp
  # it was signed with.
  #
  # Headers on every delivery: Writavo-Signature, Writavo-Timestamp, Writavo-Event,
  # Writavo-Delivery (this attempt) and Writavo-Attempt (1 to 6).
  #
  # DELIVERY IS AT LEAST ONCE. Retries use exponential backoff at roughly 1m, 5m, 15m, 1h and 6h,
  # six attempts in all. Answer 2xx as soon as you have durably accepted the event, and do the
  # work afterwards: a handler that finishes its work before answering will be retried while it
  # is still running. Deduplicate on the payload's `id`.
  # ==========================================================================
  /webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List webhook endpoints
      x-scope: webhooks:read
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of webhook endpoints.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Create a webhook endpoint
      description: |
        Registers a URL to receive signed event deliveries. The signing secret is returned once,
        at creation, and never again: record it before you close the response. If you lose it,
        `POST /webhooks/{id}/rotate-secret` issues a new one.

        Verify every delivery, using the recipe at the top of this section, before you parse the
        body.

        The URL must be public HTTPS. Private, loopback, link-local and metadata addresses are
        refused, and so is a hostname that resolves to one, at save time and again at delivery
        time. A webhook cannot be pointed at internal infrastructure.

        Delivery is at least once. Retries use exponential backoff, and an endpoint that keeps
        failing is disabled automatically and reported to you. Deduplicate on the payload's `id`
        and make your handler idempotent.

        A Site may register at most ten endpoints.
      x-scope: webhooks:write
      x-permission: integrations.manage
      x-entitlement: cms.webhooks
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              additionalProperties: false
              properties:
                url: { type: string, format: uri, examples: ["https://example.com/hooks/writavo"] }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                description: { type: [string, "null"], maxLength: 200 }
      responses:
        "201":
          description: The endpoint was created. The signing secret is returned once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Webhook"
                          - type: object
                            required: [signing_secret]
                            properties:
                              signing_secret: { type: string, description: Shown once. Never retrievable again. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      operationId: getWebhook
      tags: [Webhooks]
      summary: Read one webhook endpoint
      x-scope: webhooks:read
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      x-cross-tenant: 404
      responses:
        "200":
          description: The webhook endpoint.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: updateWebhook
      tags: [Webhooks]
      summary: Update a webhook endpoint
      description: |
        Change the URL, the subscribed events, or re-enable an endpoint that was auto-disabled
        after repeated failures. Re-enabling does not replay what you missed.
      x-scope: webhooks:write
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                description: { type: [string, "null"], maxLength: 200 }
                enabled: { type: boolean }
      responses:
        "200":
          description: The updated webhook endpoint.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      description: Deliveries stop at once. Queued retries for this endpoint are dropped.
      x-scope: webhooks:write
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      responses:
        "204":
          description: Deleted. No body.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhooks/{id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: Rotate the signing secret
      description: |
        Issues a new signing secret and returns it once. The old secret stops working
        immediately: there is no grace window, because a window in which two secrets both
        validate is a window in which a leaked secret still works.

        Deliveries sent between the rotation and your receiver being updated will fail
        verification. They are retried on the normal backoff, so update the receiver promptly and
        the queue drains itself.
      x-scope: webhooks:write
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      responses:
        "200":
          description: The new signing secret. Shown once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, signing_secret]
                        properties:
                          id: { type: string, format: uuid }
                          signing_secret: { type: string, description: Shown once. Never retrievable again. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhooks/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: List deliveries for an endpoint
      description: |
        The delivery log, newest first. Use it to answer "did you send it and did we accept it".
        `response_status` is what your server returned; `attempt` counts from 1 to 6.

        There is one row per ATTEMPT, and every attempt of one event shares its `event_id`. A row
        with `status: failed` and `exhausted: false` will be retried; `exhausted: true` means the
        ladder gave up.
      x-scope: webhooks:read
      x-permission: integrations.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, delivered, failed]
        - name: event
          in: query
          required: false
          description: Return only attempts for this event type.
          schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/WebhookDelivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhooks/{id}/deliveries/{delivery_id}/redeliver:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
      - $ref: "#/components/parameters/WebhookDeliveryId"
    post:
      operationId: redeliverWebhookDelivery
      tags: [Webhooks]
      summary: Send one delivery again
      description: |
        Queues the same event for delivery again, with the same `event_id` and byte-identical
        body, so your handler sees it as the event it already knows how to deduplicate rather
        than as a second, different fact. Use it after fixing a receiver that was down.

        The attempt counter starts again at 1: this is a fresh ladder you asked for, not a
        continuation of the one that failed. The endpoint must be enabled.
      x-scope: webhooks:write
      x-permission: integrations.manage
      x-entitlement: cms.webhooks
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      responses:
        "202":
          description: Queued. It will be attempted within the minute.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, status, attempt]
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The id of the NEW attempt, not of the one you asked to repeat.
                          status: { type: string, const: pending }
                          attempt: { type: integer, const: 1 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ==========================================================================
  # AUTHENTICATION (device sign-in)
  # ==========================================================================
  /auth/device:
    post:
      operationId: startDeviceAuthorization
      tags: [Device sign-in]
      summary: Start a device sign-in
      description: |
        Starts a sign-in for a command line tool or MCP client, modelled on the OAuth device
        authorization grant (RFC 8628). Takes no API key: this is how a client comes to have one.

        **The client generates the key.** Create a secret the same shape as ours, `wv_sk_`
        followed by 32 base64url characters (24 random bytes), keep it private, and send only its
        SHA-256 as `key_hash` plus its first 12 characters as `key_prefix`. The secret never
        leaves your machine; approval registers its hash as an ordinary secret key.

        Show the person `verification_uri_complete` (or `verification_uri` and `user_code`). They
        sign in to the dashboard, or create an account first, choose a Site, and approve. Then
        poll `POST /auth/device/token` every `interval` seconds until it says `approved`, and
        start using your key. The request expires after `expires_in` seconds.

        The key is created for the approving person, on the Site they choose, with the scopes you
        asked for that they are allowed to grant, and expires after 90 days. It appears under
        Settings > API keys, where it can be revoked like any other.

        `flow: "oauth"` is reserved for Writavo's own hosted MCP server, which runs this sign-in
        on a person's behalf behind its OAuth consent. Sent by anything else it is refused with
        `403 FORBIDDEN`: leave `flow` out.
      security: []
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: auth
      x-publishable: false
      parameters:
        - $ref: "#/components/parameters/McpWorker"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_name, key_hash, key_prefix, scopes]
              properties:
                flow:
                  type: string
                  enum: [device, oauth]
                  default: device
                  description: |
                    `device` (the default) for a command line tool. `oauth`
                    only from Writavo's hosted MCP server, with its `X-Writavo-Mcp-Worker` header;
                    from anything else it is `403 FORBIDDEN`.
                redirect_host:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 253
                  description: |
                    `oauth` only. The host of the AI client's registered redirect URI, shown
                    prominently on the consent screen so the person can recognise where access is
                    going. Sent with `flow: device` it is `422 VALIDATION_FAILED`.
                client_name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: What the person sees on the approval screen, such as the name of your tool.
                client_host:
                  type: [string, "null"]
                  maxLength: 120
                  description: The machine asking, such as its hostname, so the person can recognise it.
                key_hash:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: SHA-256 of the full secret key you generated, as lower-case hex.
                key_prefix:
                  type: string
                  pattern: "^wv_sk_[A-Za-z0-9_-]{6}$"
                  description: The first 12 characters of that key, shown in the dashboard to identify it.
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items: { $ref: "#/components/schemas/Scope" }
                  description: |
                    The scopes you want. The key receives those the approving person may grant on
                    the Site they pick; the rest are dropped.
      responses:
        "201":
          description: The sign-in is waiting for approval.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
                        properties:
                          device_code:
                            type: string
                            description: Opaque. Keep it private and send it when you poll.
                          user_code:
                            type: string
                            pattern: "^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$"
                            description: What the person confirms on the approval screen.
                          verification_uri: { type: string, format: uri }
                          verification_uri_complete:
                            type: string
                            format: uri
                            description: The approval page with the code filled in. Show this one when you can.
                          expires_in: { type: integer, const: 1800 }
                          interval:
                            type: integer
                            const: 5
                            description: Seconds to wait between polls.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/device/token:
    post:
      operationId: pollDeviceAuthorization
      tags: [Device sign-in]
      summary: Poll a device sign-in
      description: |
        Reports whether the person has approved the sign-in. It returns an outcome, never a
        credential: on `approved`, the key you generated is live, and the response says which
        Site it belongs to, which scopes it carries and when it expires.

        `pending` means keep waiting. `slow_down` means you polled faster than `interval`; wait
        the `interval` it returns before the next poll. `denied` and `expired` are final: start
        again with a new key.
      security: []
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: auth
      x-publishable: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_code]
              properties:
                device_code: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: The current outcome.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status:
                            type: string
                            enum: [pending, slow_down, approved, denied, expired]
                          interval:
                            type: integer
                            description: Present on `slow_down`. Seconds to wait before polling again.
                          key:
                            type: object
                            description: Present on `approved`.
                            properties:
                              id: { type: string, format: uuid }
                              key_prefix: { type: string }
                              scopes:
                                type: array
                                items: { $ref: "#/components/schemas/Scope" }
                              expires_at: { type: [string, "null"], format: date-time }
                          website:
                            type: object
                            description: Present on `approved`. The Site the key belongs to.
                            properties:
                              id: { type: string, format: uuid }
                              name: { type: string }
                          callback_nonce_hash:
                            type: string
                            pattern: "^[0-9a-f]{64}$"
                            description: |
                              Present only for an OAuth sign-in (Writavo's hosted MCP server), on
                              `approved`: the SHA-256, as lower-case hex, of the one-time nonce the
                              dashboard put on the approving browser's callback URL. The server
                              completes the sign-in only for the browser whose nonce matches. A
                              device sign-in never carries it.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/key/extend:
    post:
      operationId: extendApiKey
      tags: [API keys]
      summary: Extend the calling key's expiry
      description: |
        Pushes the expiry of the key you are calling with further out, so a sign-in that is in
        regular use does not stop working after 90 days. Acts on the calling key only: there is
        no id to send.

        Only a key obtained through a device or OAuth sign-in can extend itself, and only while
        it is live, its creator can still manage API keys on the Site, and the organisation has
        not turned AI agent access off. Anything else is `403 FORBIDDEN` with the reason. A key
        made in the dashboard keeps the expiry the person chose.

        Nothing changes until the key is within 30 days of expiry; before that you get
        `extended: false` and the current `expires_at`, so it is safe to call on every start. An
        extension moves the expiry to 90 days from now, but never past 365 days from the key's
        creation (`extended: false`, `reason: max_lifetime`), after which a person signs in
        again. Needs no scope; a publishable key gets `403 INSUFFICIENT_SCOPE`.
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      responses:
        "200":
          description: The key's expiry, extended or not.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [key, extended]
                        properties:
                          key:
                            type: object
                            required: [id, expires_at]
                            properties:
                              id: { type: string, format: uuid }
                              expires_at: { type: [string, "null"], format: date-time }
                          extended:
                            type: boolean
                            description: True when this call moved `expires_at`.
                          reason:
                            type: string
                            enum: [max_lifetime]
                            description: Present when the key is due and still could not be extended.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/key/revoke:
    post:
      operationId: revokeCurrentApiKey
      tags: [API keys]
      summary: Revoke the calling key
      description: |
        Revokes the key you are calling with, immediately. It is the last request that key makes;
        every later one returns `401 API_KEY_REVOKED`. This is what signing out of a command line
        tool or an MCP client should call, so the credential ends on the server rather than only
        being forgotten on the machine.

        Any secret key may revoke itself, whatever its scopes. Acts on the calling key only:
        there is no id to send. To revoke a different key use `DELETE /keys/{id}`.
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [revoked]
                        properties:
                          revoked: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/key/sites:
    get:
      operationId: listConnectionSites
      tags: [API keys]
      summary: "Internal: the Sites an AI connection reaches"
      description: |
        **Internal. Only the Writavo MCP service can call this; anyone else gets `403`.** A hosted
        MCP connection can reach several Sites: the one it was approved on (its default) and the
        ones the person added on the consent screen or in Settings > AI agents, or every Site in
        the organisation when they chose that. A key still belongs to one Site, so the connection
        is a group of keys, one per Site. This lists the Sites of the connection the calling key
        is the sign-in of, and the state of each: `default`, `connected` (its key exists), `ready`
        (its key is registered on first use), `no_permission` or `agents_off`.

        The calling key must be the key a hosted sign-in minted. Which Sites a connection reaches
        is decided by a person in the dashboard, never through the API.
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      responses:
        "200":
          description: The connection's Sites.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [sites]
                        properties:
                          sites:
                            type: array
                            items:
                              type: object
                              required: [id, name, state]
                              properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                                primary_domain: { type: [string, "null"] }
                                state:
                                  type: string
                                  enum: [default, connected, ready, no_permission, agents_off]
                                key_prefix: { type: [string, "null"] }
                                key_generation: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: mintConnectionSiteKey
      tags: [API keys]
      summary: "Internal: register an AI connection's key for one of its Sites"
      description: |
        **Internal. Only the Writavo MCP service can call this; anyone else gets `403`.** Registers
        the key a hosted MCP connection uses on one of its further Sites, the first time an
        assistant works there. As with sign-in, the secret never travels: the service sends its
        SHA-256 hash and display prefix. The key gets the connection's permissions, limited to
        what the person who approved the connection may grant on that Site.

        This cannot widen a connection. The Site must already be one the person put in it (`ready`
        in `GET /auth/key/sites`); any other Site is `404`. Sending the same hash again answers
        `200` with the existing key.
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [website_id, key_hash, key_prefix]
              properties:
                website_id: { type: string, format: uuid }
                key_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
                key_prefix: { type: string, pattern: "^wv_sk_[A-Za-z0-9_-]{6}$" }
      responses:
        "200":
          description: The Site already had this key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionSiteKeyResponse" }
        "201":
          description: The key was registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionSiteKeyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /auth/key/revoke-oauth:
    post:
      operationId: revokeOauthKey
      tags: [Device sign-in]
      summary: "Internal: revoke the key behind a revoked MCP sign-in"
      description: |
        **Internal. Only the Writavo MCP service can call this; anyone else gets `403`.** When an AI
        client signs out of the hosted MCP server (it revokes its OAuth refresh token, RFC 7009),
        the MCP service calls this so the Writavo key behind that connection is revoked too and
        disappears from Settings > AI agents. It acts on OAuth-origin keys only, is idempotent, and
        can only ever end access, never grant it. To sign a key out yourself, use
        `POST /auth/key/revoke` with that key.
      security: []
      x-scope: none
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: auth
      x-publishable: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key_id]
              properties:
                key_id: { type: string, format: uuid }
      responses:
        "200":
          description: Done. `revoked` is false when there was nothing live to revoke.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [revoked]
                        properties:
                          revoked: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

# ============================================================================
# COMPONENTS
# ============================================================================
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <key>`.

        Two kinds of key, distinguished by their prefix:

        - **`wv_pub_`, publishable.** Safe in a browser or a mobile app. Read only, and it can
          only see content at `status: published`. It cannot read drafts, cannot write, and
          cannot see keys, usage, media, the pipeline queue or webhooks. The operations it may
          reach are marked `x-publishable: true`; everything else is `403 INSUFFICIENT_SCOPE`
          for a publishable key regardless of its scopes.
        - **`wv_sk_`, secret.** Server side only. Never ship one to a client, and never commit
          one. It can carry any scope.

        A secret key's authority is its creator's live permissions intersected with the scopes
        it was given. Narrowing or removing that person's access narrows every key they created,
        on the next request. A key never outranks the person who made it.

        Only a hash is stored. A lost key cannot be recovered, only rotated.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The opaque cursor from `data.next_cursor` on the previous page. Do not parse it or
        construct one; its encoding is not part of this contract and will change.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Page size. Values above the maximum are clamped rather than rejected, so a client asking
        for a thousand rows gets a hundred and a `next_cursor`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A unique key you generate per logical operation, 1 to 255 printable ASCII characters. A
        UUID is the obvious choice.

        Retry with the **same** key and the same body and you get the original response replayed
        rather than a second object. This is what makes a network timeout safe: you never know
        whether the first request landed, so you retry with the same key and find out.

        Same key with a **different** body is `409 IDEMPOTENCY_KEY_CONFLICT`, because reusing a
        key for different work is a bug in your client rather than a retry. Same key while the
        first request is still running is `409 IDEMPOTENCY_KEY_IN_FLIGHT`; wait and retry.

        Keys are scoped to the Site and the endpoint, and are retained for 24 hours. After that
        the same key is a new operation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The `ETag` from your last read of this object. If it has changed since then you get
        `412 PRECONDITION_FAILED` and your write is not applied, so two people editing the same
        article cannot silently overwrite each other.

        Optional in v1 for compatibility. Omitting it means last write wins. Send it.
      schema: { type: string }
    WritavoApproval:
      name: Writavo-Approval
      in: header
      required: false
      description: |
        The `error.approval.id` from a `428 APPROVAL_REQUIRED`, sent on the retry once a person
        has approved it. Only meaningful for a key approved for an AI agent; every other caller
        can leave it out. It is single use and bound to the key, to the exact request that
        asked for it (method, path and body) and to what that request would do: anything else,
        including a request whose effect changed since it was approved, is `409 APPROVAL_INVALID`.
      schema: { type: string, format: uuid }
    McpTool:
      name: Writavo-Mcp-Tool
      in: header
      required: false
      description: |
        The MCP tool that made this call, such as `delete_article`. Accepted on every operation.
        It is a decision input in one direction only, toward more gating: a request that carries
        it (or arrives through Writavo's hosted MCP server) is treated as an AI agent's request for
        approvals and for the AI agent call log, whatever key it uses, so approval-gated operations
        ask a person first even with a key made in the dashboard. The organisation's AI agent
        on/off switch still follows only the key's origin. It never widens what a request is
        allowed to do, and a value that is not a lower-case tool name is logged as unknown rather
        than refused.
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
    McpWorker:
      name: X-Writavo-Mcp-Worker
      in: header
      required: false
      description: |
        Sent only by Writavo's hosted MCP server, and required with `flow: "oauth"`. You do not
        have one and do not need one: leave it out and leave `flow` out.
      schema: { type: string }
    ImportId:
      name: import_id
      in: path
      required: true
      description: The import's id, as `POST /imports` returned it.
      schema: { type: string, pattern: "^imp_[A-Za-z0-9_-]{22}$" }
    ArticleId:
