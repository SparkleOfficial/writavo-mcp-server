              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: "#/components/schemas/ArticleRevisionSummary" } }
                          next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /articles/{id}/revisions/{revision_id}:
    parameters:
      - $ref: "#/components/parameters/ArticleId"
      - name: revision_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getArticleRevision
      tags: [Articles]
      summary: Read one revision
      description: The version in full, every field it recorded, to compare with the article or another revision.
      x-scope: articles:read
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      x-cross-tenant: 404
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ArticleRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /articles/{id}/revisions/{revision_id}/restore:
    parameters:
      - $ref: "#/components/parameters/ArticleId"
      - name: revision_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restoreArticleRevision
      tags: [Articles]
      summary: Put a revision back
      description: |
        Copies the revision's title, body, excerpt, images, SEO fields, structured blocks, category
        and author back onto the article, as a new change (itself a revision, `source: restore`, so
        it can be undone the same way). The status never changes: restoring a published article
        changes the live page, and its cache is cleared. Emits `article.updated`.
      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
