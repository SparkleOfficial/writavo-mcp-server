            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [typescript, schema_version, types]
                        properties:
                          typescript: { type: string, description: The file's contents. }
                          schema_version: { type: integer, description: Grows whenever any type changes; regenerate when it moves. }
                          types: { type: integer, description: How many content types it describes. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /content-types/{api_id}:

    parameters:

      - name: api_id
        in: path
        required: true
        description: The content type's API id.
        schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$", examples: ["product"] }

    get:
      operationId: getContentType
      tags: [Content types]
      summary: Read a content type
      description: |
        One content type with its fields. The `ETag` header versions it for `If-Match`.
      x-scope: entries:read
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: true
      responses:
