        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      operationId: updateKnowledgeProfile
      tags: [Site settings]
      summary: Change the knowledge profile
      description: |
        Change the brand voice, product description or target audience (plain text up to 4000
        characters each), the product knowledge (up to 20000), the niche keywords (up to 60, each 1 to
        60 characters) or any of the `prompt_vars`. Send at least one field; `null` clears a text field.
        `prompt_vars` is merged: only the keys you send change, each value is text up to 600
        characters, `null` or `""` sets that key back to its generic default, and an unknown key is
        `422` naming `prompt_vars.<key>`. Once edited the profile is marked as written by a person
        (`is_auto_generated: false`) and brand discovery only ever fills what is still empty.

        Send `If-Match` with the `ETag` from your last read, so an edit a person made in the dashboard
