  /articles/cost-history:
    post:
      operationId: setArticleCostHistoryBulk
      tags: [Articles]
      summary: Set the imported cost history of many articles
      description: |
        `setArticleCostHistory` for up to 100 articles in one call, so a migrated blog whose
        articles are already live backfills what they cost without one request per article. Each
        item names ONE article of this Site by `external_id` (what an import sets), or by `slug`
        or `id`, and carries the same `entries` as the single route.

        Per article it behaves exactly like the single route: the entries REPLACE that article's
        imported history (sending the same call again changes nothing, an empty list clears it),
        each entry is checked on its own, and it is history for display only, never billed or
        counted against a spend cap or credits.

        An item that matches no article of this Site is reported `not_found` and the others are
        still written; an item that is malformed, or names an article an earlier item in the call
        already names, is `invalid`. `dry_run: true` resolves every item and checks every entry
        and writes nothing. Read one article's result back with `GET /insights/articles/{id}/costs`.
      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                dry_run: { type: boolean, default: false, description: "Resolve and check everything, write nothing." }
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [entries]
                    additionalProperties: false
                    description: Name the article with exactly one of `external_id`, `slug` or `id`.
                    properties:
                      external_id: { type: string, description: "The id the article was imported with." }
                      slug: { type: string }
                      id: { type: string, format: uuid }
                      entries:
                        type: array
                        maxItems: 500
                        items:
                          type: object
                          required: [cost_usd]
                          additionalProperties: false
                          properties:
                            cost_usd: { type: number, minimum: 0, maximum: 100000, description: "What it cost, in US dollars." }
                            stage: { type: string, maxLength: 60, description: "What it paid for: research, generate, images..." }
                            provider: { type: string, maxLength: 60, description: "Who was paid: openai, dataforseo..." }
                            calls: { type: integer, minimum: 0 }
                            tokens: { type: integer, minimum: 0 }
                            occurred_on: { type: string, format: date, description: "Not in the future; not before 1990." }
                            description: { type: string, maxLength: 500 }
            examples:
              backfill:
                value:
                  items:
                    - { external_id: "blogify-1041", entries: [ { stage: generate, provider: openai, cost_usd: 0.0421, occurred_on: "2026-05-10" } ] }
                    - { external_id: "blogify-1042", entries: [ { stage: images, provider: replicate, cost_usd: 0.06, calls: 3 } ] }
      responses:
        "200":
          description: What happened to each item, in the order sent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [dry_run, written, not_found, invalid, results]
                        properties:
                          dry_run: { type: boolean }
                          written: { type: integer, description: "Articles written (or, in a dry run, that would be)." }
                          not_found: { type: integer }
                          invalid: { type: integer }
                          results:
                            type: array
                            items:
                              type: object
                              required: [index, status]
                              properties:
                                index: { type: integer, description: "The item's position in `items`." }
                                status: { type: string, enum: [written, would_write, not_found, invalid] }
                                article_id: { type: string, format: uuid }
                                entries: { type: integer, description: "How many entries the article now holds." }
                                imported_total_usd: { type: number }
                                error: { type: string, description: "Why the item was not_found or invalid." }
                                problems:
                                  type: array
                                  description: Entries that were skipped, by their position in the item's `entries`.
                                  items:
                                    type: object
                                    properties:
                                      index: { type: integer }
                                      error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /articles/bulk-delete:
    post:
      operationId: bulkDeleteArticles
      tags: [Articles]
      summary: Delete many articles
      description: |
        Deletes up to 100 articles in one call, permanently, exactly as `DELETE /articles/{id}`
        does for each: the row, its tag assignments and the redirects that point at it go, and a
        published article's URL starts returning 404 on your blog once the cache is purged. There
        is no trash and no undo; to take posts off the web and keep them, unpublish them instead.

        Each id is deleted exactly as the single `DELETE` does it, with its own audit entry and
        webhook. An id that names no article on this Site, whether it never existed, was already
        deleted or belongs to another Site, is listed in `not_found`. A repeated id counts once. If
        one article cannot be deleted it is listed in `failed` with the error the single delete
        would have returned, and the rest of the list still runs.

        `dry_run: true` deletes nothing and returns the same report: `deleted` then lists the ids
        that would be deleted.

        **When an AI agent asks.** A key approved for an AI assistant (a device or OAuth sign-in),
        or any request from an MCP client, gets `428 APPROVAL_REQUIRED` on the first try while the
        organisation requires approvals, with `error.approval.url` for a person to approve or deny
        in the dashboard. ONE approval covers the whole list: the person sees how many articles and how many of them are published.
        Retry the same request with `Writavo-Approval: <error.approval.id>` once they have. The
        approval is for the exact articles that existed on this Site when it was asked: if one of
        them has since been deleted, the retry is `409 APPROVAL_INVALID` and you ask again. When
        none of the ids is an article on this Site, or on a dry run, no approval is asked for
        and the report comes back directly. Other callers are unaffected.
      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-writavo-approval: article.delete
      x-writavo-approval-kind: destructive
      x-agent-consequence: Permanently deletes every article in the list; each published one disappears from the live blog.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/WritavoApproval"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDeleteInput" }
            examples:
              list:
                summary: Delete two articles
                value:
                  ids:
                    - "4f6b2c1e-8a3d-4e5f-9b7a-1c2d3e4f5a6b"
                    - "9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d"
      responses:
        "200":
          description: What happened to each id. Every id sent appears in exactly one list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/BulkDeleteResult" }
              examples:
                report:
                  summary: One deleted, one not on this Site
                  value:
                    ok: true
                    data:
                      deleted: ["4f6b2c1e-8a3d-4e5f-9b7a-1c2d3e4f5a6b"]
                      not_found: ["9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d"]
                      failed: []
                      dry_run: false
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/ApprovalRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /articles/{id}/link-rel:
    parameters:
      - $ref: "#/components/parameters/ArticleId"
    post:
      operationId: setArticleLinkRel
      tags: [Articles]
      summary: Set one link in an article to dofollow, nofollow or sponsored
      description: |
        Say whether one link in an article passes ranking credit. `rel` is `follow` (dofollow),
        `nofollow`, `sponsored` (a paid or swapped link), `ugc`, or `null` to clear the choice so the
        Site's rule decides again. Every link in the article to `target_url` is set. Find the link
        and its exact `target_url` with `listArticleLinks`.

        The rule, which the hosted blog and `content_html` both follow: what is set here wins; else a
        link to the Site's own pages is followed; else a link to another site takes the Site's
        `external_link_rel` (`PATCH /site/settings`).

        The choice is stored in the link's Markdown title, as `[text](https://example.com "rel:nofollow")`,
        and is taken out again when the page is rendered. So it is an edit to the article: it makes a
        revision, and on a published article it is live at once. Writing that title yourself with
        `updateArticle` does the same thing. `changed` is how many links were rewritten; 0 means the
        article already said so.
      x-scope: articles:write
      x-permission: articles.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-cross-tenant: 404
      x-mcp-surface: action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_url, rel]
              additionalProperties: false
              properties:
                target_url:
                  type: string
                  maxLength: 2000
                  description: The link's address, exactly as `listArticleLinks` returns it (a full URL or a path).
                rel:
                  type: [string, "null"]
                  enum: [follow, nofollow, sponsored, ugc, null]
                  description: "`null` clears the choice."
      responses:
        "200":
          description: What was changed.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [article_id, target_url, rel, changed]
                        properties:
                          article_id: {type: string, format: uuid}
                          target_url: {type: string}
                          rel: {type: [string, "null"]}
                          changed: {type: integer, description: How many links in the article were rewritten.}
                          updated_at: {type: string, format: date-time}
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

