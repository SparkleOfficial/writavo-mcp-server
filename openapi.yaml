  # ==========================================================================
  # PIPELINE: CONFIGURATION, CONTENT PLAN AND REQUEUE (MCP-3)
  # ==========================================================================
  /pipeline/config:
    get:
      operationId: getPipelineConfig
      tags: [Pipeline]
      summary: Read the pipeline configuration
      description: |
        Whether the AI pipeline runs on its own for this Site, and how hard: the publish mode, the daily
        publish limit, the batch size, the rewrite attempts and the quality threshold, the competitor
        source pass mark and its weights and the minimum originality, plus when it next runs and whether
        a run is in flight. Read this before `PATCH /pipeline/config`.
      x-scope: pipeline:read
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      x-mcp-surface: action
      responses:
        "200":
          description: The pipeline configuration.
          headers:
            ETag:
              description: The concurrency token for this version.
              schema: {type: string}
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PipelineConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      operationId: updatePipelineConfig
      tags: [Pipeline]
      summary: Change the pipeline configuration
      description: |
        Turn the AI pipeline on or off, or change how much it does. Send at least one field. While the
        pipeline is on it writes articles from the content plan every 10 minutes, up to `batch_size` at a
        time, and every article spends credits; in `auto` mode finished articles go live on the blog
        without review, up to `articles_per_day` a day.

        Turning it on checks the plan first: a plan without AI generation is `402 NOT_ENTITLED` rather
        than a switch that silently does nothing. Turning it off, or any change while it stays off, is
        never gated and never spends anything.

        The response carries `warnings`. Turning the pipeline on while the AI writing profile has gaps
        (see `gaps` on `GET /site/knowledge-profile`) still turns it on, and adds a
        `KNOWLEDGE_PROFILE_INCOMPLETE` warning: until the profile is filled in, articles are written
        with generic placeholders instead of the brand's details.

        **These settings are a shortcut into the article recipe** (see `GET /pipeline/recipe`). Since
        openapi 1.4.0 the recipe is what the pipeline follows: every field here except
        `pipeline_enabled` and `batch_size` is written as a new live recipe version (the equivalent of a
        draft switched on), which is refused with `409 CONFLICT` while a recipe draft is open. A field
        the Site's recipe cannot carry is `422` (for example `source_score_threshold` when its ideas do
        not come from competitor blogs).

        The three competitor source knobs: `source_score_threshold` (0-100) is the SEO score a
        competitor article must reach before it is scraped and rewritten, `seo_score_weights` says how
        much each metric counts toward that score, and `min_originality_pct` (0-100) is the share of
        5-word phrases that must not be copied from the competitor article before an article can
        publish.

        Send `If-Match` with the `ETag` from your last read.

        **When an AI agent asks.** A key from a device or OAuth sign-in, or any request from an MCP
        client, always gets `428 APPROVAL_REQUIRED` on the first try, whatever the organisation's
        approvals switch says, because it spends money or credits. Asked only when the result is a
        running pipeline that does more than before: turning it on, raising `batch_size`,
        `articles_per_day`, `max_auto_improve_attempts`, `quality_score_threshold` or
        `min_originality_pct`, lowering `source_score_threshold`, changing `seo_score_weights`, or
        switching `publish_mode` to `auto`. Turning it off is never asked. Give the person
        `error.approval.url`; once they approve, repeat the identical request with `Writavo-Approval:
        <error.approval.id>`. The approval is void if what the request would do changes before the
        retry. A key made in the dashboard is asked only when the request comes from an MCP client.
      x-scope: pipeline:config
      x-permission: pipeline.config
      x-entitlement: ai.article_generation
      x-spends-credits: true
      x-rate-limit-class: write
      x-publishable: false
      x-writavo-approval: pipeline.configure
      x-writavo-approval-kind: money
      x-writavo-approval-always: true
      x-writavo-approval-when: 'Asked only when the result is a running pipeline that does more than before: turning it on, raising `batch_size`, `articles_per_day`, `max_auto_improve_attempts`, `quality_score_threshold` or `min_originality_pct`, lowering `source_score_threshold`, changing `seo_score_weights`, or switching `publish_mode` to `auto`. Turning it off is never asked.'
      x-agent-consequence: The AI pipeline writes more articles, or starts writing them, and spends the organisation's credits on each one; in auto mode they go live without review.
      x-mcp-surface: action
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/WritavoApproval" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineConfigUpdate" }
      responses:
        "200":
          description: The updated configuration.
          headers:
            ETag:
              description: The new concurrency token.
              schema: {type: string}
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data:
                        allOf:
                          - { $ref: "#/components/schemas/PipelineConfig" }
                          - type: object
                            required: [warnings]
                            properties:
                              warnings:
                                type: array
                                items: { $ref: "#/components/schemas/PipelineWarning" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/ApprovalRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /pipeline/steps:
    get:
      operationId: listRecipeSteps
      tags: [Pipeline]
      summary: List the steps a recipe can use
      description: |
        The step catalogue for article recipes. A recipe is the Site's pipeline as data: steps in seven
        fixed sections (where ideas come from, which ideas to keep, research, writing, checks, finishing
        touches, publishing). Every step here is one Writavo built and priced; there is no custom code.

        Each step lists its section, what it works with (`produces` for an ideas step, `accepts` for the
        rest, `only_with_ideas` / `only_with_writers` where it needs a particular partner), its settings
        (type, range, default, a plain label) and what one run costs in credits. `locked` steps are
        added by Writavo wherever they apply and cannot be removed. A step whose `status` is
        `coming_soon` cannot be used yet.

        Read this before writing a recipe with `POST /pipeline/recipe/draft`.
