                      data: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteCategory
      tags: [Categories]
      summary: Delete a category
      description: |
        **Deleting several?** Use `bulkDeleteCategories` (POST .../bulk-delete): up to 100 categories in one
        call, and an AI agent needs ONE approval for the whole list instead of one per item.

        Articles in this category are **not** deleted. Their `category_id` becomes `null`, so
        they stay published and simply lose their category. Removing a category never removes
        content.

        **When an AI agent asks.** A key approved for an AI assistant (a device or OAuth sign-in),
        or any request from an MCP client, gets `428 APPROVAL_REQUIRED` on the first try while the
        organisation requires approvals, with `error.approval.url` for a person to approve or deny
        in the dashboard. Retry the same request with `Writavo-Approval: <error.approval.id>` once
        they have. Other callers are unaffected.
      x-scope: taxonomy:write
      x-permission: taxonomy.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-writavo-approval: category.delete
      x-writavo-approval-kind: destructive
      x-agent-consequence: Permanently deletes the category; its articles keep their content and lose the category.
      x-cross-tenant: 404
      parameters:
        - $ref: "#/components/parameters/WritavoApproval"
      responses:
        "204":
          description: Deleted. No body.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "428": { $ref: "#/components/responses/ApprovalRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

