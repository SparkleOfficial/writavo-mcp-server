        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /content-types/apply:
    post:
      operationId: applyContentSchema
      tags: [Content types]
      summary: Apply a whole schema
      description: |
        The declarative way to manage content types, for a schema kept in a file: send the types you
        want and Writavo works out what to create and change. Types you leave out are kept, unless
        `delete_missing` is true. Send `dry_run: true` first: you get the plan (what is created,
        changed, deleted and how many entries each change touches) and every problem, and nothing is
        written. A dry run that finds problems still answers 200, with `ok: false` and the errors;
        a real run with problems is `422 VALIDATION_FAILED` and writes nothing.

        Schema changes never rewrite entries, with one exception you ask for: a field with
        `renamed_from` moves the old field's stored values to the new name. A removed field's values
        stay stored but are no longer returned; a field whose type changed keeps its values, and an
        entry whose value no longer fits must be fixed when it is next saved. A type's `kind` never
        changes, and a type that still has entries cannot be deleted.

        `GET /content-types` returns types in exactly the shape this accepts, so read, edit and send
        back. From the CLI: `writavo apply-content-schema --body-file schema.json`, where the file is
        `{ "types": [...], "dry_run": true }`.
      x-scope: content_types:write
      x-permission: content_types.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-agent-consequence: "Changes the Site's content types: fields may be added, renamed or removed, and with delete_missing whole types are deleted."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [types]
              properties:
                types:
                  type: array
                  maxItems: 100
                  items: { $ref: "#/components/schemas/ContentTypeInput" }
                dry_run: { type: boolean, default: false, description: "Report the plan and every problem; write nothing." }
                delete_missing: { type: boolean, default: false, description: "Delete stored types this list does not name." }
      responses:
        "200":
          description: The plan, and on a real run the resulting types.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ContentSchemaResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /content-types/typescript:

    get:
      operationId: getContentTypesTypescript
      tags: [Content types]
      summary: Generate TypeScript types
      description: |
        One self-contained TypeScript file describing every content type: an interface per type and
        component, `ContentTypes` (API id to interface) and a generic `Entry<T>`. Required fields are
        required in the types, which is what a published entry guarantees. Save `typescript` to a
        `.ts` file in your front end (from the CLI, `writavo get-content-types-typescript`; the file is
        the `typescript` value).
      x-scope: entries:read
      x-permission: content_types.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: false
      responses:
        "200":
