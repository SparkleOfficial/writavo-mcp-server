                    properties:
                      data: { $ref: "#/components/schemas/VisitorAnalytics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /analytics/install-check:
    post:
      operationId: checkAnalyticsInstall
      tags: [Analytics]
      summary: Check that the analytics script is installed on a page
      description: |
        Fetch one page the way a search engine would (server HTML, no JavaScript) and check, in this
        order: `page_reachable` (it answers 2xx with HTML), `tag_present` (a script whose src ends in
        `/api/a/s`), `site_id_matches` (its `data-site` is this Site's id, not another Site's),
        `collector_public` (it loads over https from the public collector, not localhost),
        `include_matches` (when the tag has `data-include`, the pattern is valid and matches this
        page's path), `collecting_enabled` (collecting is on, and the host the page ends on counts)
        and `recent_events` (an event arrived in the last 24 hours). Each check has a sentence saying
        what to fix.

        `status` is `failed` when the page will not be counted (`page_reachable`, `tag_present`,
        `site_id_matches` or `collecting_enabled` failed), `warning` when anything else failed, and
        `ok` otherwise. No events yet is only a warning: the script stays silent on localhost, 127.x
        and file: pages and in automated browsers, so a fresh install needs one real visit in an
        ordinary browser. A script added only in the browser after the page loads (a tag manager, a
        lazy `next/script`) is not in the server HTML, so `tag_present` fails even though visits may
        still arrive; `recent_events` and `GET /analytics/setup` show whether they do.

        `url` defaults to the Site's first verified custom domain, else its primary domain. Its host
        must be one this Site counts visits from (`allowed_domains` in `GET /analytics/setup`),
        otherwise `422` on `url`: add the domain with `PATCH /analytics/settings` first. Free; one page
        fetch of at most 2 MB, following up to three redirects.
      x-scope: insights:read
      x-permission: analytics.view
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsInstallCheckInput" }
            examples:
              one_page:
                summary: Check one article page
                value: { url: "https://example.com/blog/how-to-choose-a-headless-cms" }
      responses:
        "200":
          description: The verdict, with every check.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnalyticsInstallCheck" }
              examples:
                installed_no_visits:
                  summary: Installed, waiting for a first real visit
                  value:
                    ok: true
                    data:
                      url: https://example.com/blog/how-to-choose-a-headless-cms
                      final_url: https://example.com/blog/how-to-choose-a-headless-cms
                      status: warning
                      checks:
                        - { key: page_reachable, ok: true, message: The page answered HTTP 200 with HTML. }
                        - { key: tag_present, ok: true, message: Found the analytics script tag in the page's HTML. }
                        - { key: site_id_matches, ok: true, message: data-site is this Site's id (wa_0123456789abcdef01234567). }
                        - { key: collector_public, ok: true, message: The script loads from the public collector (https://blog.writavo.com). }
                        - { key: include_matches, ok: true, message: "no data-include: every page the script runs on is counted." }
                        - { key: collecting_enabled, ok: true, message: Collecting is on for this Site. }
                        - { key: recent_events, ok: false, message: No events have arrived in the last 24 hours. Open the page once in an ordinary browser and check again. }
                      script:
                        found: true
                        src: https://blog.writavo.com/api/a/s
                        site_id: wa_0123456789abcdef01234567
                        data_include: null
                        data_api: null
                      install:
                        last_event_at: null
                        last_event_host: null
                        last_event_path: null
                        events_24h: 0
                        rejected_hosts: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ==========================================================================
  # COMMENTS (0159)
  # ==========================================================================
  /comments/posts/{slug}:
    get:
      operationId: getPostComments
      tags: [Comments]
      summary: Read an article's approved comments
      description: |
        The approved comments on one published article, oldest first, for a site that renders its own
        pages: `parent_id` is null for a comment and the comment's id for a reply (one level of
        replies). `enabled` says whether the Site has comments on, `open` whether this article still
        takes new ones (a Site can close comments some days after publishing), and `require_email`
        whether a new comment needs an email address. With comments off, `enabled` is false and the
        list is empty even if comments were approved earlier. Email addresses are never included.
        Safe for a publishable key. An unknown or unpublished slug is `404`.
      x-scope: articles:read
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: true
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string, maxLength: 200}
          description: The article's slug.
      responses:
        "200":
          description: The article's comments.
          content:
            application/json:
