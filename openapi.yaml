  /content-types:

    get:
      operationId: listContentTypes
      tags: [Content types]
      summary: List content types
      description: |
        The Site's content types: collections (many entries), singletons (one entry), components
        (reusable groups of fields used inside other types) and, if the Site has them, its custom
        article fields (kind `article_fields`, API id `article`). At most 100, so this is not paginated.

        Until API version 1.5.0 this path listed article formats; those are now `GET /formats`.
