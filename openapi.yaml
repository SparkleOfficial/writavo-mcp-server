                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ContentType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      operationId: updateContentType
      tags: [Content types]
      summary: Change a content type
      description: |
        Change one content type. A top-level key you leave out (name, description, title field)
        keeps its value; `fields`, when you send it, is the whole field list, in order. The API id
        and kind cannot change. Send `If-Match` with the `ETag` you read
        (or `expected_version`) so a concurrent edit is `412 PRECONDITION_FAILED` rather than lost.
        The rules of `POST /content-types/apply` apply: `renamed_from` moves values; nothing else rewrites
        entries.
      x-scope: content_types:write
      x-permission: content_types.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-agent-consequence: "Changes a content type's fields; removed fields' values stop being returned (they stay stored)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ContentTypeUpdate" }
      responses:
        "200":
          description: The changed content type.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ContentType" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      operationId: deleteContentType
      tags: [Content types]
      summary: Delete a content type
      description: |
        Delete a content type. Refused with `409 CONFLICT` while it has entries (delete them first) or
        while another type uses it (a reference to it, or a component field). Deleting the `article`
        type removes the custom article fields from the schema; the values stay stored on the articles.
      x-scope: content_types:write
      x-permission: content_types.manage
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      x-agent-consequence: "Permanently deletes the content type definition. It must have no entries."
      responses:
        "204": {description: Deleted. No body.}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  /entries/{type}:

    parameters:

      - name: type
        in: path
        required: true
        description: The API id of the entry's content type (a collection or singleton).
        schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$", examples: ["product"] }

    get:
      operationId: listEntries
      tags: [Entries]
      summary: List entries
      description: |
        Entries of one content type, newest updated first, cursor paginated. A publishable key sees
        published entries only.

        Filter with `filter[<field>]=<value>` on a top-level field of the type (equality; for a list
        field, membership), up to five. Numbers and `true` / `false` are matched as such.
      x-scope: entries:read
      x-permission: none
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: read
      x-publishable: true
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [draft, scheduled, published] }
        - name: slug
          in: query
          required: false
          schema: { type: string }
        - name: external_id
          in: query
          required: false
          schema: { type: string }
        - name: order
          in: query
          required: false
          description: "`updated_at`, `created_at` or `published_at` (needs `status=published`); a leading `-` for newest first."
          schema: { type: string, default: "-updated_at", enum: ["-updated_at", updated_at, "-created_at", created_at, "-published_at", published_at] }
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          description: "`filter[field]=value`, at most five."
          schema: { type: object, additionalProperties: { type: string } }

        - name: expand
          in: query
          required: false
          description: |
            Comma separated reference and media fields to expand: their ids become the objects they point
            at (one level). An entry has `_type` set to its content type; an article, page, category, tag,
            author or media item has `_type` set to that name. A target that is gone, or that a
            publishable key may not see, becomes `null` (and drops out of a list).
          schema: { type: string, examples: ["related,author"] }
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - type: object
                    properties:
                      data:
                        allOf:
                          - { $ref: "#/components/schemas/Page" }
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      operationId: createEntry
      tags: [Entries]
      summary: Create an entry
      description: |
        Create an entry of this content type. It is a draft unless you send `status: published`, which
        publishes it in the same step (and so must pass the type's `required` rules). A draft is checked
        for shape and type but may leave required fields empty. Fields you leave out take their
        `default`. A singleton takes one entry; a second is `409 CONFLICT`.

        Problems are `422 VALIDATION_FAILED` with `error.fields` keyed by the value's path, for example
        `data.price` or `data.body[2].label`. A slug another entry of this type uses is `409 SLUG_CONFLICT`.

        An entry is a document on the CMS meter, like an article. Over the included allowance it bills;
        it is refused only when there is no way to bill it (`402 PAYMENT_METHOD_REQUIRED`).
      x-scope: entries:write
      x-permission: entries.write
      x-entitlement: none
      x-spends-credits: false
      x-rate-limit-class: write
      x-publishable: false
      parameters:
