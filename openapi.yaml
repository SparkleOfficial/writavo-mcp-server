        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/ApprovalRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Maintenance" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ==========================================================================
  # OUTREACH, READ ONLY (MCP-3)
  # ==========================================================================
  /seo/link-exchanges:
    get:
      operationId: listLinkExchanges
      tags: [SEO]
      summary: List link exchanges
      description: |
        Every link swap this Site has recorded with another site, each with both sides checked and one
        verdict in `health`. Neither side is typed in: `our_link` is read from the Site's published
        articles, and `their_link` from the partner's page (when the exchange names one) or from the
        backlink profile (when it does not).

        `health` is one of `balanced` (both links are live and theirs is followed),
        `their_link_nofollow`, `their_link_removed` (their link was seen and is gone while yours is
        still up), `waiting_on_them` (yours is live, theirs was never seen), `waiting_on_us`,
        `not_started`, `could_not_check` (their page could not be read, which proves nothing) and
        `closed`. The first three after `balanced` set `needs_attention`.

        `our_link.followed` says whether your side of the swap passes ranking credit: `true` when at
        least one of your links to the partner is followed. `external_link_default` is the Site's
